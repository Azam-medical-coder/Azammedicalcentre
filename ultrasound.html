<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azam Ultrasound - Dr. Zeeshan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#eef4ff;padding:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px auto;max-width:1100px;box-shadow:0 6px 18px #0001}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:2px solid #cbd5e1;margin:6px 0;font-size:14px}
.btn{background:linear-gradient(90deg,#1e90ff,#7c3aed);color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;font-size:16px;margin-top:8px}
.btn2{background:#ff3b30;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;margin:8px 0}
.small{padding:8px 12px;border-radius:8px;border:none;margin:3px;font-weight:700;cursor:pointer;color:#fff}
.report{border:2px solid #0a4eb5;border-radius:12px;padding:16px;background:#fff;line-height:1.8;white-space:pre-wrap}
@media print{body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>

<div class="card" style="text-align:center;border:3px solid #1e90ff;position:relative">
<img src="https://azam-medical-coder.github.io/Azammedicalcentre/logo.png" onerror="this.style.display='none'" style="position:absolute;left:15px;top:15px;width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #0a4eb5">
<h2 style="color:#0a4eb5">Azam Medical Centre</h2>
<p>Plot 27, Allama Iqbal Road, Manzoor Colony, Karachi - 02135386116</p>
<h3 style="color:#000">Dr. Muhammad Zeeshan - MBBS, RMP, Sonologist</h3>
<p>Timings: 4PM to 10PM</p>
</div>

<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<input id="pName" placeholder="Patient Name *">
<input id="pAge" placeholder="Age">
<select id="pGen"><option>Male</option><option>Female</option><option>Child</option></select>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<input id="pDate" type="date">
<select id="uType"></select>
</div>
<input id="ref" placeholder="Referred By Dr.">

<input type="file" id="wordUp" accept=".docx" style="display:none">
<button class="btn2" onclick="document.getElementById('wordUp').click()">📄 Apni Word File (.docx) Se Template Update Karen</button>

<b style="font-size:13px;display:block;margin-top:10px">Report Pattern (Editable) - __ me size likhen:</b>
<textarea id="rText" rows="18" style="font-family:monospace;font-size:13px"></textarea>
<button class="btn" onclick="make()">✅ Final Report Banayen</button>
</div>

<div class="card" id="outCard" style="display:none">
<div id="out" class="report"></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
<button class="small" style="background:#0a4eb5" onclick="window.print()">Print</button>
<button class="small" style="background:#f59e0b" onclick="pdf()">PDF Download</button>
</div>
</div>

<script>
let T={
"Whole abdomen":`ULTRASOUND WHOLE ABDOMEN
LIVER: Normal in size __ cm, homogenous texture, no focal lesion.
GALL BLADDER: Normally distended, no calculus, wall thickness normal.
PANCREAS: Normal in size and texture.
SPLEEN: Normal __ cm.
RIGHT KIDNEY: __ x __ cm, no calculus, no hydronephrosis.
LEFT KIDNEY: __ x __ cm, no calculus, no hydronephrosis.
URINARY BLADDER: Normal, no calculus.
PROSTATE: __ gm, normal.
No ascites, no lymphadenopathy.
IMPRESSION: Normal Ultrasound Whole Abdomen.`,

"Upper abdomen":`ULTRASOUND UPPER ABDOMEN
LIVER: __ cm, homogenous, no focal lesion.
GALL BLADDER: Normal distended, no stone.
PANCREAS: Normal.
SPLEEN: __ cm, normal.
BOTH KIDNEYS: Normal.
No ascites.
IMPRESSION: Normal Upper Abdomen.`,

"Lower abdomen":`ULTRASOUND LOWER ABDOMEN
URINARY BLADDER: __ cc, wall thickness normal.
PROSTATE: __ gm.
BOTH KIDNEYS: Normal.
No free fluid.
IMPRESSION: Normal Lower Abdomen.`,

"KUB":`ULTRASOUND KUB
RIGHT KIDNEY: __ x __ cm, no calculus, no hydronephrosis.
LEFT KIDNEY: __ x __ cm, no calculus, no hydronephrosis.
URINARY BLADDER: Pre-void __ cc, Post-void __ cc, no calculus.
IMPRESSION: Normal KUB.`,

"KUB + Prostate":`ULTRASOUND KUB + PROSTATE
RIGHT KIDNEY: __ x __ cm, no calculus.
LEFT KIDNEY: __ x __ cm, no calculus.
URINARY BLADDER: __ cc, normal.
PROSTATE: __ gm, __ x __ x __ cm, normal echotexture, no focal lesion.
Post-void residual __ cc.
IMPRESSION: __`,

"Prostate":`ULTRASOUND PROSTATE
PROSTATE: __ gm, measures __ x __ x __ cm.
Echotexture: Homogenous.
No focal lesion, no calcification.
Urinary bladder normal.
IMPRESSION: __`,

"Pelvis":`ULTRASOUND PELVIS
UTERUS: __ x __ cm, Anteverted, ET __ mm.
OVARIES: Right __ x __ cm, Left __ x __ cm.
No adnexal mass, no free fluid in POD.
IMPRESSION: Normal Pelvic Scan.`,

"FWB":`ULTRASOUND FWB (Fetal Well Being)
Single live intrauterine fetus, Cephalic presentation.
BPD __ mm, FL __ mm, AC __ mm = __ weeks.
AFI __ cm, Placenta __, Estimated weight __ gm.
IMPRESSION: Single live pregnancy __ weeks.`,

"Thyroids":`ULTRASOUND THYROID
RIGHT LOBE: __ x __ x __ cm.
LEFT LOBE: __ x __ x __ cm.
ISTHMUS: __ mm.
Echotexture homogenous, no nodule.
No lymphadenopathy.
IMPRESSION: Normal Thyroid Scan.`,

"Breasts":`ULTRASOUND BREASTS
Both breasts normal fibroglandular pattern.
No focal lesion, no ductal dilatation.
No axillary lymphadenopathy.
IMPRESSION: Normal Breast Scan.`,

"Axila":`ULTRASOUND AXILLA
RIGHT AXILLA: No lymphadenopathy.
LEFT AXILLA: No lymphadenopathy.
No collection, no mass.
IMPRESSION: Normal Axillary Scan.`,

"Neck":`ULTRASOUND NECK
Thyroid normal, no lymphadenopathy.
No collection, salivary glands normal.
IMPRESSION: Normal Neck Scan.`,

"Doppler study":`DOPPLER STUDY
Artery: Normal flow, PSV __, EDV __, RI __.
Vein: Normal compressibility, normal flow.
No thrombus, no stenosis.
IMPRESSION: Normal Doppler Study.`
};

let custom=JSON.parse(localStorage.getItem('custom_templates')||'{}');
Object.assign(T,custom);

function init(){
 let s=document.getElementById('uType'); s.innerHTML='';
 Object.keys(T).forEach(k=>{let o=document.createElement('option'); o.value=k; o.textContent=k; s.appendChild(o);});
 document.getElementById('pDate').valueAsDate=new Date();
 if(Object.keys(T).length>0) document.getElementById('rText').value=T[Object.keys(T)[0]];
}
function load(){ document.getElementById('rText').value=T[document.getElementById('uType').value]||'' }
document.getElementById('uType').addEventListener('change',load);

document.getElementById('wordUp').addEventListener('change', async (e)=>{
 let file=e.target.files[0]; if(!file) return;
 let buf=await file.arrayBuffer();
 let res=await mammoth.extractRawText({arrayBuffer:buf});
 let txt=res.value.trim();
 if(txt.length<20){ alert('File khali hai'); return; }
 let name=file.name.replace('.docx','').replace('.doc','');
 T[name]=txt;
 let saved=JSON.parse(localStorage.getItem('custom_templates')||'{}'); saved[name]=txt; localStorage.setItem('custom_templates',JSON.stringify(saved));
 let s=document.getElementById('uType');
 if(![...s.options].some(o=>o.value==name)){ let o=document.createElement('option'); o.value=name; o.textContent=name+' (Imported)'; s.appendChild(o); }
 s.value=name; document.getElementById('rText').value=txt;
 alert('Template "'+name+'" update ho gaya!');
 e.target.value='';
});

function make(){
 let header=`Azam Medical Centre\nPlot 27, Allama Iqbal Road, Manzoor Colony, Karachi - 02135386116\n\nPatient: ${pName.value} Age: ${pAge.value} / ${pGen.value}\nDate: ${pDate.value} Ref By: ${ref.value}\nType: ${uType.value}\n--------------------------------------------------\n\n`;
 let footer=`\n\n\n--------------------------------------------------\nDR. M. ZEESHAN\nMBBS, DIP SONOGRAPHY\nGP & SONOLOGIST`;
 document.getElementById('out').innerText=header+rText.value+footer;
 document.getElementById('outCard').style.display='block';
 window.scrollTo(0,document.body.scrollHeight);
}
function pdf(){const{jsPDF}=window.jspdf; let doc=new jsPDF(); let t=document.getElementById('out').innerText; let l=doc.splitTextToSize(t,180); doc.text(l,10,10); doc.save((pName.value||'Report')+'.pdf')}
init();
</script>
</body>
</html>
