function gapiLoaded(){gapi.load('client', async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});}catch(e){}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:''});}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken())); res(r);}};tokenClient.requestAccessToken({prompt:'consent'});});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports', mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}

function calcEDD(){ let lmp=document.getElementById('lmp').value; if(!lmp)return; let d=new Date(lmp); d.setDate(d.getDate()+280); document.getElementById('gaResult').value='EDD: '+d.toISOString().slice(0,10); }

if(n.includes("Suspicious Mass")) return "Adv: Mammography, FNAC / Core biopsy, CECT Chest if needed, Urgent Surgeon / Oncologist opinion.";
if(n.includes("THYROID")) return "Adv: TFTs (T3 T4 TSH), Anti-TPO, FNAC of nodule if >1 cm, Surgeon / ENT / Endocrine opinion, Neck USG follow up.";
if(n.includes("SCROTUM")||n.includes("Hydrocele")||n.includes("Varicocele")) return "Adv: Urine R/E, Semen analysis if varicocele, Urologist / Surgeon opinion, Scrotal support, Avoid heavy weight lifting.";
if(n.includes("Epididymitis")||n.includes("Orchitis")) return "Adv: CBC, CRP, Urine R/E, Urine C/S, Scrotal Doppler, Urologist opinion, Antibiotics, Scrotal support, Rest.";
if(n.includes("Testicular Torsion")) return "Adv: Urgent Urologist opinion, Emergency surgery may be required, Scrotal Doppler immediately, Do not delay.";
return "Adv: Relevant labs as per disease and specialist consultation.";
}

let T={}; allNames.forEach(k=>{T[k]=getReportEdit(k)+`\n\nCONCLUSION:\n${k}.\n\nADVICE:\n${getAdvice(k)}`;});
let allTemplates=Object.keys(T);
function cleanForPrint(text){ return text.replace(/\s*\[N:.*?\]/g, ''); }
function filterTemplates(){let q=(document.getElementById('tSearch')?.value||'').toLowerCase();let filtered=allTemplates.filter(k=>k.toLowerCase().includes(q));let s=document.getElementById('uType');let cur=s.value;s.innerHTML='';filtered.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});if(filtered.includes(cur))s.value=cur; checkCalculator();}
function useSelectedTemplate(){let v=document.getElementById('uType')?.value;if(!v){alert('Select');return;}document.getElementById('rText').value=T[v]||''; checkCalculator();}
function formatReportToHTML(text){ let printText=cleanForPrint(text); let lines=printText.split('\n'); let html=''; lines.forEach(line=>{ let l=line.trim(); if(!l){html+='<div style="height:4px"></div>';return;} if(l.toUpperCase().startsWith('ULTRASOUND')){html+=`<div style="text-align:center;margin:10px 0;font-weight:900;text-decoration:underline">`+l+`</div>`;return;} if(l.toUpperCase().startsWith('CONCLUSION:')){html+=`<div style="margin-top:10px"><b style="text-decoration:underline">CONCLUSION:</b> <b>`+l.replace(/CONCLUSION:/i,'').trim()+`</b></div>`;return;} if(l.toUpperCase().startsWith('ADVICE:')){html+=`<div style="margin-top:8px"><b style="text-decoration:underline">ADVICE:</b> `+l.replace(/ADVICE:/i,'').trim()+`</div>`;return;} html+=`<div style="margin:2px 0 2px 10px">• `+l+`</div>`; }); return html; }
function make(){ let pn=document.getElementById('pName'); if(!pn?.value){alert('Enter Name');return;} let pid=document.getElementById('pIDMobile')?.value||'__'; let complaintText=(document.getElementById('pComplaint')?.value||'').trim(); let patientBorder=`<div style="border:1.2px solid #000;padding:6px 8px;margin-bottom:6px;font-size:10pt!important;line-height:1.5"><div><b>Name:</b> ${document.getElementById('pName').value} | <b>Age:</b> ${document.getElementById('pAge').value} | <b>Sex:</b> ${document.getElementById('pGen').value} | <b>Date:</b> ${document.getElementById('pDate').value} | <b>ID:</b> ${pid}</div><div><b>Ref By:</b> ${document.getElementById('ref').value} | <b>Sonologist:</b> ${document.getElementById('sono').value}</div></div>`; let bodyHTML=formatReportToHTML(document.getElementById('rText').value); if(complaintText){bodyHTML=`<div style="margin-bottom:4px;font-size:10pt!important"><b><i>C/O: ${complaintText}</i></b></div>`+bodyHTML;} let footer=`<div style="margin-top:12px;text-align:center"><div style="font-size:8pt!important"><i>This is computer generated report no signature required.</i></div><div style="font-size:9pt!important;margin-top:4px;font-weight:700">Thanks for availing our services</div></div>`; document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer; document.getElementById('outCard').style.display='block'; }
function saveR(){ let content=document.getElementById('reportContent').innerHTML; if(!content){alert('Generate karen');return;} let name=document.getElementById('pName').value||'Report'; let rec={id: Date.now(),name:name,mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'',date:document.getElementById('pDate')?.value||'',html:content,text:document.getElementById('rText')?.value||''}; let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];} all.unshift(rec); localStorage.setItem('azam_reports',JSON.stringify(all)); render(); uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all)); alert('✅ Saved'); }
function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:15px;font-size:10pt">No reports</p>';return;}listEl.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:6px;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;font-size:10pt"><div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('reportContent').innerHTML=r.html;document.getElementById('outCard').style.display='block';}
function delR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:cleanForPrint(document.getElementById('rText').value);doc.setFontSize(10);doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allNames.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();document.getElementById('templateCount').innerText=allTemplates.length+' Templates';render();}
init();
</script></body></html>
