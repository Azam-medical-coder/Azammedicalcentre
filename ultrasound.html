let fetalData={};
let editIndex=-1;
function isGynae(t){ t=t.toLowerCase(); return t.includes('fwb') || t.includes('pelvis') || t.includes('follicle') || t.includes('rpco') || t.includes('ovarian'); }

function calcFWB(){
 let bpd=parseFloat(document.getElementById('cBPD').value)||0;
 let hc=parseFloat(document.getElementById('cHC').value)||0;
 let ac=parseFloat(document.getElementById('cAC').value)||0;
 let fl=parseFloat(document.getElementById('cFL').value)||0;
 let crl=parseFloat(document.getElementById('cCRL').value)||0;
 let afi=parseFloat(document.getElementById('cAFI').value)||0;
 let gas=[];
 if(hc>0) gas.push(hc*0.111+5.5);
 if(ac>0) gas.push(ac*0.117+3.8);
 if(fl>0) gas.push(fl*0.4+9.5);
 if(crl>0) gas.push(crl*0.16+6.8);
 if(bpd>0 && gas.length<2) gas.push(bpd*0.33+4);
 let avgGA = gas.length? (gas.reduce((a,b)=>a+b,0)/gas.length):0;
 let efw=0;
 if(hc>0 && ac>0 && fl>0){
   let hc_cm=hc/10, ac_cm=ac/10, fl_cm=fl/10;
   let log10efw = 1.326 - (0.00326*ac_cm*fl_cm) + (0.0107*hc_cm) + (0.0438*ac_cm) + (0.158*fl_cm);
   efw = Math.pow(10, log10efw);
 }
 let eddStr='--';
 if(avgGA>0){ let edd=new Date(); edd.setDate(edd.getDate()+(40-avgGA)*7); eddStr=edd.toLocaleDateString('en-GB'); }
 fetalData={ga:avgGA, efw:efw, edd:eddStr, hc:hc, ac:ac, fl:fl, bpd:bpd, crl:crl, afi:afi};
 document.getElementById('resGA').innerText = avgGA? `GA: ${avgGA.toFixed(1)}w (${Math.floor(avgGA)}w${Math.round((avgGA%1)*7)}d)`:'GA: -- weeks';
 document.getElementById('resEDD').innerText = `EDD: ${eddStr}`;
 document.getElementById('resEFW').innerText = efw? `Weight: ${Math.round(efw)} gm`:'Weight: -- gm';
}

function applyCalc(){
 if(!fetalData.ga &&!fetalData.efw){ alert('Pehle HC, AC, FL mm likhen!'); return; }
 let ga=fetalData.ga, gaFull=ga? `${ga.toFixed(1)} weeks (${Math.floor(ga)} weeks ${Math.round((ga%1)*7)} days)`:'__ weeks';
 let w=fetalData.efw? `${Math.round(fetalData.efw)} gm`:'__ gm';
 let afiTxt=fetalData.afi? `${fetalData.afi} mm`:'__ mm';
 let txt=document.getElementById('rText').value;
 if(fetalData.hc) txt=txt.replace(/HC: __ mm/g,`HC: ${fetalData.hc} mm`);
 if(fetalData.ac) txt=txt.replace(/AC: __ mm/g,`AC: ${fetalData.ac} mm`);
 if(fetalData.fl) txt=txt.replace(/FL: __ mm/g,`FL: ${fetalData.fl} mm`);
 if(fetalData.bpd) txt=txt.replace(/BPD: __ mm/g,`BPD: ${fetalData.bpd} mm`);
 if(fetalData.crl) txt=txt.replace(/CRL: __ mm/g,`CRL: ${fetalData.crl} mm`);
 if(fetalData.afi) txt=txt.replace(/AFI: __ mm/g,`AFI: ${afiTxt}`);
 if(fetalData.efw){ txt=txt.replace(/Fetus Weight: __ gm/g,`Fetus Weight: ${w}`); txt=txt.replace(/Weeks: __ weeks/g,`Weeks: ${gaFull}`); }
 if(ga){ txt=txt.replace(/IMPRESSION: Single live __ weeks.*/g,`IMPRESSION: Single live ${gaFull}, EFW ${w}, AFI ${afiTxt}.`); }
 document.getElementById('rText').value=txt;
 alert('✅ Calculations line by line report me lag gayi!');
}

let custom=JSON.parse(localStorage.getItem('custom_templates')||'{}');Object.assign(T,custom);
function init(){
 let s=document.getElementById('uType');s.innerHTML='';
 Object.keys(T).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});
 document.getElementById('pDate').valueAsDate=new Date();
 document.getElementById('rText').value=T[Object.keys(T)[0]]; checkFetal(); render();
}
function checkFetal(){
 let v=document.getElementById('uType').value;
 let gyn=isGynae(v);
 document.getElementById('fetalCalc').style.display=v.toLowerCase().includes('fwb')?'block':'none';
 document.getElementById('clinicalLMP').style.display=gyn?'block':'none';
 document.getElementById('presentComp').style.display=!gyn?'block':'none';
}
function load(){document.getElementById('rText').value=T[document.getElementById('uType').value]||''; checkFetal();}
document.getElementById('uType').addEventListener('change',load);
document.getElementById('wordUp').addEventListener('change',async(e)=>{
 let file=e.target.files[0];if(!file)return;let buf=await file.arrayBuffer();let res=await mammoth.extractRawText({arrayBuffer:buf});
 let txt=res.value.trim();let name=file.name.replace('.docx','');T[name]=txt;
 let saved=JSON.parse(localStorage.getItem('custom_templates')||'{}');saved[name]=txt;localStorage.setItem('custom_templates',JSON.stringify(saved));
 let s=document.getElementById('uType');if(![...s.options].some(o=>o.value==name)){let o=document.createElement('option');o.value=name;o.textContent=name+' (Imported)';s.appendChild(o);}
 s.value=name;document.getElementById('rText').value=txt;checkFetal();alert('Template update!');e.target.value='';
});
function formatReport(text){
 return text.split('\n').map(line=>{
  line=line.trim(); if(!line) return '<br>';
  if(line.startsWith('ULTRASOUND') || line.startsWith('DOPPLER')){
    return `<div style="text-align:center;margin:8px 0;font-size:16px"><b><u>${line}</u></b></div>`;
  }
  if(line.startsWith('IMPRESSION')){
    return `<div style="margin:8px 0"><b><u>${line.split(':')[0]}:</u></b> ${line.split(':').slice(1).join(':')}</div>`;
  }
  if(line.includes(':')){
    let p=line.split(':'); return `<div style="margin:3px 0"><b><u>${p[0]}:</u></b> ${p.slice(1).join(':')}</div>`;
  }
  return `<div>${line}</div>`;
 }).join('');
}
function make(){
 let type=document.getElementById('uType').value;
 let gyn=isGynae(type);
 let clinicalHTML='';
 if(gyn){
   let lmp=document.getElementById('clinicalLMP').value||'__';
   clinicalHTML=`<div style="margin:3px 0"><b><u>Clinical Data/LMP date:</u></b> ${lmp}</div>`;
 } else {
   let comp=document.getElementById('presentComp').value||'__';
   clinicalHTML=`<div style="margin:3px 0"><b><u>Present complaints-H/O:</u></b> ${comp}</div>`;
 }
 let info=`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px"><div><b>Patient Name:</b> ${pName.value} &nbsp; <b>Age/Sex:</b> ${pAge.value}/${pGen.value}<br><b>Referred By:</b> ${ref.value}</div><div><b>Date:</b> ${pDate.value}</div></div><hr style="margin-bottom:10px">${clinicalHTML}<hr style="margin:10px 0">`;
 let body=formatReport(rText.value);
 let footer=`<div style="margin-top:80px;text-align:center;font-size:11px;color:#555"><i>This is computer generated report no signature required</i></div>`;
 document.getElementById('out').innerHTML=info+body+footer;
 document.getElementById('outCard').style.display='block';
 window.scrollTo(0,document.getElementById('outCard').offsetTop);
}
function pdf(){const{jsPDF}=window.jspdf; let doc=new jsPDF('p','mm','a4'); let t=document.getElementById('out').innerText; doc.text(doc.splitTextToSize(t,180),10,52); doc.save((pName.value||'Report')+'.pdf');}
function saveR(){
 let a=JSON.parse(localStorage.getItem('us_rep')||'[]');
 let obj={n:pName.value,a:pAge.value,g:pGen.value,d:pDate.value,t:uType.value,r:rText.value, lmp:clinicalLMP.value, comp:presentComp.value, ref:ref.value};
 if(editIndex>=0){ a[editIndex]=obj; editIndex=-1; }
 else { a.unshift(obj); }
 localStorage.setItem('us_rep',JSON.stringify(a)); render(); alert('Report Saved!');
}
function render(){
 let q=(sBox.value||'').toLowerCase();
 let a=JSON.parse(localStorage.getItem('us_rep')||'[]');
 list.innerHTML=a.map((x,i)=>`
 <div style="border:1px solid #ddd;border-radius:10px;padding:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
 <div><b>${x.n}</b> <small>${x.t} ${x.d}</small></div>
 <div>
 <button class="small" style="background:#0a4eb5" onclick="view(${i})">View</button>
 <button class="small" style="background:#f59e0b" onclick="editR(${i})">Edit</button>
 <button class="small" style="background:#ff3b30" onclick="del(${i})">Del</button>
 </div></div>`).filter((_,i)=> (a[i].n+a[i].t).toLowerCase().includes(q)).join('');
}
function view(i){
 let a=JSON.parse(localStorage.getItem('us_rep')||'[]')[i];
 pName.value=a.n; pAge.value=a.a; pGen.value=a.g; pDate.value=a.d; uType.value=a.t; rText.value=a.r;
 clinicalLMP.value=a.lmp||''; presentComp.value=a.comp||''; ref.value=a.ref||'';
 checkFetal(); make();
}
function editR(i){
 let a=JSON.parse(localStorage.getItem('us_rep')||'[]')[i];
 pName.value=a.n; pAge.value=a.a; pGen.value=a.g; pDate.value=a.d; uType.value=a.t; rText.value=a.r;
 clinicalLMP.value=a.lmp||''; presentComp.value=a.comp||''; ref.value=a.ref||'';
 checkFetal(); editIndex=i; window.scrollTo(0,0); alert('Edit Mode: Changes karke Save Report dabayen.');
}
function del(i){let a=JSON.parse(localStorage.getItem('us_rep')||'[]'); a.splice(i,1); localStorage.setItem('us_rep',JSON.stringify(a)); render();}
init();
</script>
