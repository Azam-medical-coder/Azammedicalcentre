IMPRESSION: Testicular swelling`,
"Testis with epididymitis":`ULTRASOUND TESTIS WITH EPIDIDYMITIS
Bulky __ x __ mm, Vascularity increased __
IMPRESSION: Epididymitis __ mm`,
"Testis with Doppler study":`ULTRASOUND TESTIS WITH DOPPLER
PSV __ cm/s, RI __
IMPRESSION: Doppler Right RI __, Left RI __`
};
let prostateData={},fetalData={};
function calcProstate(){let l=parseFloat(pL.value)||0,w=parseFloat(pW.value)||0,h=parseFloat(pH.value)||0;if(l>0&&w>0&&h>0){let vol=l*w*h*0.52;prostateData={l,w,h,vol};resPVol.innerText=`Vol: ${vol.toFixed(1)} cc`;resPGm.innerText=`Wt: ${vol.toFixed(1)} gm`;}}
function applyProstateCalc(){if(!prostateData.vol){alert('cm likhen');return;}let txt=rText.value;txt=txt.replace(/__ x __ x __ cm/g,`${prostateData.l} x ${prostateData.w} x ${prostateData.h} cm`).replace(/__ gm/g,`${prostateData.vol.toFixed(1)} gm`).replace(/__ cc/g,`${prostateData.vol.toFixed(1)} cc`);rText.value=txt;}
function calcFWB(){let hc=parseFloat(cHC.value)||0,ac=parseFloat(cAC.value)||0,fl=parseFloat(cFL.value)||0;let gas=[];if(hc>0)gas.push(hc*0.111+5.5);if(ac>0)gas.push(ac*0.117+3.8);if(fl>0)gas.push(fl*0.4+9.5);let avg=gas.length?gas.reduce((a,b)=>a+b,0)/gas.length:0;let efw=0;if(hc>0&&ac>0&&fl>0){let log10=1.326-(0.00326*(ac/10)*(fl/10))+(0.0107*(hc/10))+(0.0438*(ac/10))+(0.158*(fl/10));efw=Math.pow(10,log10);}fetalData={ga:avg,efw:efw,hc,ac,fl};resGA.innerText=avg?`GA: ${avg.toFixed(1)}w`:'GA: --';resEFW.innerText=efw?`Weight: ${Math.round(efw)} gm`:'Weight: --';resEDD.innerText=avg?`EDD: ${new Date(Date.now()+(40-avg)*7*24*3600*1000).toLocaleDateString()}`:'EDD: --';}
function applyCalc(){if(!fetalData.ga&&!fetalData.efw){alert('HC AC FL likhen');return;}let txt=rText.value;if(fetalData.hc)txt=txt.replace(/HC: __ mm/g,`HC: ${fetalData.hc} mm`);if(fetalData.ac)txt=txt.replace(/AC: __ mm/g,`AC: ${fetalData.ac} mm`);if(fetalData.fl)txt=txt.replace(/FL: __ mm/g,`FL: ${fetalData.fl} mm`);if(fetalData.efw)txt=txt.replace(/__ gm/g,`${Math.round(fetalData.efw)} gm`);rText.value=txt;}
function init(){let s=uType; s.innerHTML='';Object.keys(T).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});pDate.valueAsDate=new Date();sumDate.valueAsDate=new Date();rText.value=T[Object.keys(T)[0]];checkFetal();render();}
function checkFetal(){let v=uType.value;fetalCalc.style.display=v.toLowerCase().includes('fwb')?'block':'none';prostateCalc.style.display=v.toLowerCase().includes('prostate')?'block':'none';rText.value=T[v]||'';}
uType.addEventListener('change',checkFetal);
function make(){let html=`<div style='text-align:center;border-bottom:2px solid #0a4eb5'><h2 style='color:#0a4eb5'><img src="logo.png" onerror="this.src='https://azam-medical-coder.github.io/Azammedicalcentre/logo.png'" style="width:40px;height:40px;border-radius:50%;vertical-align:middle"> Azam Medical Centre</h2><p style='font-size:10px'>Plot 27, Allama Iqbal Road, Manzoor Colony, Karachi</p><h4>${uType.value}</h4></div><div style='margin-top:8px;font-size:11px'><b>Name:</b> ${pName.value} | <b>Age:</b> ${pAge.value} | <b>Sex:</b> ${pGen.value} | <b>Date:</b> ${pDate.value}<br><b>ID/Mobile:</b> ${pIDMobile.value} | <b>Ref:</b> ${ref.value} | <b>Sono:</b> ${sono.value}</div><pre style='white-space:pre-wrap;margin-top:10px;font-size:12px'>${rText.value}</pre>`;reportContent.innerHTML=html;outCard.style.display='block';}
function saveR(){if(!pName.value){alert('Name likhen');return;}let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let rec={id:Date.now(),name:pName.value,age:pAge.value,gen:pGen.value,mobile:pIDMobile.value,type:uType.value,date:pDate.value,ref:ref.value,sono:sono.value,html:reportContent.innerHTML,text:rText.value,outHTML:document.getElementById('out').outerHTML};all.unshift(rec);localStorage.setItem('azam_reports',JSON.stringify(all));render();let fn=`${rec.name}_${rec.type}_${rec.date}.html`;uploadToDriveFile(fn,rec.outHTML);}
function render(){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let q=(sBox.value||'').toLowerCase();let f=all.filter(r=>(r.name+' '+r.mobile+' '+r.type).toLowerCase().includes(q));if(f.length===0){list.innerHTML='<p style="text-align:center;color:#888;padding:20px">Koi report nahi - Pehle Save karen</p>';return;}list.innerHTML=f.map(r=>`<div style='border:1px solid #cbd5e1;padding:8px;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between'><span><b>${r.name}</b> - ${r.type} - ${r.date}<br><span style="font-size:11px">${r.mobile}</span></span><span><button class='small' style='background:#0a4eb5' onclick='viewR(${r.id})'>View</button><button class='small' style='background:#10b981' onclick='viewR(${r.id});setTimeout(()=>window.print(),500)'>Print</button><button class='small' style='background:#ff3b30' onclick='delR(${r.id})'>Del</button></span></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id); if(r){reportContent.innerHTML=r.html;outCard.style.display='block';}}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();}
function pdf(){let {jsPDF}=window.jspdf; let doc=new jsPDF(); doc.text(reportContent.innerText,10,10); doc.save((pName.value||'report')+'.pdf');}
function exportData(){let all=localStorage.getItem('azam_reports')||'[]'; let blob=new Blob([all],{type:'application/json'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='Backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();}
function importData(e){let file=e.target.files[0]; if(!file)return; let reader=new FileReader(); reader.onload=function(ev){ try{let data=JSON.parse(ev.target.result); if(Array.isArray(data)){ let ex=JSON.parse(localStorage.getItem('azam_reports')||'[]'); localStorage.setItem('azam_reports',JSON.stringify([...data,...ex])); render(); alert('Restore ho gayi');}}catch(err){}}; reader.readAsText(file);}
function openSummary(){summaryCard.style.display='block'; renderSummary();}
function closeSummary(){summaryCard.style.display='none';}
function renderSummary(){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]'); let d=sumDate.value; if(!d){alert('Date select'); return;} let f=all.filter(r=>r.date===d); sumTitle.innerText='Date: '+d; sumTotal.innerText=f.length; sumBody.innerHTML=f.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.mobile}</td><td>${r.age}/${r.gen}</td><td>${r.type}</td><td>${r.ref}</td><td>${r.sono}</td></tr>`).join(''); let tc={}; f.forEach(r=>{tc[r.type]=(tc[r.type]||0)+1;}); sumStats.innerHTML=Object.entries(tc).map(([k,v])=>`<span style='background:#eef4ff;padding:4px 8px;border-radius:6px;border:1px solid #cbd5e1'>${k}: ${v}</span>`).join('');}
function printSummary(){let c=document.getElementById('summaryPrintArea').innerHTML; let w=window.open('','','width=900,height=700'); w.document.write('<html><body>'+c+'</body></html>'); w.document.close(); w.print();}
init();
</script>
