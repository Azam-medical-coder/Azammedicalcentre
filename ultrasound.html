let allTemplates=Object.keys(T);
let fetalData={},editId=null;
function filterTemplates(){
 let q=(tSearch.value||'').toLowerCase();
 let filtered=allTemplates.filter(k=>k.toLowerCase().includes(q));
 let s=uType; let current=s.value;
 s.innerHTML='';
 filtered.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});
 if(filtered.includes(current)){s.value=current;}
 if(filtered.length>0 &&!filtered.includes(current)){rText.value=T[filtered[0]];checkFetal();}
 if(filtered.length===0){s.innerHTML='<option>No match</option>';}
}
function calcFWB(){let bpd=parseFloat(cBPD.value)||0,hc=parseFloat(cHC.value)||0,ac=parseFloat(cAC.value)||0,fl=parseFloat(cFL.value)||0,crl=parseFloat(cCRL.value)||0,afi=parseFloat(cAFI.value)||0;let gas=[];if(hc>0)gas.push(hc*0.111+5.5);if(ac>0)gas.push(ac*0.117+3.8);if(fl>0)gas.push(fl*0.4+9.5);if(crl>0)gas.push(crl*0.16+6.8);if(bpd>0)gas.push(bpd*0.33+4);let avg=gas.length?gas.reduce((a,b)=>a+b,0)/gas.length:0;let efw=0;if(hc>0&&ac>0&&fl>0){let log10=1.326-(0.00326*(ac/10)*(fl/10))+(0.0107*(hc/10))+(0.0438*(ac/10))+(0.158*(fl/10));efw=Math.pow(10,log10);}fetalData={ga:avg,efw:efw,hc,ac,fl,bpd,crl,afi};resGA.innerText=avg?`GA: ${avg.toFixed(1)}w`:'GA: --';resEFW.innerText=efw?`Wt: ${Math.round(efw)} gm`:'Wt: --';resEDD.innerText=avg?`EDD: ${new Date(Date.now()+(40-avg)*7*24*3600*1000).toLocaleDateString()}`:'EDD: --';}
function applyCalc(){if(!fetalData.ga&&!fetalData.efw){alert('HC AC FL likhen');return;}let txt=rText.value;txt=txt.replace(/HC: __ mm/g,`HC: ${fetalData.hc} mm`);txt=txt.replace(/AC: __ mm/g,`AC: ${fetalData.ac} mm`);txt=txt.replace(/FL: __ mm/g,`FL: ${fetalData.fl} mm`);txt=txt.replace(/BPD: __ mm/g,`BPD: ${fetalData.bpd} mm`);txt=txt.replace(/CRL: __ mm/g,`CRL: ${fetalData.crl} mm`);txt=txt.replace(/AFI: __ mm/g,`AFI: ${fetalData.afi} mm`);txt=txt.replace(/__ gm/g,`${Math.round(fetalData.efw)} gm`);rText.value=txt;}
function init(){let s=uType;s.innerHTML='';allTemplates.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});pDate.valueAsDate=new Date();sumDate.valueAsDate=new Date();rText.value=T[allTemplates[0]];checkFetal();render();}
function checkFetal(){
 let v=uType.value; rText.value=T[v]||'';
 let isFWB=v.toLowerCase().includes('fwb');
 let isProstate=v.toLowerCase().includes('prostate');
 let isWhole=v.toLowerCase().includes('whole')||v.toLowerCase().includes('kub');
 fetalCalc.style.display=isFWB?'block':'none';
 prostateCalc.style.display=isProstate?'block':'none';
 complaintBox.style.display=isWhole?'block':'none';
 let d = getDiagramForType(v);
 document.getElementById('diagramWM').style.backgroundImage=`url("${d}")`;
 document.getElementById('diagramWM').style.display='block';
}
uType.addEventListener('change',checkFetal);
function formatReportToHTML(text){
 let lines=text.split('\n'); let html='';
 lines.forEach(line=>{line=line.trim(); if(!line){html+='<div style="height:5px"></div>';return;}
 if(line.startsWith('ULTRASOUND')||line.startsWith('DOPPLER')){html+=`<div style="text-align:center;margin:10px 0 8px 0;font-size:13px;font-weight:900;text-decoration:underline;color:#0a4eb5">${line}</div>`;return;}
 if(line.startsWith('IMPRESSION:')){let val=line.replace('IMPRESSION:','').trim(); html+=`<div style="margin-top:12px"><b><u>IMPRESSION</u>:</b> ${val}</div>`;return;}
 if(line.startsWith('Advice:')){let val=line.replace('Advice:','').trim(); html+=`<div style="margin-top:6px"><b><u>Advice</u>:</b> ${val}</div>`;return;}
 if(line.includes(':')){let idx=line.indexOf(':');let label=line.substring(0,idx).trim();let value=line.substring(idx+1).trim();html+=`<div style="margin:2px 0"><b><u>${label}</u>:</b> ${value}</div>`;}else{html+=`<div>${line}</div>`;}
 });return html;
}
function make(){
 if(!pName.value){alert('Patient Name likhen');return;}
 let d = getDiagramForType(uType.value);
 let wm = document.getElementById('diagramWM');
 wm.style.backgroundImage=`url("${d}")`;
 wm.style.display='block';
 let pid=pIDMobile.value||'__';
 let complaintText=(pComplaint.value||'').trim();
 let complaintHTML='';
 if(complaintText && complaintBox.style.display!=='none'){
   complaintHTML=`<div style="margin-bottom:8px;font-size:11px"><b><u>Present Complaint / H/O</u>:</b> ${complaintText}</div>`;
 }
 let patientBorder=`<div style="border:2px solid #0a4eb5;border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#f8fbff"><div style="display:flex;flex-wrap:wrap;gap:6px;font-size:11px"><span><b><u>Name</u>:</b> ${pName.value}</span> | <span><b><u>Age</u>:</b> ${pAge.value}</span> | <span><b><u>Sex</u>:</b> ${pGen.value}</span> | <span><b><u>Date</u>:</b> ${pDate.value}</span> | <span><b><u>ID/Mobile</u>:</b> ${pid}</span></div><div style="display:flex;flex-wrap:wrap;gap:6px;font-size:11px;margin-top:4px"><span><b><u>Ref By</u>:</b> ${ref.value}</span> | <span><b><u>Sonologist</u>:</b> ${sono.value}</span></div></div>`;
 let bodyHTML=formatReportToHTML(rText.value);
 let footer=`<div style="margin-top:18px;border-top:2px solid #0a4eb5;padding-top:8px;text-align:center;font-size:10px;line-height:1.6"><div><b><i>This report is computer generated, signature not required</i></b></div><div style="margin-top:4px;font-size:11px;font-weight:800">Thanks for availing our service</div></div>`;
 document.getElementById('reportContent').innerHTML=patientBorder+complaintHTML+bodyHTML+footer;
 document.getElementById('outCard').style.display='block';
 // force diagram visible after render
 setTimeout(()=>{let w=document.getElementById('diagramWM'); w.style.backgroundImage=`url("${d}")`; w.style.display='block';},100);
 document.getElementById('outCard').scrollIntoView({behavior:'smooth'});
}
function saveR(){if(!pName.value){alert('Name likhen');return;}let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let rec={id:Date.now(),name:pName.value,age:pAge.value,gen:pGen.value,mobile:pIDMobile.value,type:uType.value,date:pDate.value,ref:ref.value,sono:sono.value,text:rText.value,complaint:pComplaint.value,html:document.getElementById('reportContent').innerHTML};if(editId){let i=all.findIndex(x=>x.id===editId);if(i>=0)all[i]=rec;editId=null;}else{all.unshift(rec);}localStorage.setItem('azam_reports',JSON.stringify(all));render();uploadToDriveFile(`report_${rec.id}_${rec.name}.json`,JSON.stringify(rec));alert('✅ Save ho gaya!');}
function render(){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let q=(sBox.value||'').toLowerCase();let f=all.filter(r=>(r.name+' '+r.mobile+' '+r.type).toLowerCase().includes(q));if(f.length===0){list.innerHTML='<p style="text-align:center;color:#888;padding:20px">Koi report nahi mili. Drive se Load dabayen.</p>';return;}list.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}${r.complaint?' | H/O:'+r.complaint.substring(0,20):''}</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#10b981" onclick="viewR(${r.id});setTimeout(()=>window.print(),600)">Print</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;pName.value=r.name;pAge.value=r.age;pGen.value=r.gen;pIDMobile.value=r.mobile;uType.value=r.type;pDate.value=r.date;ref.value=r.ref;sono.value=r.sono;rText.value=r.text;pComplaint.value=r.complaint||'';checkFetal();make();}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[190,280]);doc.text(doc.splitTextToSize(document.getElementById('reportContent').innerText,150),10,45);doc.save((pName.value||'Report')+'.pdf');}
function openSummary(){summaryCard.style.display='block';renderSummary();}
function closeSummary(){summaryCard.style.display='none';}
function renderSummary(){let d=sumDate.value;if(!d){alert('Date select');return;}let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let f=all.filter(r=>r.date===d);sumTitle.innerText='Date: '+d;sumTotal.innerText=f.length;sumBody.innerHTML=f.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.mobile}</td><td>${r.age}/${r.gen}</td><td>${r.type}</td><td>${r.ref}</td><td>${r.sono}</td></tr>`).join('');}
function printSummary(){let c=document.getElementById('summaryPrintArea').innerHTML;let w=window.open('','','width=900,height=700');w.document.write('<html><body>'+c+'</body></html>');w.document.close();w.print();}
init();
</script>
