<script>
const CLIENT_ID='153046624604-p07rnrrj0kdhi23n8384kbd47i2rtace.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
let tokenClient,driveFolderId=null,editingId=null;
function gapiLoaded(){gapi.load('client', async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});}catch(e){}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:''});}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){alert('Loading...');rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken())); document.getElementById('driveStatus').innerText='Drive Connected'; res(r);}};tokenClient.requestAccessToken({prompt:''});});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports', mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}
async function findFileInFolder(folderId,fileName){try{let q=`'${folderId}' in parents and name='${fileName}' and trashed=false`;let res=await gapi.client.drive.files.list({q:q,fields:"files(id,name)"});if(res.result.files&&res.result.files.length>0) return res.result.files[0]; return null;}catch(e){return null;}}
async function uploadToDriveFile(name,content){ try{ let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); if(!folderId) return; let token=gapi.client.getToken(); let existing=await findFileInFolder(folderId,name); if(existing){ await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:content}); return; } const file=new Blob([content],{type:'application/json'});const meta={name:name,mimeType:'application/json',parents:[folderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',file); await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:new Headers({'Authorization':'Bearer '+token.access_token}),body:form}); }catch(e){} }
async function loadFromDrive(){ try{ document.getElementById('driveStatus').innerText='Loading...'; let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); if(!folderId){alert('Folder not found');return;} let file=await findFileInFolder(folderId,'Azam_Medical_Backup_ALL.json'); if(!file){alert('No backup found');return;} let token=gapi.client.getToken(); let res=await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}}); if(!res.ok){alert('Load failed');return;} let text=await res.text(); let data=JSON.parse(text); if(!Array.isArray(data)){alert('Invalid backup');return;} localStorage.setItem('azam_reports',JSON.stringify(data)); render(); document.getElementById('driveStatus').innerText='Loaded '+data.length; alert('Loaded '+data.length); }catch(e){alert('Load error: '+e.message);} }

function checkCalculator(){ let v=document.getElementById('uType').value||''; document.getElementById('obsCalc').style.display = (v.includes('FWB'))? 'block' : 'none'; document.getElementById('prosCalc').style.display = (v.includes('PROSTATE'))? 'block' : 'none'; }
function toMM(val){ if(!val || val==0) return 0; if(val < 30) return val*10; return val; }
function calcFWBFixed(){
 let raw_bpd = parseFloat(document.getElementById('bpd').value)||0; let raw_hc = parseFloat(document.getElementById('hc').value)||0; let raw_ac = parseFloat(document.getElementById('ac').value)||0; let raw_fl = parseFloat(document.getElementById('fl').value)||0;
 let bpd_mm = toMM(raw_bpd); let hc_mm = toMM(raw_hc); let ac_mm = toMM(raw_ac); let fl_mm = toMM(raw_fl);
 if(ac_mm===0 && hc_mm>0){ ac_mm = hc_mm*0.80; } if(bpd_mm===0 && hc_mm===0 && fl_mm===0 && ac_mm===0){ return; }
 let bpd_cm = bpd_mm/10, hc_cm = hc_mm/10, ac_cm = ac_mm/10, fl_cm = fl_mm/10;
 let ga_bpd=0, ga_hc=0, ga_fl=0, ga_ac=0;
 if(bpd_mm>0) ga_bpd = (bpd_mm - 20)*0.3 + 12; if(hc_mm>0) ga_hc = (hc_mm - 80)*0.11 + 12; if(fl_mm>0) ga_fl = (fl_mm - 10)*0.38 + 12; if(ac_mm>0) ga_ac = (ac_mm - 60)*0.13 + 12;
 let sum=0, cnt=0; if(bpd_mm>0){sum+=ga_bpd;cnt++} if(hc_mm>0){sum+=ga_hc;cnt++} if(fl_mm>0){sum+=ga_fl;cnt++} if(ac_mm>0){sum+=ga_ac;cnt++}
 let avgGA = cnt>0? sum/cnt : 0;
 if(avgGA>0){ document.getElementById('gaResult').value = avgGA.toFixed(1)+' wks'; let today = new Date(); let edd = new Date(); edd.setDate(today.getDate() + (40-avgGA)*7); document.getElementById('eddResult').value = edd.toLocaleDateString('en-GB'); }
 if(ac_cm>0 && fl_cm>0 && hc_cm>0){
   let log10EFW_standard = 1.3596 - (0.00386*ac_cm*fl_cm) + (0.0064*hc_cm) + (0.00061*bpd_cm*ac_cm) + (0.0424*ac_cm) + (0.174*fl_cm);
   let log10EFW_machine = log10EFW_standard + 0.2385; let efw = Math.pow(10, log10EFW_machine);
   if(efw>100 && efw<5500){ document.getElementById('efwResult').value = Math.round(efw) + ' gms'; }
 }
}
function calcEDD(){ let lmp=document.getElementById('lmp').value; if(!lmp){ calcFWBFixed(); return; } let d=new Date(lmp); d.setDate(d.getDate()+280); document.getElementById('eddResult').value = d.toLocaleDateString('en-GB'); let today=new Date(lmp); let now=new Date(); let diffDays=Math.floor((now-today)/(1000*60*60*24)); let gaWeeks=diffDays/7; if(gaWeeks>0) document.getElementById('gaResult').value=gaWeeks.toFixed(1)+' wks (LMP)'; }
function insertFWBAnomaly(){
 let raw_bpd = parseFloat(document.getElementById('bpd').value)||7.1; let raw_hc = parseFloat(document.getElementById('hc').value)||25.0; let raw_ac = parseFloat(document.getElementById('ac').value)||20.1; let raw_fl = parseFloat(document.getElementById('fl').value)||5.4;
 let bpd_mm = toMM(raw_bpd), hc_mm = toMM(raw_hc), ac_mm = toMM(raw_ac), fl_mm = toMM(raw_fl);
 let bpd_cm = (bpd_mm/10).toFixed(1), hc_cm = (hc_mm/10).toFixed(1), ac_cm = (ac_mm/10).toFixed(1), fl_cm = (fl_mm/10).toFixed(1);
 let ga = document.getElementById('gaResult').value||'28 weeks+1 week'; let efw = document.getElementById('efwResult').value||'1656 gms';
 let report = `FWB & OBSTETRIC ULTRASOUND REPORT:\n\nNumber of Fetus: SINGLE [N: Single]\nLocation: INTRAUTERINE [N: Intrauterine]\nPresentation: CEPHALIC [N: Cephalic]\nLie: LONGITUDINAL LIE [N: Longitudinal]\nFetal Cardiac Activity: PRESENT (152 BPM) [N: Present]\nGross Fetal Movement: PRESENT [N: Present]\nPlacenta: ANTERIOR, NOT LOW-LYING [N: Not low-lying]\nPlacental Maturity: GRADE II [N: Grade 0-III]\nAmount of Liquor: ADEQUATE RESPECTIVE TO GEST-AGE [N: Adequate]\n\nB.P.D.: (Bi Parietal Diameter) ${bpd_cm} cm [N: As per ${ga}]\nF.L.: (Femur Length) ${fl_cm} cm [N: As per ${ga}]\nHC: (Head Circumference) ${hc_cm} cm [N: As per ${ga}]\nAC: (Abdominal Circumference) ${ac_cm} cm [N: As per ${ga}]\nEstimated Fetal Weight: ${efw} Approx [N: As per GA]\n\nCONCLUSION:\nScan of the pelvis shows single alive intrauterine pregnancy corresponding to the gestational age of ${ga}. Cephalic presentation & placenta localized anteriorly no previa with grade II maturity. Internal os is closed. Amount of liquor is adequate.\nRest of study unremarkable.\n\nAFI: 4.8 cm - 2.5 cm / 3.0 cm - 4.3 cm\nThe amniotic fluid index is 14.8 cm (Normal 08 to 20cm) [N: 8-20 cm]\n\nADVICE:\nRoutine antenatal follow up.`;
 document.getElementById('rText').value = report;
}
function calcProstate(){ let l=parseFloat(document.getElementById('prosL').value)||0; let w=parseFloat(document.getElementById('prosW').value)||0; let h=parseFloat(document.getElementById('prosH').value)||0; if(l&&w&&h){ let vol = l*w*h*0.52; document.getElementById('prosVol').value = vol.toFixed(1)+' gm'; } }
function insertProstate(){ let l=document.getElementById('prosL').value||'__', w=document.getElementById('prosW').value||'__', h=document.getElementById('prosH').value||'__', vol=document.getElementById('prosVol').value||''; document.getElementById('rText').value += `\nProstate: ${l} x ${w} x ${h} cm [N: <4.0 x 3.0 x 3.0 cm], Vol: ${vol} [N: 15-25 gm]\n`; }

function getDiagnosis(n){
if(n.startsWith("ANAL -")){
if(n==="ANAL - Normal") return "Normal anal ultrasound - No fistula, no abscess, no hemorrhoids, sphincters intact";

if(n==="ANAL - Intersphincteric Fistula") return "Intersphincteric Fistula - Tract 22mm between internal & external sphincter, internal opening at 6 o'clock, no abscess";
if(n==="ANAL - Transsphincteric Fistula") return "Transsphincteric Fistula (Low) - Tract 32mm piercing through both sphincters at 5 o'clock into ischiorectal fossa";
if(n==="ANAL - Suprasphincteric Fistula") return "Suprasphincteric Fistula - Complex tract 45mm extending above puborectalis, external opening at 2 o'clock with small collection";
if(n==="ANAL - Perianal Fistula with Abscess") return "Transsphincteric Perianal Fistula with Abscess - Tract 28mm at 6 o'clock with associated abscess 32x28mm in ischiorectal fossa";
if(n==="ANAL - Anal Fissure") return "Anal Fissure - Linear defect 12mm at posterior midline 6 o'clock with internal sphincter hypertrophy 3.5mm and sentinel pile 6mm";
if(n==="ANAL - Hemorrhoids Internal") return "Internal Hemorrhoids Grade II - At 3,7 & 11 o'clock, largest 12x8mm at 3 o'clock, no thrombosis";
if(n==="ANAL - Hemorrhoids External Thrombosed") return "Thrombosed External Hemorrhoid - 18x14mm at 3 o'clock at anal verge with internal thrombus, tender, avascular";
if(n==="ANAL - Pilonidal Sinus") return "Pilonidal Sinus - Tract 25mm in natal cleft 3cm above anal verge with 2 external pits and collection 20x15mm";
if(n==="ANAL - Anal Sphincter Defect") return "Anal Sphincter Defect - Anterior defect at 12 o'clock, internal gap 12mm, external gap 15mm, length 18mm with hyperechoic scar";
if(n==="ANAL - Perianal Hematoma") return "Perianal Hematoma - 22x18mm at left lateral 3 o'clock, acute hyperechoic collection, avascular";
return n.replace('ANAL - ','');
}
let parts = n.split(' - '); if(parts.length>1){ return parts.slice(1).join(' - ').trim(); } return n;

function formatReportToHTML(text){
  let printText=cleanForPrint(text);
  let lines=printText.split('\n');
  let html=''; let inConclusion=false;
  lines.forEach(line=>{
    let l=line.trim();
    if(!l){html+='<div style="height:4px"></div>';return;}
    if(l.toUpperCase().startsWith('ULTRASOUND')||l.toUpperCase().startsWith('FWB &')){inConclusion=false; html+=`<div style="text-align:center;margin:8px 0;font-weight:900;text-decoration:underline;font-size:11pt!important">`+l+`</div>`;return;}
    if(l.toUpperCase().startsWith('CONCLUSION:')){
      inConclusion=true;
      let rest=l.replace(/CONCLUSION:/i,'').trim();
      html+=`<div style="margin-top:10px"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">CONCLUSION:</b></div>`;
      if(rest){ html+=`<div style="margin-left:10px;font-weight:900;font-size:11pt!important"><b>• ${rest}</b></div>`; }
      return;
    }
    if(l.toUpperCase().startsWith('ADVICE:')){
      inConclusion=false;
      let rest=l.replace(/ADVICE:/i,'').trim();
      html+=`<div style="margin-top:6px"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">ADVICE:</b></div><div style="margin-left:10px;font-weight:900;font-size:11pt!important"><b>• ${rest}</b></div>`;return;
    }
    if(inConclusion){
      html+=`<div style="margin:2px 0 2px 10px;font-size:11pt!important;font-weight:900"><b>• ${l.replace(/^•\s*/,'')}</b></div>`;
      return;
    }
    if(l.includes(':')){
      let parts=l.split(':');
      let heading=parts[0].trim();
      let value=parts.slice(1).join(':').trim();
      html+=`<div style="margin:2px 0 2px 10px;font-size:11pt!important">• <b style="text-decoration:underline;font-weight:900;font-size:11pt!important">${heading}:</b> <span style="font-size:11pt!important">${value}</span></div>`;
      return;
    }
    html+=`<div style="margin:1px 0 1px 10px;font-size:11pt!important">• ${l.replace(/^•\s*/,'')}</div>`;
  });
  return html;
}

function editR(id){ let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return; document.getElementById('pName').value=r.pName||r.name||''; document.getElementById('pAge').value=r.pAge||''; document.getElementById('pGen').value=r.pGen||'Male'; document.getElementById('pDate').value=r.pDate||r.date||''; document.getElementById('pIDMobile').value=r.pIDMobile||r.mobile||''; if(refDoctors.includes(r.ref)){document.getElementById('ref').value=r.ref; document.getElementById('refOther').style.display='none';} else {document.getElementById('ref').value='Other'; document.getElementById('refOther').style.display='block'; document.getElementById('refOther').value=r.ref||'';} if(sonoDoctors.includes(r.sono)){document.getElementById('sono').value=r.sono; document.getElementById('sonoOther').style.display='none';} else {document.getElementById('sono').value='Other'; document.getElementById('sonoOther').style.display='block'; document.getElementById('sonoOther').value=r.sono||'';} document.getElementById('pComplaint').value=r.pComplaint||''; document.getElementById('rText').value=r.text||''; editingId=r.id; document.getElementById('editMode').style.display='inline-block'; document.getElementById('reportContent').innerHTML=r.html; document.getElementById('outCard').style.display='block'; window.scrollTo(0,document.getElementById('formCard').offsetTop); }
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:cleanForPrint(document.getElementById('rText').value);doc.setFontSize(11);doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allNames.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();document.getElementById('templateCount').innerText=allTemplates.length+' Templates';render();}
init();
</script></body></html>
