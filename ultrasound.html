<script>
const CLIENT_ID='153046624604-p07rnrrj0kdhi23n8384kbd47i2rtace.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
let tokenClient,gapiInited=false,gisInited=false,driveFolderId=null;
let editingId=null,editingMode=null;

function updateDriveStatus(m,c){let e=document.getElementById('driveStatus');if(e){e.innerText='● '+m; e.style.color=c||'#10b981';}}
function gapiLoaded(){gapi.load('client', async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});gapiInited=true;updateDriveStatus('Drive Ready - Click Connect',' #0a4eb5');}catch(e){updateDriveStatus('Drive Error',' #ff3b30');}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:''});gisInited=true;}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken())); res(r);}};tokenClient.requestAccessToken({prompt:'consent'});});}
function connectDrive(){ensureDriveAuth().then(()=>{updateDriveStatus('Drive Connected - Loading...',' #10b981'); loadFromDrive();}).catch(e=>{alert('Drive connect error');});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports', mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}
async function findFileInFolder(folderId,fileName){try{let q=`'${folderId}' in parents and name='${fileName}' and trashed=false`;let res=await gapi.client.drive.files.list({q:q,fields:"files(id,name)"});if(res.result.files&&res.result.files.length>0) return res.result.files[0]; return null;}catch(e){return null;}}
async function uploadToDriveFile(name,content){
 try{
  if(!gapiInited||!gisInited||!tokenClient){updateDriveStatus('Local Saved - Drive not connected',' #f59e0b'); return;}
  let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}}
  await ensureDriveAuth();
  let folderId=await getOrCreateFolder(); if(!folderId) return;
  let token=gapi.client.getToken(); if(!token||!token.access_token) return;
  let existing=await findFileInFolder(folderId,name);
  if(existing){
   await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:content});
   updateDriveStatus('Saved to Drive - Same File Replace',' #10b981'); return;
  }
  const file=new Blob([content],{type:'application/json'});const meta={name:name,mimeType:'application/json',parents:[folderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',file);
  await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:new Headers({'Authorization':'Bearer '+token.access_token}),body:form});
  updateDriveStatus('Saved to Drive',' #10b981');
 }catch(e){updateDriveStatus('Local Saved',' #f59e0b');}
}
async function loadFromDrive(){
 try{
  if(!gapiInited||!gisInited){alert('Drive loading, 2 sec wait karein');return;}
  updateDriveStatus('Loading from Drive...',' #f59e0b');
  let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}}
  await ensureDriveAuth();
  let folderId=await getOrCreateFolder(); if(!folderId){alert('Folder not found');return;}
  let listResp=await gapi.client.drive.files.list({q:`'${folderId}' in parents and trashed=false`,fields:"files(id,name,modifiedTime)",pageSize:100,orderBy:"modifiedTime desc"});
  let files=listResp.result.files||[];
  if(files.length===0){alert('Drive empty - Pehle Save karein');updateDriveStatus('Drive Empty',' #ff3b30');return;}
  let existing=[];try{ existing=JSON.parse(localStorage.getItem('azam_reports')||'[]'); }catch(e){ existing=[]; }
  let ids=new Set(existing.map(r=>String(r.id)));
  let loaded=0;
  for(let f of files){
   try{
    let token=gapi.client.getToken();
    let resp=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}});
    if(!resp.ok) continue;
    let text=await resp.text();
    let data; try{ data=JSON.parse(text); }catch(e){ continue; }
    if(Array.isArray(data)){ for(let rep of data){ if(rep && rep.id &&!ids.has(String(rep.id))){ existing.unshift(rep); ids.add(String(rep.id)); loaded++; } else if(rep && rep.id && ids.has(String(rep.id))){ let idx=existing.findIndex(x=>String(x.id)===String(rep.id)); if(idx>=0){ if(new Date(rep.date||0) > new Date(existing[idx].date||0)){ existing[idx]=rep; } } } } }
    else if(data && data.id){ if(!ids.has(String(data.id))){ existing.unshift(data); ids.add(String(data.id)); loaded++; } }
   }catch(e){}
  }
  // Also load the main backup file
  let mainFile=files.find(f=>f.name==='Azam_Medical_Backup_ALL.json');
  if(mainFile){
    try{
      let token=gapi.client.getToken();
      let resp=await fetch(`https://www.googleapis.com/drive/v3/files/${mainFile.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}});
      if(resp.ok){
        let text=await resp.text();
        let allData=JSON.parse(text);
        if(Array.isArray(allData) && allData.length>0){
          localStorage.setItem('azam_reports',JSON.stringify(allData));
          render();
          updateDriveStatus(`Loaded ${allData.length} from Drive - Auto Sync`,' #10b981');
          alert(`✅ ${allData.length} reports Drive se load ho gayi!`);
          return;
        }
      }
    }catch(e){}
  }
  localStorage.setItem('azam_reports',JSON.stringify(existing));
  render();
  updateDriveStatus(`Loaded ${loaded} new - Total ${existing.length}`,' #10b981');
  alert(`✅ Drive se ${loaded} new reports load hui! Total ${existing.length}`);
 }catch(e){alert('Drive error: '+(e.message||e));updateDriveStatus('Drive Error',' #ff3b30');}
}

-orchitis Left","SCROTUM - Orchitis","SCROTUM - Testicular Torsion","TESTIS - Microlithiasis","TESTIS - Testicular Cyst","AXILLA - Normal","AXILLA - Lymphadenopathy Left","NECK - Normal","NECK - Cervical Lymphadenopathy","ABDOMEN + PELVIS - Normal Male","ABDOMEN + PELVIS - Normal Female"];
function getAdvice(n){
  if(n.includes("Normal")) return "No active pathology noted. Routine follow-up as needed.";
  if(n.includes("Fatty Liver")) return "Advice: LFTs, Lipid Profile, Avoid fatty foods, Exercise, Weight reduction.";
  if(n.includes("Cholelithiasis")) return "Advice: LFTs, Avoid fatty foods, Surgical consultation if symptomatic.";
  if(n.includes("Hydronephrosis")||n.includes("Calculus")) return "Advice: RFTs, Urine R/E, Increase water intake, Urologist consultation.";
  if(n.includes("PCOS")) return "Advice: LH, FSH, Weight reduction, Gynae consultation.";
  if(n.includes("Fibroid")) return "Advice: CBC, Gynae consultation, Follow-up USG.";
  return "Advice: Relevant labs and specialist consultation advised.";
}

  if(n.startsWith("KUB")) return `<div class="diagramBox"><svg viewBox="0 0 200 110"><path d="M28 18 Q16 32 20 55 Q28 68 46 63 Q58 50 53 32 Q43 16 28 18 Z" fill="${fg}" stroke="${lg}" stroke-width="1.3"/><path d="M128 18 Q116 32 120 55 Q128 68 146 63 Q158 50 153 32 Q143 16 128 18 Z" fill="${fg}" stroke="${lg}" stroke-width="1.3"/><path d="M68 85 Q83 80 98 85 Q103 95 98 105 Q83 110 68 105 Q63 95 68 85 Z" fill="${fg}" stroke="${lg}" stroke-width="1.2"/></svg></div>`;
  return `<div class="diagramBox"><svg viewBox="0 0 200 50"><rect x="20" y="12" width="160" height="26" rx="6" fill="${fg}" stroke="${lg}" stroke-width="1" stroke-dasharray="3 2"/></svg></div>`;

function gen(n){
  let liver="Size __ cm [Normal: <14 cm], Homogenous [Normal: homogenous], No focal lesion [Normal: No lesion]";
  let gb="Well distended [Normal: well distended], Wall __ mm [Normal: <3 mm], Lumen clear [Normal: clear], No calculus [Normal: No calculus]";
  let panc="Head __ mm [Normal: <30 mm], Body __ mm [Normal: <25 mm], Tail __ mm [Normal: <25 mm], Normal [Normal: normal]";
  let spleen="Size __ cm [Normal: <12 cm], Normal [Normal: normal]";
  let rk="__ x __ cm [Normal: 9-12 x 4-5 cm], Cortex __ mm [Normal: >6 mm], No calculus [Normal: No calculus], No hydronephrosis [Normal: No hydronephrosis]";
  let lk=rk; let bladder="Volume __ cc [Normal: 300-400 cc], Wall __ mm [Normal: <3 mm], No calculus [Normal: No calculus]";
  let prostate="Size __ x __ x __ cm [Normal: 3.5 x 3 x 2.5 cm], Volume __ gm [Normal: 20-25 gm], Normal [Normal: normal]";
  return `ULTRASOUND ${n.split(' - ')[0]}:\n\nLIVER:\n${liver}.\n\nGALL BLADDER:\n${gb}.\n\nPANCREAS:\n${panc}.\n\nSPLEEN:\n${spleen}.\n\nRIGHT KIDNEY:\n${rk}.\n\nLEFT KIDNEY:\n${lk}.\n\nURINARY BLADDER:\n${bladder}.\n\nPROSTATE:\n${prostate}.\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;

function formatReportToHTML(text){
  let lines=text.split('\n'); let html='';
  lines.forEach(line=>{
    let l=line.trim(); if(!l){html+='<div style="height:3px"></div>';return;}
    let clean=l.replace(/\[Normal:[^\]]*\]/gi,'').trim(); if(!clean)return;
    if(clean.toUpperCase().startsWith('ULTRASOUND')){html+=`<div style="text-align:center;margin:10px 0;font-weight:900;text-decoration:underline;font-size:12px">${clean}</div>`;return;}
    if(clean.toUpperCase().startsWith('CONCLUSION:')){html+=`<div style="margin-top:12px"><b><u>CONCLUSION:</u></b> <b>${clean.replace(/CONCLUSION:/i,'').trim()}</b></div>`;return;}
    if(clean.toUpperCase().startsWith('ADVICE:')){html+=`<div style="margin-top:10px"><b><u>ADVICE:</u></b> ${clean.replace(/ADVICE:/i,'').trim()}</div>`;return;}
    if(clean.endsWith(':')){html+=`<div style="margin:6px 0 1px 0;font-weight:800;font-size:11px"><i>➢ ${clean}</i></div>`;}else{html+=`<div style="margin:1px 0 1px 22px;font-size:10.5px"><i>• ${clean.replace(/^[-•➢]\s*/,'').trim()}</i></div>`;}
  }); return html;
}
function make(){
  let pn=document.getElementById('pName'); if(!pn?.value){alert('Enter Patient Name');return;}
  let pid=document.getElementById('pIDMobile')?.value||'__';
  let complaintText=(document.getElementById('pComplaint')?.value||'').trim();
  let templateName=document.getElementById('uType').value||'';
  let patientBorder=`<div style="border:1.5px solid #000;padding:5px 7px;margin-bottom:6px;font-size:10px"><div><b>Name:</b> ${document.getElementById('pName').value} | <b>Age:</b> ${document.getElementById('pAge').value} | <b>Sex:</b> ${document.getElementById('pGen').value} | <b>Date:</b> ${document.getElementById('pDate').value} | <b>ID/Mobile:</b> ${pid}</div><div><b>Ref By:</b> ${document.getElementById('ref').value} | <b>Sonologist:</b> ${document.getElementById('sono').value}</div></div>`;
  let bodyHTML=formatReportToHTML(document.getElementById('rText').value);
  let diagramHTML=getDiagram(templateName);
  if(complaintText){bodyHTML=`<div style="margin-bottom:5px;font-size:10px"><b><i>C/O: ${complaintText}</i></b></div>`+bodyHTML;}
  bodyHTML+=diagramHTML+`<div style="clear:both"></div>`;
  let footer=`<div style="margin-top:12px;text-align:center;clear:both"><div style="font-size:8px"><i>This is computer generated report no signature required.</i></div><div style="font-size:10px;margin-top:5px;font-weight:700">Thanks for availing our services</div></div>`;
  document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;
  document.getElementById('outCard').style.display='block';
}
function saveR(){
  let content=document.getElementById('reportContent').innerHTML; if(!content){alert('Pehle Generate karen');return;}
  let name=document.getElementById('pName').value||'Report';
  let rec={id: editingId || Date.now(),name:name,age:document.getElementById('pAge')?.value||'',gen:document.getElementById('pGen')?.value||'',mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'Normal',date:document.getElementById('pDate')?.value||new Date().toISOString().slice(0,10),ref:document.getElementById('ref')?.value||'',sono:document.getElementById('sono')?.value||'',text:document.getElementById('rText')?.value||'',complaint:document.getElementById('pComplaint')?.value||'',html:content};
  let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}
  if(editingId){let idx=all.findIndex(x=>x.id===editingId); if(idx>=0){all[idx]=rec;} else{all.unshift(rec);} cancelEdit();}
  else{all.unshift(rec);}
  localStorage.setItem('azam_reports',JSON.stringify(all));
  render();
  uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));
  alert('✅ Saved + Uploading to Drive - Same file replace');
}
function cancelEdit(){editingId=null;editingMode=null;document.getElementById('formCard').classList.remove('editing');document.getElementById('editingBadge').style.display='none';document.getElementById('formTitle').innerText='Prepare Report';document.getElementById('saveBtn').innerText='Save + Upload to Drive';document.getElementById('saveBtn').style.background='#10b981';document.getElementById('cancelEditBtn').style.display='none';}
function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');if(!listEl)return;let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:20px">No reports - Click Load from Drive button upar</p>';return;}listEl.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:8px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;flex-wrap:wrap"><div style="flex:1"><b>${r.name||'Unnamed'}</b> - ${r.type||'Normal'}<br><small>${r.mobile||''} | ${r.date||''}</small></div><div style="display:flex;flex-wrap:wrap"><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#f59e0b" onclick="editR(${r.id})">Edit</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('pName').value=r.name||'';document.getElementById('pAge').value=r.age||'';document.getElementById('pGen').value=r.gen||'Male';document.getElementById('pIDMobile').value=r.mobile||'';document.getElementById('uType').value=r.type||'';document.getElementById('pDate').value=r.date||'';document.getElementById('ref').value=r.ref||'';document.getElementById('sono').value=r.sono||'';document.getElementById('rText').value=r.text||'';document.getElementById('pComplaint').value=r.complaint||'';document.getElementById('reportContent').innerHTML=r.html||'';document.getElementById('outCard').style.display='block';window.scrollTo(0,document.getElementById('outCard').offsetTop);}
function editR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;editingId=id;editingMode='local';document.getElementById('pName').value=r.name||'';document.getElementById('pAge').value=r.age||'';document.getElementById('pGen').value=r.gen||'Male';document.getElementById('pIDMobile').value=r.mobile||'';document.getElementById('uType').value=r.type||'';document.getElementById('pDate').value=r.date||'';document.getElementById('ref').value=r.ref||'';document.getElementById('sono').value=r.sono||'';document.getElementById('rText').value=r.text||'';document.getElementById('pComplaint').value=r.complaint||'';document.getElementById('formCard').classList.add('editing');document.getElementById('editingBadge').style.display='inline-block';document.getElementById('editingBadge').innerText='EDIT - SAME FILE REPLACE';document.getElementById('formTitle').innerText='Editing: '+(r.name||'Report');document.getElementById('saveBtn').innerText='Update - Same File + Drive';document.getElementById('saveBtn').style.background='#f59e0b';document.getElementById('cancelEditBtn').style.display='block';document.getElementById('reportContent').innerHTML=r.html||'';document.getElementById('outCard').style.display='block';window.scrollTo(0,document.getElementById('formCard').offsetTop);}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));if(editingId===id)cancelEdit();render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:document.getElementById('rText').value;doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allTemplates.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();let tc=document.getElementById('templateCount');if(tc)tc.innerText=allTemplates.length+' Templates';render();}
init();
</script></body></html>
