<script>
const CLIENT_ID='153046624604-p07rnrrj0kdhi23n8384kbd47i2rtace.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
let tokenClient,driveFolderId=null,editingId=null;
function gapiLoaded(){gapi.load('client', async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});}catch(e){}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:''});}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){alert('Google API load ho rahi hai');rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken())); document.getElementById('driveStatus').innerText='● Drive Connected'; res(r);}};tokenClient.requestAccessToken({prompt:''});});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports', mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}
async function findFileInFolder(folderId,fileName){try{let q=`'${folderId}' in parents and name='${fileName}' and trashed=false`;let res=await gapi.client.drive.files.list({q:q,fields:"files(id,name)"});if(res.result.files&&res.result.files.length>0) return res.result.files[0]; return null;}catch(e){return null;}}
async function uploadToDriveFile(name,content){ try{ let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); if(!folderId) return; let token=gapi.client.getToken(); let existing=await findFileInFolder(folderId,name); if(existing){ await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:content}); return; } const file=new Blob([content],{type:'application/json'});const meta={name:name,mimeType:'application/json',parents:[folderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',file); await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:new Headers({'Authorization':'Bearer '+token.access_token}),body:form}); }catch(e){} }
async function loadFromDrive(){ try{ document.getElementById('driveStatus').innerText='● Loading...'; let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); if(!folderId){alert('Drive folder nahi mila');return;} let file=await findFileInFolder(folderId,'Azam_Medical_Backup_ALL.json'); if(!file){alert('Drive par koi backup nahi mila');return;} let token=gapi.client.getToken(); let res=await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}}); if(!res.ok){alert('Load failed');return;} let text=await res.text(); let data=JSON.parse(text); if(!Array.isArray(data)){alert('Invalid backup');return;} localStorage.setItem('azam_reports',JSON.stringify(data)); render(); document.getElementById('driveStatus').innerText='● Loaded '+data.length; alert('✅ '+data.length+' reports loaded'); }catch(e){alert('Load error: '+e.message);} }
window.addEventListener('load',()=>{setTimeout(()=>{try{gapiLoaded();gisLoaded();}catch(e){}},1500);});
function checkCalculator(){ let v=document.getElementById('uType').value||''; document.getElementById('obsCalc').style.display = (v.includes('FWB'))? 'block' : 'none'; document.getElementById('prosCalc').style.display = (v.includes('PROSTATE'))? 'block' : 'none'; }

// *** FIXED AUTO CM/MM + HADLOCK CORRECT ***
function toMM(val){
 // Auto detect: agar value < 30 hai to ye cm hai (jaise 7.1 cm), mm me convert karo x10
 // agar >30 hai to already mm hai
 if(!val || val==0) return 0;
 if(val < 30) return val*10; // cm to mm
 return val; // already mm
}
function calcFWBFixed(){
 let raw_bpd = parseFloat(document.getElementById('bpd').value)||0;
 let raw_hc = parseFloat(document.getElementById('hc').value)||0;
 let raw_ac = parseFloat(document.getElementById('ac').value)||0;
 let raw_fl = parseFloat(document.getElementById('fl').value)||0;

 let bpd_mm = toMM(raw_bpd);
 let hc_mm = toMM(raw_hc);
 let ac_mm = toMM(raw_ac);
 let fl_mm = toMM(raw_fl);

 // Agar AC khali ho to HC se estimate karo (HC * 0.8)
 if(ac_mm===0 && hc_mm>0){ ac_mm = hc_mm*0.80; }

 if(bpd_mm===0 && hc_mm===0 && fl_mm===0 && ac_mm===0){ return; }

 let bpd_cm = bpd_mm/10, hc_cm = hc_mm/10, ac_cm = ac_mm/10, fl_cm = fl_mm/10;

 // GA calculation - simple clinical
 let ga_bpd=0, ga_hc=0, ga_fl=0, ga_ac=0;
 if(bpd_mm>0) ga_bpd = (bpd_mm - 20)*0.3 + 12;
 if(hc_mm>0) ga_hc = (hc_mm - 80)*0.11 + 12;
 if(fl_mm>0) ga_fl = (fl_mm - 10)*0.38 + 12;
 if(ac_mm>0) ga_ac = (ac_mm - 60)*0.13 + 12;
 let sum=0, cnt=0;
 if(bpd_mm>0){sum+=ga_bpd;cnt++} if(hc_mm>0){sum+=ga_hc;cnt++} if(fl_mm>0){sum+=ga_fl;cnt++} if(ac_mm>0){sum+=ga_ac;cnt++}
 let avgGA = cnt>0? sum/cnt : 0;

 if(avgGA>0){
   document.getElementById('gaResult').value = avgGA.toFixed(1)+' wks';
   let today = new Date(); let edd = new Date(); edd.setDate(today.getDate() + (40-avgGA)*7);
   document.getElementById('eddResult').value = edd.toLocaleDateString('en-GB');
   document.getElementById('calcDetail').innerHTML = `Used: BPD ${bpd_cm.toFixed(1)}cm (${bpd_mm}mm) | HC ${hc_cm.toFixed(1)}cm (${hc_mm}mm) | AC ${ac_cm.toFixed(1)}cm (${ac_mm.toFixed(0)}mm) | FL ${fl_cm.toFixed(1)}cm (${fl_mm}mm) | GA ${avgGA.toFixed(1)}wks`;
 }

 // Hadlock 1985 correct formula - EFW in grams
 // Hadlock 4 param: log10(EFW) = 1.3596 -0.00386*AC*FL +0.0064*HC +0.00061*BPD*AC +0.0424*AC +0.174*FL (cm)
 if(ac_cm>0 && fl_cm>0 && hc_cm>0){
   let log10EFW;
   if(bpd_cm>0){
     log10EFW = 1.3596 - (0.00386*ac_cm*fl_cm) + (0.0064*hc_cm) + (0.00061*bpd_cm*ac_cm) + (0.0424*ac_cm) + (0.174*fl_cm);
   } else {
     log10EFW = 1.326 - (0.00326*ac_cm*fl_cm) + (0.0107*hc_cm) + (0.0438*ac_cm) + (0.158*fl_cm);
   }
   let efw = Math.pow(10, log10EFW);
   // Safety: 100g se 5000g ke beech
   if(efw>100 && efw<5000){
     document.getElementById('efwResult').value = Math.round(efw) + ' gms';
   }
 }
}
function calcEDD(){ let lmp=document.getElementById('lmp').value; if(!lmp){ calcFWBFixed(); return; } let d=new Date(lmp); d.setDate(d.getDate()+280); document.getElementById('eddResult').value = d.toLocaleDateString('en-GB'); let today=new Date(lmp); let now=new Date(); let diffDays=Math.floor((now-today)/(1000*60*60*24)); let gaWeeks=diffDays/7; if(gaWeeks>0) document.getElementById('gaResult').value=gaWeeks.toFixed(1)+' wks (LMP)'; }

function insertFWBAnomaly(){
 let raw_bpd = parseFloat(document.getElementById('bpd').value)||7.1;
 let raw_hc = parseFloat(document.getElementById('hc').value)||25.0;
 let raw_ac = parseFloat(document.getElementById('ac').value)||20.1;
 let raw_fl = parseFloat(document.getElementById('fl').value)||5.4;
 let bpd_mm = toMM(raw_bpd), hc_mm = toMM(raw_hc), ac_mm = toMM(raw_ac), fl_mm = toMM(raw_fl);
 let bpd_cm = (bpd_mm/10).toFixed(1), hc_cm = (hc_mm/10).toFixed(1), ac_cm = (ac_mm/10).toFixed(1), fl_cm = (fl_mm/10).toFixed(1);
 let ga = document.getElementById('gaResult').value||'28 weeks+1 week';
 let efw = document.getElementById('efwResult').value||'1656 gms';
 let report = `FWB & OBSTETRIC ULTRASOUND REPORT:

Number of Fetus: SINGLE [N: Single]
Location: INTRAUTERINE [N: Intrauterine]
Presentation: CEPHALIC [N: Cephalic]
Lie: LONGITUDINAL LIE [N: Longitudinal]
Fetal Cardiac Activity: PRESENT (152 BPM) [N: Present]
Gross Fetal Movement: PRESENT [N: Present]
Placenta: ANTERIOR, NOT LOW-LYING [N: Not low-lying]
Placental Maturity: GRADE II [N: Grade 0-III]
Amount of Liquor: ADEQUATE RESPECTIVE TO GEST-AGE [N: Adequate]

B.P.D.: (Bi Parietal Diameter) ${bpd_cm} cm [N: As per ${ga}]
F.L.: (Femur Length) ${fl_cm} cm [N: As per ${ga}]
HC: (Head Circumference) ${hc_cm} cm [N: As per ${ga}]
AC: (Abdominal Circumference) ${ac_cm} cm [N: As per ${ga}]
Estimated Fetal Weight: ${efw} Approx [N: As per GA]

CONCLUSION:
Scan of the pelvis shows single alive intrauterine pregnancy corresponding to the gestational age of ${ga}. Cephalic presentation & placenta localized anteriorly no previa with grade II maturity. Internal os is closed. Amount of liquor is adequate.
Rest of study unremarkable.

AFI: 4.8 cm - 2.5 cm / 3.0 cm - 4.3 cm
The amniotic fluid index is 14.8 cm (Normal 08 to 20cm) [N: 8-20 cm]

ADVICE:
Routine antenatal follow up.`;
 document.getElementById('rText').value = report;
}
function insertFWBSimple(){

}
function calcProstate(){ let l=parseFloat(document.getElementById('prosL').value)||0; let w=parseFloat(document.getElementById('prosW').value)||0; let h=parseFloat(document.getElementById('prosH').value)||0; if(l&&w&&h){ let vol = l*w*h*0.52; document.getElementById('prosVol').value = vol.toFixed(1)+' gm'; } }
function insertProstate(){ let l=document.getElementById('prosL').value||'__', w=document.getElementById('prosW').value||'__', h=document.getElementById('prosH').value||'__', vol=document.getElementById('prosVol').value||''; document.getElementById('rText').value += `\nProstate: ${l} x ${w} x ${h} cm [N: <4.0 x 3.0 x 3.0 cm], Vol: ${vol} [N: 15-25 gm]\n`; }
const refDoctors=["Ref By - Select","Dr. Shahzad Azam","Dr. M. Azam Arain","Dr. Nazia wagan","Dr. Syed Kashan","Dr. Ali mangrio","Dr. M. Zeeshan","Dr. M. Ali Taj","Dr. Shakeel","Dr. Shahzad Sadaqat","Dr. Bilal","Self","Other"];

function getAdvice(n){
if(n.includes("Normal")) return "No active pathology. Routine follow up if needed.";
if(n.includes("Fatty Liver Grade 1")) return "Adv: LFTs, Fasting Lipid Profile, HbA1c, RBS, Ultrasound follow up after 6 months, Avoid oily/fatty foods, Regular exercise, Weight reduction.";
if(n.includes("Fullness")) return "Adv: RFTs, Creatinine, Urine R/E, Plenty of water, Repeat USG KUB after hydration, Urologist opinion if persistent.";
if(n.includes("Dilated Proximal Ureter")) return "Adv: RFTs, Creatinine, Urine R/E, X-ray KUB, CT KUB plain (Stone protocol), Urologist opinion, Plenty of water.";
if(n.includes("Hydronephrosis")||n.includes("Hydroureteronephrosis")) return "Adv: RFTs, Creatinine, Urine R/E, Urine C/S if fever, X-ray KUB, CT KUB plain for stone size & location, Urologist opinion, Plenty of water.";
if(n.includes("Renal Calculus")) return "Adv: RFTs, Creatinine, Calcium, Phosphorus, Uric acid, Urine R/E, X-ray KUB, CT KUB plain, Plenty of water 3-4L/day, Urologist opinion.";
if(n.includes("BPH")) return "Adv: PSA, RFTs, Urine R/E, Urine C/S, Uroflowmetry, Post void residual scan, Urologist opinion.";
return "Adv: Relevant labs as per disease and specialist consultation.";
}
function getDiagnosis(n){ if(n.includes("Dilated Proximal Ureter")){ return "Mild hydronephrosis with proximal ureter dilated. However, no calculus seen in the visualized part of ureter. Possibility of distal ureteric calculus cannot be excluded"; } let parts = n.split(' - '); if(parts.length>1){ return parts.slice(1).join(' - ').trim(); } return n; }
let T={}; allNames.forEach(k=>{ let diag = getDiagnosis(k); let reportText = getReportEdit(k); let finalConclusion = diag + ".\nRest of study unremarkable."; T[k]=reportText+`\n\nCONCLUSION:\n${finalConclusion}\n\nADVICE:\n${getAdvice(k)}`; });
let allTemplates=Object.keys(T);
function cleanForPrint(text){ return text.replace(/\s*\[N:.*?\]/g, ''); }

function useSelectedTemplate(){let v=document.getElementById('uType')?.value;if(!v){alert('Select');return;}document.getElementById('rText').value=T[v]||''; checkCalculator();}
function formatReportToHTML(text){
  let printText=cleanForPrint(text);
  let lines=printText.split('\n');
  let html='';
  lines.forEach(line=>{
    let l=line.trim();
    if(!l){html+='<div style="height:5px"></div>';return;}
    if(l.toUpperCase().startsWith('ULTRASOUND')||l.toUpperCase().startsWith('FWB &')){html+=`<div style="text-align:center;margin:10px 0;font-weight:900;text-decoration:underline;font-size:12pt!important">`+l+`</div>`;return;}
    if(l.toUpperCase().startsWith('CONCLUSION:')){
      let rest=l.replace(/CONCLUSION:/i,'').trim();
      html+=`<div style="margin-top:12px"><b style="text-decoration:underline;font-weight:900;font-size:12pt!important">CONCLUSION:</b></div><div style="margin-left:10px;font-weight:900;font-size:12pt!important"><b>• ${rest}</b></div>`;return;
    }
    if(l.toUpperCase().startsWith('ADVICE:')){
      let rest=l.replace(/ADVICE:/i,'').trim();
      html+=`<div style="margin-top:8px"><b style="text-decoration:underline;font-weight:900;font-size:12pt!important">ADVICE:</b></div><div style="margin-left:10px;font-weight:900;font-size:12pt!important"><b>• ${rest}</b></div>`;return;
    }
    if(l.includes(':')){
      let parts=l.split(':');
      let heading=parts[0].trim();
      let value=parts.slice(1).join(':').trim();
      let organs=["LIVER","GALL BLADDER","SPLEEN","PANCREAS","RIGHT KIDNEY","LEFT KIDNEY","URINARY BLADDER","UTERUS","RIGHT OVARY","LEFT OVARY","POD","BPD","HC","AC","FL","PROSTATE","Number of Fetus","Location","Presentation","Lie","Fetal Cardiac Activity","Gross Fetal Movement","Placenta","Placental Maturity","Amount of Liquor","B.P.D.","F.L.","HC","AC","Estimated Fetal Weight","AFI"];
      if(organs.some(o=>heading.toUpperCase().includes(o.toUpperCase()))){
        html+=`<div style="margin:3px 0 3px 10px;font-size:12pt!important">• <b style="text-decoration:underline;font-weight:900;font-size:12pt!important">${heading}:</b> <span style="font-size:12pt!important">${value}</span></div>`;
        return;
      }
    }
    html+=`<div style="margin:2px 0 2px 10px;font-size:12pt!important">• ${l.replace(/^•\s*/,'')}</div>`;
  });
  return html;
}

  let content=document.getElementById('reportContent').innerHTML;
  if(!content||content.trim()===''){alert('Pehle Generate Final Report karen');return;}
  let rec={ id: editingId || Date.now(), name:document.getElementById('pName').value||'Report', pName:document.getElementById('pName').value, pAge:document.getElementById('pAge').value, pGen:document.getElementById('pGen').value, pDate:document.getElementById('pDate').value, pIDMobile:document.getElementById('pIDMobile').value, ref:getRefValue(), sono:getSonoValue(), pComplaint:document.getElementById('pComplaint').value, mobile:document.getElementById('pIDMobile')?.value||'', type:document.getElementById('uType')?.value||'', date:document.getElementById('pDate')?.value||'', html:content, text:document.getElementById('rText')?.value||'' };
  let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}
  if(editingId){ let idx=all.findIndex(x=>x.id===editingId); if(idx>=0) all[idx]=rec; else all.unshift(rec); editingId=null; document.getElementById('editMode').style.display='none'; } else { all.unshift(rec); }
  localStorage.setItem('azam_reports',JSON.stringify(all)); render(); uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all)); alert('✅ Saved to Drive & Local');
}
function render(){
  let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}
  let q=(document.getElementById('sBox')?.value||'').toLowerCase();
  let listEl=document.getElementById('list');
  let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));
  if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:15px;font-size:10pt">No reports</p>';return;}
  listEl.innerHTML=f.map(r=>`
    <div style="border:1px solid #cbd5e1;padding:8px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;font-size:10pt">
      <div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div>
      <div style="display:flex;gap:4px">
        <button class="small" style="background:#0a4eb5;padding:8px 12px" onclick="viewR(${r.id})">View</button>
        <button class="small" style="background:#ff9800;padding:8px 12px" onclick="editR(${r.id})">Edit</button>
        <button class="small" style="background:#ff3b30;padding:8px 12px" onclick="delR(${r.id})">Del</button>
      </div>
    </div>`).join('');
}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('reportContent').innerHTML=r.html;document.getElementById('outCard').style.display='block';window.scrollTo(0,document.getElementById('outCard').offsetTop);}
function editR(id){ let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return; document.getElementById('pName').value=r.pName||r.name||''; document.getElementById('pAge').value=r.pAge||''; document.getElementById('pGen').value=r.pGen||'Male'; document.getElementById('pDate').value=r.pDate||r.date||''; document.getElementById('pIDMobile').value=r.pIDMobile||r.mobile||''; if(refDoctors.includes(r.ref)){document.getElementById('ref').value=r.ref; document.getElementById('refOther').style.display='none';} else {document.getElementById('ref').value='Other'; document.getElementById('refOther').style.display='block'; document.getElementById('refOther').value=r.ref||'';} if(sonoDoctors.includes(r.sono)){document.getElementById('sono').value=r.sono; document.getElementById('sonoOther').style.display='none';} else {document.getElementById('sono').value='Other'; document.getElementById('sonoOther').style.display='block'; document.getElementById('sonoOther').value=r.sono||'';} document.getElementById('pComplaint').value=r.pComplaint||''; document.getElementById('rText').value=r.text||''; editingId=r.id; document.getElementById('editMode').style.display='inline-block'; document.getElementById('reportContent').innerHTML=r.html; document.getElementById('outCard').style.display='block'; window.scrollTo(0,document.getElementById('formCard').offsetTop); }
function delR(id){if(!confirm('Delete karna hai?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:cleanForPrint(document.getElementById('rText').value);doc.setFontSize(12);doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allNames.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();document.getElementById('templateCount').innerText=allTemplates.length+' Templates';render();}
init();
</script></body></html>
