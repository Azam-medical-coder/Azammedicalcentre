function getAdvice(n){
  if(n.includes("Normal")) return "No active pathology noted. Routine follow-up as needed. Maintain healthy diet and hydration.";
  if(n.includes("Fatty Liver Grade 1")) return "Advice: LFTs, Lipid Profile, Fasting Blood Sugar, Avoid oily/fatty foods, Regular exercise 30min daily, Weight reduction, Repeat USG after 3 months.";
  if(n.includes("Fatty Liver Grade 2")) return "Advice: LFTs, Lipid Profile, HbA1c, Strict diet control, Avoid alcohol, Daily walk 45min, Gastroenterologist consultation.";
  if(n.includes("Fatty Liver Grade 3")) return "Advice: LFTs, Lipid Profile, HbA1c, HBsAg/HCV, FibroScan, Urgent Gastroenterologist consultation, Strict low fat diet.";
  if(n.includes("Cholelithiasis")) return "Advice: LFTs, CBC, Lipid Profile, Avoid fatty foods, Plenty of fluids, Surgical consultation for cholecystectomy if symptomatic.";
  if(n.includes("Sludge")) return "Advice: LFTs, Plenty of water 3-4L/day, Avoid fatty foods, Repeat USG after 4 weeks.";
  if(n.includes("Cholecystitis")) return "Advice: CBC, CRP, LFTs, NPO, Urgent Surgical consultation, Hospital admission may be required.";
  if(n.includes("Appendicitis")) return "Advice: CBC, CRP, Urine R/E, Urgent Surgical consultation, NPO, Hospital admission advised.";
  if(n.includes("Hernia")) return "Advice: Avoid heavy weight lifting, Avoid chronic cough/constipation, Surgical consultation for hernioplasty.";
  if(n.includes("Ascites")) return "Advice: LFTs, RFTs, Serum Albumin, SAAG, Ascitic fluid D/R, Physician urgent consultation, Low salt diet.";
  if(n.includes("Pancreatitis")) return "Advice: Serum Amylase, Lipase, LFTs, RFTs, CBC, CRP, Strict NPO, Urgent Surgical consultation.";
  if(n.includes("Renal Calculus")||n.includes("Staghorn")||n.includes("Bladder Stone")) return "Advice: RFTs, Urine R/E & C/S, Serum Calcium, Uric Acid, X-Ray KUB, CT KUB if needed, Increase water intake 3-4L/day, Urologist consultation.";
  if(n.includes("Hydronephrosis")||n.includes("Hydrouretero")||n.includes("PUJ")) return "Advice: RFTs, Urine R/E & C/S, CT KUB / IVP, DTPA scan if PUJ obstruction, Urgent Urologist consultation.";
  if(n.includes("Parenchymal Changes")) return "Advice: RFTs, Urine R/E, 24hr Urine Protein, BP monitoring, Nephrologist consultation.";
  if(n.includes("Cortical Cyst")||n.includes("Polycystic")) return "Advice: RFTs, Urine R/E, BP check, Urologist consultation, Follow-up USG after 6 months.";
  if(n.includes("Cystitis")) return "Advice: Urine R/E & Culture, CBC, RFTs, Plenty of fluids, Urologist consultation.";
  if(n.includes("BPH")||n.includes("PROSTATE")) return "Advice: PSA, Urine R/E, RFTs, Uroflowmetry, Urologist consultation, Avoid constipation.";
  if(n.includes("PCOS")) return "Advice: LH, FSH, Prolactin, Testosterone, TSH, HbA1c, Weight reduction, Lifestyle modification, Gynae consultation.";
  if(n.includes("Fibroid")) return "Advice: CBC, CA-125, Pap Smear, Gynae consultation, Follow-up USG after 3 months.";
  if(n.includes("Ovarian Cyst")) return "Advice: CA-125, Gynae consultation, Follow-up USG after 2 months.";
  if(n.includes("PID")) return "Advice: CBC, CRP, High Vaginal Swab C/S, Gynae consultation, Antibiotics as prescribed.";
  if(n.includes("FWB")||n.includes("Pregnancy")) return "Advice: CBC, Blood Group, GTT, Urine R/E, Anomaly scan at 18-20 weeks, Regular antenatal check-up, Gynae consultation.";
  if(n.includes("Oligohydramnios")) return "Advice: Plenty of oral fluids 3-4L/day, Bed rest, NST, Doppler, Daily fetal movement count, Gynae consultation.";
  if(n.includes("Polyhydramnios")) return "Advice: GTT, HbA1c, Detailed anomaly scan, Gynae consultation.";
  if(n.includes("Breech")||n.includes("Previa")) return "Advice: High risk pregnancy, Strict bed rest, Hospital delivery planning, Gynae emergency consultation.";
  if(n.includes("BREAST")) return "Advice: Mammography, FNAC if needed, Oncologist/Surgeon consultation, Follow-up.";
  if(n.includes("THYROID")) return "Advice: TFTs, Anti-TPO, FNAC from nodule if >1cm, ENT/Endocrine consultation.";
  if(n.includes("SCROTUM")||n.includes("TESTIS")) return "Advice: CBC, Urine R/E, Scrotal Doppler, Urologist consultation, Scrotal support.";
  return "Advice: As per findings, relevant labs and specialist consultation advised.";
}

let T={}; allNames.forEach(k=>{T[k]=gen(k);});
let allTemplates=Object.keys(T);
function filterTemplates(){let q=(document.getElementById('tSearch')?.value||'').toLowerCase();let filtered=allTemplates.filter(k=>k.toLowerCase().includes(q));let s=document.getElementById('uType');if(!s)return;let cur=s.value;s.innerHTML='';filtered.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});if(filtered.includes(cur))s.value=cur;}
function useSelectedTemplate(){let v=document.getElementById('uType')?.value;if(!v){alert('Select template');return;}document.getElementById('rText').value=T[v]||'';}
function formatReportToHTML(text){
  let lines=text.split('\n'); let html='';
  lines.forEach(line=>{
    let l=line.trim(); if(!l){html+='<div style="height:3px"></div>';return;}
    let clean=l.replace(/\[Normal:[^\]]*\]/gi,'').trim(); if(!clean)return;
    if(clean.toUpperCase().startsWith('ULTRASOUND')){html+=`<div style="text-align:center;margin:10px 0;font-weight:900;text-decoration:underline;font-size:12px">${clean}</div>`;return;}
    if(clean.toUpperCase().startsWith('CONCLUSION:')){html+=`<div style="margin-top:12px"><b><u>CONCLUSION:</u></b> <b>${clean.replace(/CONCLUSION:/i,'').trim()}</b></div>`;return;}
    if(clean.toUpperCase().startsWith('ADVICE:')){html+=`<div style="margin-top:10px"><b><u>ADVICE:</u></b> ${clean.replace(/ADVICE:/i,'').trim()}</div>`;return;}
    if(clean.includes('LFTs')||clean.includes('RFTs')||clean.includes('No active pathology')||clean.includes('Routine follow-up')||clean.includes('Maintain healthy')||clean.includes('GTT')||clean.includes('Urine R/E')||clean.includes('CBC')||clean.includes('Gynae')||clean.includes('Urologist')||clean.includes('Physician')||clean.includes('Plenty of oral')||clean.includes('Avoid')||clean.includes('Mammography')||clean.includes('TFTs')){
      if(!clean.toUpperCase().startsWith('ADVICE:')){html+=`<div style="margin:2px 0 2px 16px;font-size:10.5px"><i>${clean}</i></div>`;}return;
    }
    if(clean.endsWith(':')){html+=`<div style="margin:6px 0 1px 0;font-weight:800;font-size:11px"><i>➢ ${clean}</i></div>`;}else{html+=`<div style="margin:1px 0 1px 22px;font-size:10.5px"><i>• ${clean.replace(/^[-•➢]\s*/,'').trim()}</i></div>`;}
  }); return html;
}
function make(){
  let pn=document.getElementById('pName'); if(!pn?.value){alert('Enter Patient Name');return;}
  let pid=document.getElementById('pIDMobile')?.value||'__';
  let complaintText=(document.getElementById('pComplaint')?.value||'').trim();
  let templateName=document.getElementById('uType').value||'';
  let patientBorder=`<div style="border:1.5px solid #000;padding:5px 7px;margin-bottom:6px;font-size:10px"><div><b>Name:</b> ${document.getElementById('pName').value} | <b>Age:</b> ${document.getElementById('pAge').value} | <b>Sex:</b> ${document.getElementById('pGen').value} | <b>Date:</b> ${document.getElementById('pDate').value} | <b>ID/Mobile:</b> ${pid}</div><div><b>Ref By:</b> ${document.getElementById('ref').value} | <b>Sonologist:</b> ${document.getElementById('sono').value}</div></div>`;
  let bodyHTML=formatReportToHTML(document.getElementById('rText').value);
  let diagramHTML=getDiagram(templateName);
  if(complaintText){bodyHTML=`<div style="margin-bottom:5px;font-size:10px"><b><i>C/O: ${complaintText}</i></b></div>`+bodyHTML;}
  bodyHTML+=diagramHTML+`<div style="clear:both"></div>`;
  let footer=`<div style="margin-top:12px;text-align:center;clear:both"><div style="font-size:8px"><i>This is computer generated report no signature required.</i></div><div style="font-size:10px;margin-top:5px;font-weight:700">Thanks for availing our services</div></div>`;
  document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;
  document.getElementById('outCard').style.display='block';
}
function saveR(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let rec={id:Date.now(),name:document.getElementById('pName')?.value||'',age:document.getElementById('pAge')?.value||'',gen:document.getElementById('pGen')?.value||'',mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'',date:document.getElementById('pDate')?.value||'',ref:document.getElementById('ref')?.value||'',sono:document.getElementById('sono')?.value||'',text:document.getElementById('rText')?.value||'',complaint:document.getElementById('pComplaint')?.value||'',html:document.getElementById('reportContent')?.innerHTML||''};all.unshift(rec);localStorage.setItem('azam_reports',JSON.stringify(all));render();alert('Saved locally');}

function saveCurrentToDrive(){
  let content=document.getElementById('reportContent').innerHTML;
  if(!content){alert('Pehle Generate karen');return;}
  let name=(document.getElementById('pName').value||'Report').replace(/\s+/g,'_');
  let fullHtml=`<html><head><meta charset="UTF-8"><title>${name}</title></head><body>${content}</body></html>`;
  let blob=new Blob([fullHtml],{type:'text/html'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a'); a.href=url; a.download=name+'.html'; a.click();
  try{
    let driveData=JSON.parse(localStorage.getItem('azam_drive_backup')||'[]');
    driveData.unshift({id:Date.now(),name:document.getElementById('pName').value||'Report',mobile:document.getElementById('pIDMobile').value||'',type:document.getElementById('uType').value||'',date:new Date().toISOString().slice(0,10),html:content});
    localStorage.setItem('azam_drive_backup',JSON.stringify(driveData));
    document.getElementById('driveStatus').innerText='● Drive Saved - '+name+' | '+new Date().toLocaleString();
    document.getElementById('driveStatus').style.color='#10b981';
    renderDrive();
    alert('☁️ Report Save ho gayi! HTML download ho gaya hai, ab is file ko Google Drive pe upload kar den. Drive Backup list me bhi save ho gayi hai.');
    window.open('https://drive.google.com/drive/','_blank');
  }catch(e){alert('Drive save error - '+e.message);}
}
function saveToDriveById(id){
  let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');
  let r=all.find(x=>x.id===id);
  if(!r){alert('Report not found');return;}
  let name=(r.name||'Report').replace(/\s+/g,'_');
  let fullHtml=`<html><head><meta charset="UTF-8"><title>${name}</title></head><body>${r.html||r.text}</body></html>`;
  let blob=new Blob([fullHtml],{type:'text/html'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a'); a.href=url; a.download=name+'.html'; a.click();
  try{
    let driveData=JSON.parse(localStorage.getItem('azam_drive_backup')||'[]');
    driveData.unshift({id:Date.now(),name:r.name,mobile:r.mobile,type:r.type,date:new Date().toISOString().slice(0,10),html:r.html||r.text});
    localStorage.setItem('azam_drive_backup',JSON.stringify(driveData));
    renderDrive();
    alert('☁️ '+r.name+' Drive pe save ho gayi! File download ho gayi, Google Drive pe upload kar den.');
    window.open('https://drive.google.com/drive/','_blank');
  }catch(e){alert('Error: '+e.message);}
}

function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');if(!listEl)return;let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:20px">No reports</p>';return;}listEl.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:8px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#10b981" onclick="saveToDriveById(${r.id})">Drive</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function renderDrive(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_drive_backup')||'[]');}catch(e){all=[];}let el=document.getElementById('driveList');if(!el)return;if(all.length===0){el.innerHTML='<p style="text-align:center;color:#888;padding:15px">No Drive backups yet. Save to Drive karen.</p>';return;}el.innerHTML=all.map(r=>`<div style="border:1px solid #a5b4fc;padding:8px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;background:#fff"><div><b>☁️ ${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date} | Drive Saved</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewDriveR(${r.id})">View</button><button class="small" style="background:#ff3b30" onclick="delDriveR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('pName').value=r.name;document.getElementById('pAge').value=r.age;document.getElementById('pGen').value=r.gen;document.getElementById('pIDMobile').value=r.mobile;document.getElementById('uType').value=r.type;document.getElementById('pDate').value=r.date;document.getElementById('ref').value=r.ref;document.getElementById('sono').value=r.sono;document.getElementById('rText').value=r.text;document.getElementById('pComplaint').value=r.complaint;document.getElementById('reportContent').innerHTML=r.html||'';document.getElementById('outCard').style.display='block';window.scrollTo(0,0);}
function viewDriveR(id){let all=JSON.parse(localStorage.getItem('azam_drive_backup')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('reportContent').innerHTML=r.html;document.getElementById('outCard').style.display='block';window.scrollTo(0,0);}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();}
function delDriveR(id){if(!confirm('Delete Drive backup?'))return;let all=JSON.parse(localStorage.getItem('azam_drive_backup')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_drive_backup',JSON.stringify(all));renderDrive();}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:document.getElementById('rText').value;doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
