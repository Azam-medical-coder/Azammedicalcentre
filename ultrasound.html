<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azam Medical Centre - Final Watermark</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Times New Roman', Times, serif}
body{background:#eef4ff;padding:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px auto;max-width:1100px;box-shadow:0 6px 18px #0001}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:2px solid #cbd5e1;margin:5px 0;font-size:14px}
.btn{background:linear-gradient(90deg,#1e90ff,#7c3aed);color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;margin-top:8px}
.small{padding:8px 10px;border-radius:8px;border:none;margin:2px;font-weight:700;cursor:pointer;color:#fff;font-size:11px}
.report{width:180mm;min-height:210mm;margin:auto;background:#fff;border:1.5px solid #0a4eb5;border-radius:10px;padding:0 5mm 5mm 5mm;padding-top:36mm;position:relative;overflow:hidden}
.report::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;height:380px;background-image:url('https://i.ibb.co/3mY2YxXQ/am-logo.png'),url('logo.png');background-repeat:no-repeat;background-position:center;background-size:contain;opacity:0.09;z-index:0;pointer-events:none}
.report-inner{width:170mm;min-height:165mm;margin:2mm auto;padding:3mm 4mm;font-size:13pt;line-height:1.5;z-index:2;color:#000;position:relative}
.diagramBox{float:right;width:52mm;opacity:0.12;filter:grayscale(100%);margin:5px 0 5px 12px;pointer-events:none}
.diagramBox svg{width:100%;max-height:90px}
#loginOverlay{position:fixed;inset:0;background:#0a4eb5;display:flex;align-items:center;justify-content:center;z-index:99999}
.loginBox{background:#fff;padding:30px;border-radius:20px;width:90%;max-width:400px;text-align:center}
@media print{@page{size:180mm 210mm;margin:0}body{background:#fff}body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;width:180mm;min-height:210mm;border:none;margin:0}.noPrint{display:none}}
.boxTitle{font-size:15px;font-weight:900;color:#0a4eb5;margin-bottom:8px;display:flex;justify-content:space-between}
</style></head><body>

<div id="loginOverlay"><div class="loginBox">
<img src="logo.png" style="width:75px;height:75px;border-radius:50%;border:3px solid #0a4eb5;margin-bottom:10px">
<h2 style="color:#0a4eb5">Azam Medical Centre</h2>
<input id="passInput" type="password" placeholder="Password" style="text-align:center">
<button class="btn" onclick="checkPass()">Login</button>
<p id="passErr" style="color:red;display:none">Wrong! Password: Pakistan@777</p>
</div></div>

<div class="card noPrint" style="text-align:center;border:3px solid #1e90ff;display:flex;align-items:center;justify-content:center;gap:15px">
<img src="logo.png" style="width:60px;height:60px;border-radius:50%;border:2px solid #0a4eb5">
<div><h2 style="color:#0a4eb5">Azam Medical Centre</h2><p>Plot 27, Allama Iqbal Road, Manzoor Colony, Karachi</p>
<div id="driveStatus" style="font-size:11px;color:#f59e0b">● Connecting to Google Drive...</div>
<div style="display:flex;gap:6px;justify-content:center;margin-top:6px"><button class="small" style="background:#0a4eb5" onclick="connectDrive()">🔗 Connect Drive</button><button class="small" style="background:#10b981" onclick="loadFromDrive()">☁️ Load from Drive</button></div>
</div></div>

<div class="card noPrint" style="border:3px solid #8b5cf6;background:#faf5ff"><div class="boxTitle"><span>Template Library - 140</span><span id="templateCount"></span></div><input id="tSearch" placeholder="Search template..." onkeyup="filterTemplates()"><select id="uType" size="20" style="height:400px;font-size:13px;font-weight:600"></select><button class="small" style="background:#8b5cf6;width:100%;padding:12px;margin-top:8px" onclick="useSelectedTemplate()">Use This Template</button></div>

<div class="card noPrint" id="formCard" style="border:3px solid #1e90ff"><div class="boxTitle"><span id="formTitle">Prepare Report</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><input id="pName" placeholder="Patient Name *"><input id="pAge" placeholder="Age"><select id="pGen"><option>Male</option><option>Female</option><option>Child</option></select></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="pDate" type="date"><input id="pIDMobile" placeholder="Patient ID / Mobile"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="ref"></select><select id="sono"></select></div>
<div style="border:2px solid #10b981;border-radius:12px;padding:10px;margin:8px 0;background:#f0fdf4"><label style="font-weight:800;color:#065f46;font-size:12px">C/O</label><textarea id="pComplaint" rows="2"></textarea></div>
<textarea id="rText" rows="24" style="font-family:Consolas,monospace;font-size:13px"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" onclick="make()">Generate Final Report</button><button class="btn" id="saveBtn" style="background:#10b981" onclick="saveR()">Save + Upload to Drive</button></div>
</div>

<div class="card" id="outCard" style="display:none"><div id="out" class="report"><div id="reportContent" class="report-inner"></div></div><div class="noPrint" style="display:flex;gap:8px;margin-top:12px;justify-content:center"><button class="small" style="background:#000;padding:12px 20px" onclick="window.print()">Print</button><button class="small" style="background:#10b981;padding:12px 20px" onclick="pdf()">PDF</button></div></div>

<div class="card noPrint"><div class="boxTitle"><span>Saved Reports - Auto Drive Sync</span></div><input id="sBox" placeholder="Search..." onkeyup="render()"><div id="list"></div></div>

<script>
const CLIENT_ID='153046624604-p07rnrrj0kdhi23n8384kbd47i2rtace.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
let tokenClient,gapiInited=false,gisInited=false,driveFolderId=null,editingId=null;

function updateDriveStatus(m,c){let e=document.getElementById('driveStatus');if(e){e.innerText='● '+m; e.style.color=c||'#10b981';}}
function gapiLoaded(){gapi.load('client', async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});gapiInited=true;updateDriveStatus('Drive Ready - Click Connect',' #0a4eb5');}catch(e){updateDriveStatus('Drive Error',' #ff3b30');}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:''});gisInited=true;}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken())); res(r);}};tokenClient.requestAccessToken({prompt:'consent'});});}
function connectDrive(){ensureDriveAuth().then(()=>{updateDriveStatus('Drive Connected - Loading...',' #10b981'); loadFromDrive();}).catch(e=>{alert('Drive connect error');});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports', mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}
async function findFileInFolder(folderId,fileName){try{let q=`'${folderId}' in parents and name='${fileName}' and trashed=false`;let res=await gapi.client.drive.files.list({q:q,fields:"files(id,name)"});if(res.result.files&&res.result.files.length>0) return res.result.files[0]; return null;}catch(e){return null;}}
async function uploadToDriveFile(name,content){
 try{
  if(!gapiInited||!gisInited||!tokenClient){updateDriveStatus('Local Saved - Drive not connected',' #f59e0b'); return;}
  let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}}
  await ensureDriveAuth();
  let folderId=await getOrCreateFolder(); if(!folderId) return;
  let token=gapi.client.getToken(); if(!token||!token.access_token) return;
  let existing=await findFileInFolder(folderId,name);
  if(existing){
   await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:content});
   updateDriveStatus('Saved to Drive - Same File Replace',' #10b981'); return;
  }
  const file=new Blob([content],{type:'application/json'});const meta={name:name,mimeType:'application/json',parents:[folderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',file);
  await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:new Headers({'Authorization':'Bearer '+token.access_token}),body:form});
  updateDriveStatus('Saved to Drive',' #10b981');
 }catch(e){updateDriveStatus('Local Saved',' #f59e0b');}
}
async function loadFromDrive(){
 try{
  if(!gapiInited||!gisInited){alert('Drive loading, 2 sec wait karein');return;}
  updateDriveStatus('Loading from Drive...',' #f59e0b');
  let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}}
  await ensureDriveAuth();
  let folderId=await getOrCreateFolder(); if(!folderId){alert('Folder not found');return;}
  let listResp=await gapi.client.drive.files.list({q:`'${folderId}' in parents and trashed=false`,fields:"files(id,name,modifiedTime)",pageSize:100,orderBy:"modifiedTime desc"});
  let files=listResp.result.files||[];
  if(files.length===0){alert('Drive empty - Pehle Save karein');updateDriveStatus('Drive Empty',' #ff3b30');return;}
  let mainFile=files.find(f=>f.name==='Azam_Medical_Backup_ALL.json');
  if(mainFile){
    try{
      let token=gapi.client.getToken();
      let resp=await fetch(`https://www.googleapis.com/drive/v3/files/${mainFile.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}});
      if(resp.ok){
        let text=await resp.text();
        let allData=JSON.parse(text);
        if(Array.isArray(allData) && allData.length>0){
          localStorage.setItem('azam_reports',JSON.stringify(allData));
          render();
          updateDriveStatus(`Loaded ${allData.length} from Drive - Auto Sync`,' #10b981');
          alert(`✅ ${allData.length} reports Drive se load ho gayi!`);
          return;
        }
      }
    }catch(e){}
  }
 }catch(e){alert('Drive error: '+(e.message||e));}
}
window.addEventListener('load',()=>{setTimeout(()=>{try{gapiLoaded();gisLoaded();}catch(e){}},1500);});

// Templates with clean kidney format
const refDoctors=["Ref By - Select","Dr. Shahzad Azam","Dr. M. Azam Arain","Dr. Nazia wagan","Dr. Syed Kashan","Dr. Ali mangrio","Dr. M. Zeeshan","Self","Other"];
const sonoDoctors=["Sonologist - Select","DR. M. ZEESHAN","DR. NAZIA WAGAN","DR. SAMAN AZAM","Other"];
function fillSelect(id,list){let s=document.getElementById(id);if(!s)return;s.innerHTML='';list.forEach(v=>{let o=document.createElement('option');o.value=v.includes('Select')?'':v;o.textContent=v;s.appendChild(o);});}
fillSelect('ref',refDoctors);fillSelect('sono',sonoDoctors);
function checkPass(){let p=document.getElementById('passInput').value.trim();if(p==='Pakistan@777' || p==='Zee'){sessionStorage.setItem('azam_login','ok');document.getElementById('loginOverlay').style.display='none';}else{document.getElementById('passErr').style.display='block';}}
if(sessionStorage.getItem('azam_login')==='ok'){document.getElementById('loginOverlay').style.display='none';}
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPass();});

const allNames=["WHOLE ABDOMEN - Normal","WHOLE ABDOMEN - Fatty Liver Grade 1","WHOLE ABDOMEN - Fatty Liver Grade 2","KUB - Normal","KUB - Renal Calculus Right","KUB - Renal Calculus Left","KUB - Hydronephrosis Mild Right","KUB - Hydronephrosis Moderate Left","KUB - Simple Cortical Cyst Right","KUB - Complex Cyst Right","KUB + PROSTATE - Normal","KUB + PROSTATE - BPH","PELVIS - Normal","PELVIS - PCOS","FWB - Normal Single Pregnancy","BREAST - Normal","THYROID - Normal","SCROTUM - Normal"];

function getAdvice(n){
  if(n.includes("Normal")) return "No active pathology noted. Routine follow-up as needed.";
  if(n.includes("Fatty Liver")) return "Advice: LFTs, Lipid Profile, Avoid fatty foods, Exercise.";
  if(n.includes("Calculus")||n.includes("Hydronephrosis")) return "Advice: RFTs, Urine R/E, Increase water intake, Urologist consultation.";
  return "Advice: Relevant labs and specialist consultation advised.";
}
function getDiagram(n){
  let lg='#bbbbbb',fg='#f2f2f2';
  if(n.includes("WHOLE ABDOMEN")) return `<div class="diagramBox"><svg viewBox="0 0 200 120"><path d="M10 12 Q45 5 80 15 Q92 25 85 42 Q55 50 30 45 Q15 30 10 12 Z" fill="${fg}" stroke="${lg}" stroke-width="1.2"/></svg></div>`;
  if(n.includes("KUB")) return `<div class="diagramBox"><svg viewBox="0 0 200 110"><path d="M28 18 Q16 32 20 55 Q28 68 46 63 Q58 50 53 32 Q43 16 28 18 Z" fill="${fg}" stroke="${lg}" stroke-width="1.3"/><path d="M128 18 Q116 32 120 55 Q128 68 146 63 Q158 50 153 32 Q143 16 128 18 Z" fill="${fg}" stroke="${lg}" stroke-width="1.3"/></svg></div>`;
  return ``;
}
function gen(n){
  let rk_size="11.5 x 4.5 cm", lk_size="11.0 x 4.5 cm";
  let kidneyNormal=`${rk_size}.\nNormal in size, shape and texture.\nNormal Cortical thickness and corticomedullary distinction is intact.\nNo evidence of calculus, cyst or mass seen.`;
  let liver=`Size 14.5 cm, Homogenous, No focal lesion, PV 12 mm, CBD 4 mm, No IHBR`;
  let gb=`Well distended, Wall 3 mm, Lumen clear, No calculus, No sludge`;
  let spleen=`Size 10.0 cm, Normal, Homogenous, No focal lesion`;
  let bladder=`Normal mucosal wall.\nNo evidence of mass, hydronephrosis, calculus, diverticula seen.`;

  if(n.includes("KUB")){
    return `ULTRASOUND KUB:\n\nRIGHT KIDNEY:\n${kidneyNormal}\n\nLEFT KIDNEY:\n${lk_size}.\nNormal in size, shape and texture.\nNormal Cortical thickness and corticomedullary distinction is intact.\nNo evidence of calculus, cyst or mass seen.\n\nURINARY BLADDER:\n${bladder}\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
  }
  return `ULTRASOUND ${n.split(' - ')[0]}:\n\nLIVER:\n${liver}.\n\nGALL BLADDER:\n${gb}.\n\nPANCREAS:\nNormal in size and texture, No duct dilatation.\n\nSPLEEN:\n${spleen}.\n\nRIGHT KIDNEY:\n${kidneyNormal}\n\nLEFT KIDNEY:\n${lk_size}.\nNormal in size, shape and texture.\nNormal Cortical thickness and corticomedullary distinction is intact.\nNo evidence of calculus, cyst or mass seen.\n\nURINARY BLADDER:\n${bladder}\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
}
let T={}; allNames.forEach(k=>{T[k]=gen(k);});
let allTemplates=Object.keys(T);
function filterTemplates(){let q=(document.getElementById('tSearch')?.value||'').toLowerCase();let filtered=allTemplates.filter(k=>k.toLowerCase().includes(q));let s=document.getElementById('uType');let cur=s.value;s.innerHTML='';filtered.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});if(filtered.includes(cur))s.value=cur;}
function useSelectedTemplate(){let v=document.getElementById('uType')?.value;if(!v){alert('Select template');return;}document.getElementById('rText').value=T[v]||'';}
function formatReportToHTML(text){
  let lines=text.split('\n'); let html='';
  lines.forEach(line=>{
    let l=line.trim(); if(!l){html+='<div style="height:5px"></div>';return;}
    let clean=l.replace(/\[Normal:[^\]]*\]/gi,'').trim(); if(!clean)return;
    if(clean.toUpperCase().startsWith('ULTRASOUND')){html+=`<div style="text-align:center;margin:12px 0;font-weight:900;text-decoration:underline;font-size:14pt">${clean}</div>`;return;}
    if(clean.toUpperCase().startsWith('CONCLUSION:')){html+=`<div style="margin-top:14px"><b style="text-decoration:underline; font-size:13pt">CONCLUSION:</b> <b>${clean.replace(/CONCLUSION:/i,'').trim()}</b></div>`;return;}
    if(clean.toUpperCase().startsWith('ADVICE:')){html+=`<div style="margin-top:10px"><b style="text-decoration:underline">ADVICE:</b> ${clean.replace(/ADVICE:/i,'').trim()}</div>`;return;}
    if(clean.endsWith(':')){html+=`<div style="margin:8px 0 2px 0;font-weight:800;font-size:13pt;text-decoration:underline">► ${clean}</div>`;}else{html+=`<div style="margin:1px 0 1px 18px;font-size:13pt">• ${clean.replace(/^[-•►]\s*/,'').trim()}</div>`;}
  }); return html;
}
function make(){
  let pn=document.getElementById('pName'); if(!pn?.value){alert('Enter Patient Name');return;}
  let pid=document.getElementById('pIDMobile')?.value||'__';
  let complaintText=(document.getElementById('pComplaint')?.value||'').trim();
  let templateName=document.getElementById('uType').value||'';
  // Patient detail with proper spaces
  let patientBorder=`<div style="border:1.6px solid #000;padding:7px 10px;margin-bottom:8px;font-size:11.5pt;line-height:1.6"><div><b>Name:</b> ${document.getElementById('pName').value} <span style="margin:0 10px">|</span> <b>Age:</b> ${document.getElementById('pAge').value} <span style="margin:0 10px">|</span> <b>Sex:</b> ${document.getElementById('pGen').value} <span style="margin:0 10px">|</span> <b>Date:</b> ${document.getElementById('pDate').value} <span style="margin:0 10px">|</span> <b>ID/Mobile:</b> ${pid}</div><div><b>Ref By:</b> ${document.getElementById('ref').value} <span style="margin:0 10px">|</span> <b>Sonologist:</b> ${document.getElementById('sono').value}</div></div>`;
  let bodyHTML=formatReportToHTML(document.getElementById('rText').value);
  let diagramHTML=getDiagram(templateName);
  if(complaintText){bodyHTML=`<div style="margin-bottom:6px;font-size:12pt"><b><i>C/O: ${complaintText}</i></b></div>`+bodyHTML;}
  bodyHTML+=diagramHTML+`<div style="clear:both"></div>`;
  let footer=`<div style="margin-top:20px;text-align:center;clear:both"><div style="font-size:9pt"><i>This is computer generated report no signature required.</i></div><div style="font-size:11pt;margin-top:5px;font-weight:700">Thanks for availing our services</div></div>`;
  document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;
  document.getElementById('outCard').style.display='block';
}
function saveR(){
  let content=document.getElementById('reportContent').innerHTML; if(!content){alert('Pehle Generate karen');return;}
  let name=document.getElementById('pName').value||'Report';
  let rec={id: editingId || Date.now(),name:name,age:document.getElementById('pAge')?.value||'',gen:document.getElementById('pGen')?.value||'',mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'Normal',date:document.getElementById('pDate')?.value||new Date().toISOString().slice(0,10),ref:document.getElementById('ref')?.value||'',sono:document.getElementById('sono')?.value||'',text:document.getElementById('rText')?.value||'',complaint:document.getElementById('pComplaint')?.value||'',html:content};
  let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}
  if(editingId){let idx=all.findIndex(x=>x.id===editingId); if(idx>=0){all[idx]=rec;} else{all.unshift(rec);}}
  else{all.unshift(rec);}
  localStorage.setItem('azam_reports',JSON.stringify(all));
  render();
  uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));
  alert('✅ Saved + Uploading to Drive');
}
function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:20px">No reports</p>';return;}listEl.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:8px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('reportContent').innerHTML=r.html;document.getElementById('outCard').style.display='block';}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:document.getElementById('rText').value;doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allTemplates.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();let tc=document.getElementById('templateCount');if(tc)tc.innerText=allTemplates.length+' Templates';render();}
init();
</script></body></html>
