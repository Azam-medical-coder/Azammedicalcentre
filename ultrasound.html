function formatReportToHTML(text){
  let lines=text.split('\n');
  let html='';
  lines.forEach(line=>{
    let l=line.trim();
    if(!l){html+='<div style="height:4px"></div>';return;}
    let clean=l.replace(/\[Normal:[^\]]*\]/gi,'').trim();
    if(!clean)return;
    if(clean.toUpperCase().startsWith('ULTRASOUND')){
      html+=`<div style="text-align:center;margin:12px 0;font-weight:900;text-decoration:underline;font-size:14px">${clean}</div>`;
      return;
    }
    if(clean.toUpperCase().startsWith('CONCLUSION:')){
      html+=`<div style="margin-top:18px"><b><u>CONCLUSION:</u></b> <b>${clean.replace(/CONCLUSION:/i,'').trim()}</b></div>`;
      return;
    }
    // Headings end with colon -> aero, details -> dot
    if(clean.endsWith(':')){
      html+=`<div style="margin:8px 0 2px 0;font-weight:800"><i>➢ ${clean}</i></div>`;
    }else{
      html+=`<div style="margin:2px 0 2px 28px"><i>• ${clean.replace(/^[-•➢]\s*/,'').trim()}</i></div>`;
    }
  });
  return html;
}
function make(){let pn=document.getElementById('pName');if(!pn?.value){alert('Enter Patient Name');return;}let pid=document.getElementById('pIDMobile')?.value||'__';let complaintText=(document.getElementById('pComplaint')?.value||'').trim();let patientBorder=`<div style="border:1.5px solid #000;padding:8px 10px;margin-bottom:12px"><div><b>Name:</b> ${document.getElementById('pName').value} | <b>Age:</b> ${document.getElementById('pAge').value} | <b>Sex:</b> ${document.getElementById('pGen').value} | <b>Date:</b> ${document.getElementById('pDate').value} | <b>ID/Mobile:</b> ${pid}</div><div><b>Ref By:</b> ${document.getElementById('ref').value} | <b>Sonologist:</b> ${document.getElementById('sono').value}</div></div>`;let bodyHTML=formatReportToHTML(document.getElementById('rText').value);if(complaintText){bodyHTML=`<div style="margin-bottom:10px"><b><i>C/O: ${complaintText}</i></b></div>`+bodyHTML;}let footer=`<div style="margin-top:28px;text-align:center"><div style="font-size:11px"><i>This is computer generated report no signature required.</i></div><div style="font-size:12px;margin-top:8px;font-weight:700">Thanks for availing our services</div></div>`;document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;document.getElementById('outCard').style.display='block';}
function saveR(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let rec={id:Date.now(),name:document.getElementById('pName')?.value||'',age:document.getElementById('pAge')?.value||'',gen:document.getElementById('pGen')?.value||'',mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'',date:document.getElementById('pDate')?.value||'',ref:document.getElementById('ref')?.value||'',sono:document.getElementById('sono')?.value||'',text:document.getElementById('rText')?.value||'',complaint:document.getElementById('pComplaint')?.value||'',html:document.getElementById('reportContent')?.innerHTML||''};all.unshift(rec);localStorage.setItem('azam_reports',JSON.stringify(all));render();alert('Saved locally');}
function saveToDrive(){let content=document.getElementById('reportContent').innerHTML;let name=document.getElementById('pName').value||'Report';let blob=new Blob([content],{type:'text/html'});let url=URL.createObjectURL(blob);let a=document.createElement('a'); a.href=url; a.download=name+'.html'; a.click();try{let driveData=JSON.parse(localStorage.getItem('azam_drive_backup')||'[]');driveData.unshift({id:Date.now(),name:name,date:new Date().toISOString(),html:content});localStorage.setItem('azam_drive_backup',JSON.stringify(driveData));document.getElementById('driveStatus').innerText='● Saved to Drive - '+name+' | '+new Date().toLocaleString();document.getElementById('driveStatus').style.color='#10b981';alert('☁️ Report Google Drive backup me save ho gayi!');window.open('https://drive.google.com/drive/','_blank');}catch(e){alert('Drive save error - local download ho gayi');}}
function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');if(!listEl)return;let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:20px">No reports</p>';return;}listEl.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#10b981" onclick="saveToDrive()">Drive</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('pName').value=r.name;document.getElementById('pAge').value=r.age;document.getElementById('pGen').value=r.gen;document.getElementById('pIDMobile').value=r.mobile;document.getElementById('uType').value=r.type;document.getElementById('pDate').value=r.date;document.getElementById('ref').value=r.ref;document.getElementById('sono').value=r.sono;document.getElementById('rText').value=r.text;document.getElementById('pComplaint').value=r.complaint;make();}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[190,280]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:document.getElementById('rText').value;doc.text(doc.splitTextToSize(txt,165),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allTemplates.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();let tc=document.getElementById('templateCount');if(tc)tc.innerText=allTemplates.length+' Templates';render();}
init();
</script></body></html>
