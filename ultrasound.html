<script>
const CLIENT_ID='153046624604-p07rnrrj0kdhi23n8384kbd47i2rtace.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
let tokenClient,driveFolderId=null;
function updateDriveStatus(m,c){let e=document.getElementById('driveStatus');if(e){e.innerText='● '+m; e.style.color=c||'#10b981';}}
function gapiLoaded(){gapi.load('client', async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});updateDriveStatus('Drive Ready',' #0a4eb5');}catch(e){}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:''});}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken())); res(r);}};tokenClient.requestAccessToken({prompt:'consent'});});}
function connectDrive(){ensureDriveAuth().then(()=>{updateDriveStatus('Drive Connected',' #10b981'); loadFromDrive();}).catch(e=>{alert('Drive error');});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports', mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}
async function findFileInFolder(folderId,fileName){try{let q=`'${folderId}' in parents and name='${fileName}' and trashed=false`;let res=await gapi.client.drive.files.list({q:q,fields:"files(id,name)"});if(res.result.files&&res.result.files.length>0) return res.result.files[0]; return null;}catch(e){return null;}}
async function uploadToDriveFile(name,content){ try{ let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); if(!folderId) return; let token=gapi.client.getToken(); if(!token||!token.access_token) return; let existing=await findFileInFolder(folderId,name); if(existing){ await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:content}); return; } const file=new Blob([content],{type:'application/json'});const meta={name:name,mimeType:'application/json',parents:[folderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',file); await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:new Headers({'Authorization':'Bearer '+token.access_token}),body:form}); }catch(e){} }
async function loadFromDrive(){ try{ let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); let listResp=await gapi.client.drive.files.list({q:`'${folderId}' in parents and trashed=false`,fields:"files(id,name)",pageSize:100}); let files=listResp.result.files||[]; let mainFile=files.find(f=>f.name==='Azam_Medical_Backup_ALL.json'); if(mainFile){ let token=gapi.client.getToken(); let resp=await fetch(`https://www.googleapis.com/drive/v3/files/${mainFile.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}}); if(resp.ok){ let text=await resp.text(); let allData=JSON.parse(text); if(Array.isArray(allData)){ localStorage.setItem('azam_reports',JSON.stringify(allData)); render(); alert(`✅ ${allData.length} reports loaded`); } } } }catch(e){} }
window.addEventListener('load',()=>{setTimeout(()=>{try{gapiLoaded();gisLoaded();}catch(e){}},1500);});

function checkCalculator(){ let v=document.getElementById('uType').value||''; document.getElementById('obsCalc').style.display = (v.includes('FWB'))? 'block' : 'none'; document.getElementById('prosCalc').style.display = (v.includes('PROSTATE'))? 'block' : 'none'; }
function calcOBS(){ let bpd=parseFloat(document.getElementById('bpd').value)||0; let hc=parseFloat(document.getElementById('hc').value)||0; let ac=parseFloat(document.getElementById('ac').value)||0; let fl=parseFloat(document.getElementById('fl').value)||0; if(fl>0){ let fl_cm = fl/10; let ga_fl = 10.1 + (fl_cm * 2.4); let avgGA = ga_fl; if(bpd>0) avgGA=(ga_fl + (bpd*0.4+4))/2; document.getElementById('gaResult').value = avgGA.toFixed(1)+' wks'; if(ac>0 && hc>0){ let AC = ac/10, FL = fl/10, BPD = bpd>0?bpd/10:5; let logEFW = 1.335 - (0.0034*AC*FL) + (0.0316*BPD) + (0.0457*AC) + (0.1623*FL); let w = Math.pow(10, logEFW)*100; document.getElementById('efwResult').value = Math.round(w)+' gms'; } } }
function calcEDD(){ let lmp=document.getElementById('lmp').value; if(!lmp)return; let d=new Date(lmp); d.setDate(d.getDate()+280); document.getElementById('gaResult').value='EDD: '+d.toISOString().slice(0,10); }
function insertOBS(){ let bpd=document.getElementById('bpd').value||'__', hc=document.getElementById('hc').value||'__', ac=document.getElementById('ac').value||'__', fl=document.getElementById('fl').value||'__', ga=document.getElementById('gaResult').value||'', efw=document.getElementById('efwResult').value||''; let txt=`\nBPD: ${bpd} mm, HC: ${hc} mm, AC: ${ac} mm, FL: ${fl} mm\nGA: ${ga}, EFW: ${efw}\n`; document.getElementById('rText').value += txt; }
function calcProstate(){ let l=parseFloat(document.getElementById('prosL').value)||0; let w=parseFloat(document.getElementById('prosW').value)||0; let h=parseFloat(document.getElementById('prosH').value)||0; if(l&&w&&h){ let vol = l*w*h*0.52; document.getElementById('prosVol').value = vol.toFixed(1)+' gm'; } }
function insertProstate(){ let l=document.getElementById('prosL').value||'__', w=document.getElementById('prosW').value||'__', h=document.getElementById('prosH').value||'__', vol=document.getElementById('prosVol').value||''; let txt=`\nProstate: ${l} x ${w} x ${h} cm, Vol: ${vol}\n`; document.getElementById('rText').value += txt; }

const refDoctors=["Ref By - Select","Dr. Shahzad Azam","Dr. M. Azam Arain","Dr. Nazia wagan","Dr. Syed Kashan","Dr. Ali mangrio","Dr. M. Zeeshan","Self","Other"];
const sonoDoctors=["Sonologist - Select","DR. M. ZEESHAN","DR. NAZIA WAGAN","DR. SAMAN AZAM","Other"];
function fillSelect(id,list){let s=document.getElementById(id);s.innerHTML='';list.forEach(v=>{let o=document.createElement('option');o.value=v.includes('Select')?'':v;o.textContent=v;s.appendChild(o);});}
fillSelect('ref',refDoctors);fillSelect('sono',sonoDoctors);
function checkPass(){let p=document.getElementById('passInput').value.trim();if(p==='Pakistan@777' || p==='Zee'){sessionStorage.setItem('azam_login','ok');document.getElementById('loginOverlay').style.display='none';}else{document.getElementById('passErr').style.display='block';}}
if(sessionStorage.getItem('azam_login')==='ok'){document.getElementById('loginOverlay').style.display='none';}

const allNames=["WHOLE ABDOMEN - Normal","WHOLE ABDOMEN - Fatty Liver Grade 1","WHOLE ABDOMEN - Fatty Liver Grade 2","WHOLE ABDOMEN - Fatty Liver Grade 3","WHOLE ABDOMEN - Hepatomegaly","WHOLE ABDOMEN - Splenomegaly","WHOLE ABDOMEN - Hepatosplenomegaly","WHOLE ABDOMEN - Cholelithiasis Single","WHOLE ABDOMEN - Cholelithiasis Multiple","WHOLE ABDOMEN - Gall Bladder Sludge","WHOLE ABDOMEN - Cholecystitis Acute","WHOLE ABDOMEN - CBD Dilated","WHOLE ABDOMEN - Appendicitis","WHOLE ABDOMEN - Umbilical Hernia","WHOLE ABDOMEN - Inguinal Hernia Right","WHOLE ABDOMEN - Inguinal Hernia Left","WHOLE ABDOMEN - Liver Cyst","WHOLE ABDOMEN - Liver Hemangioma","WHOLE ABDOMEN - Ascites Mild","WHOLE ABDOMEN - Ascites Moderate to Gross","WHOLE ABDOMEN - Liver Abscess","WHOLE ABDOMEN - Renal Cyst","WHOLE ABDOMEN - Gall Bladder Polyp","WHOLE ABDOMEN - Pancreatitis Acute","WHOLE ABDOMEN - Paraumbilical Hernia","WHOLE ABDOMEN - Ventral Hernia","WHOLE ABDOMEN - Incisional Hernia","WHOLE ABDOMEN - Lymphadenopathy","KUB - Normal","KUB - Renal Calculus Right","KUB - Renal Calculus Left","KUB - Renal Calculus Bilateral","KUB - Staghorn Calculus","KUB - Microliths Bilateral","KUB - Hydronephrosis Mild Right","KUB - Hydronephrosis Moderate Right","KUB - Hydronephrosis Severe Right","KUB - Hydronephrosis Mild Left","KUB - Hydronephrosis Moderate Left","KUB - Hydronephrosis Severe Left","KUB - Hydronephrosis Bilateral Mild","KUB - Hydronephrosis Bilateral Moderate","KUB - Hydroureteronephrosis Right","KUB - Hydroureteronephrosis Left","KUB - Hydroureteronephrosis Bilateral","KUB - Ureteric Calculus with Hydronephrosis","KUB - PUJ Obstruction Right","KUB - PUJ Obstruction Left","KUB - Parenchymal Changes Grade 1","KUB - Parenchymal Changes Grade 2","KUB - Parenchymal Changes Grade 3","KUB - Simple Cortical Cyst Right","KUB - Simple Cortical Cyst Left","KUB - Bilateral Cortical Cysts","KUB - Complex Cyst Right","KUB - Complex Cyst Left","KUB - Polycystic Kidneys","KUB - Bladder Stone Single","KUB - Bladder Stones Multiple","KUB - Cystitis Thickened Wall","KUB - Bladder Diverticulum","KUB - Bladder Mass","KUB - Ectopic Kidney Right","KUB - Bladder Trabeculation","KUB - High Post Void Residual","KUB + PROSTATE - Normal","KUB + PROSTATE - BPH","KUB + PROSTATE - BPH with Cystitis","KUB + PROSTATE - Prostatitis","KUB + PROSTATE - Prostate Calcification","PELVIS - Normal","PELVIS - PCOS","PELVIS - Fibroid Intramural","PELVIS - Fibroid Subserosal","PELVIS - Fibroid Submucosal","PELVIS - Multiple Fibroids","PELVIS - Ovarian Cyst Simple Right","PELVIS - Ovarian Cyst Simple Left","PELVIS - Ovarian Cyst Bilateral","PELVIS - Endometrioma","PELVIS - Dermoid Cyst","PELVIS - PID","PELVIS - Free Fluid POD","PELVIS - Early Pregnancy","PELVIS - Bulky Uterus","PELVIS - Endometrial Hyperplasia","PELVIS - Endometrial Polyp","FWB - Normal Single Pregnancy","FWB - Breech Presentation","FWB - IUGR","FWB - Twins Normal","FWB - Oligohydramnios","FWB - Polyhydramnios","FWB - Early Pregnancy 6-8 Weeks","FWB - Anomaly Scan Normal","FWB - Placenta Previa","FWB - Placental Abruption","FWB - Growth Scan Normal","FWB - IUD / Demise","BREAST - Normal","BREAST - Fibroadenoma Right","BREAST - Fibroadenoma Left","BREAST - Fibroadenoma Bilateral","BREAST - Breast Cyst Right","BREAST - Breast Cyst Left","BREAST - Breast Cysts Multiple","BREAST - Fibrocystic Disease","BREAST - Mastitis","BREAST - Breast Abscess","BREAST - Gynecomastia","BREAST - Suspicious Mass","THYROID - Normal","THYROID - Multinodular Goiter","THYROID - Solitary Nodule Right","THYROID - Solitary Nodule Left","THYROID - Thyroid Cyst Right","THYROID - Thyroid Cyst Left","THYROID - Thyroiditis","THYROID - Hyperthyroid Goiter","SCROTUM - Normal","SCROTUM - Hydrocele Right","SCROTUM - Hydrocele Left","SCROTUM - Hydrocele Bilateral","SCROTUM - Varicocele Left","SCROTUM - Varicocele Right","SCROTUM - Varicocele Bilateral","SCROTUM - Epididymitis Right","SCROTUM - Epididymitis Left","SCROTUM - Epididymo-orchitis Right","SCROTUM - Epididymo-orchitis Left","SCROTUM - Orchitis","SCROTUM - Testicular Torsion","TESTIS - Microlithiasis","TESTIS - Testicular Cyst","AXILLA - Normal","AXILLA - Lymphadenopathy Left","NECK - Normal","NECK - Cervical Lymphadenopathy","ABDOMEN + PELVIS - Normal Male","ABDOMEN + PELVIS - Normal Female"];

function liverShort(type){
  if(type.includes("Fatty Liver Grade 1")) return `LIVER: Size 15.2 cm, Mildly enlarged, Mildly increased echogenicity - Grade I fatty liver, No focal lesion. Portal vein normal, No IHBR dilatation.`;
  if(type.includes("Fatty Liver Grade 2")) return `LIVER: Size 16.0 cm, Enlarged, Moderately increased echogenicity - Grade II fatty liver, No focal lesion. Portal vein normal.`;
  if(type.includes("Fatty Liver Grade 3")) return `LIVER: Size 17.1 cm, Markedly enlarged, Markedly increased echogenicity - Grade III fatty liver, Poor visualization of diaphragm.`;
  if(type.includes("Liver Cyst")) return `LIVER: Size 14.5 cm, Normal, A well defined anechoic cyst size __ x __ cm seen in __ lobe, No internal echoes or septations, Posterior enhancement present. Remaining liver normal.`;
  if(type.includes("Hemangioma")) return `LIVER: Size 14.8 cm, Normal, A well defined hyperechoic lesion size __ x __ cm seen in __ lobe - likely hemangioma. No halo, No vascularity.`;
  if(type.includes("Hepatomegaly") || type.includes("Hepatosplenomegaly")) return `LIVER: Size 16.5 cm, Enlarged (Hepatomegaly), Homogenous echotexture, No focal lesion, No IHBR dilatation, Portal vein normal.`;
  return `LIVER: Size 14.5 cm, Normal in size and echotexture, No focal solid or cystic lesion seen, No IHBR dilatation, Portal vein normal.`;
}

function complexShort(side){
  return `COMPLEX CYST - ${side} Kidney: A complex cyst size __ x __ cm seen in __ pole of ${side} kidney, Thick wall with internal echoes and septations, No significant vascularity, Bosniak IIF/III - Adv CECT.`;
}

function getAdvice(n){ if(n.includes("Normal")) return "No active pathology noted."; if(n.includes("Fatty")) return "Adv: LFTs, Lipid Profile, Avoid fatty foods, Exercise."; if(n.includes("Complex Cyst")) return "Adv: CECT Abdomen, RFTs, Urologist opinion."; return "Adv: Relevant labs and specialist consultation."; }

function gen(n){
  let rk=`RIGHT KIDNEY: 11.5 x 4.5 cm, Normal size and texture, No calculus or hydronephrosis.`;
  let lk=`LEFT KIDNEY: 11.0 x 4.5 cm, Normal size and texture, No calculus or hydronephrosis.`;
  let blad=`URINARY BLADDER: Normal capacity, Wall normal, No calculus or mass.`;
  let gb=`GALL BLADDER: Well distended, Wall normal (2-3 mm), No calculus or sludge. CBD normal.`;
  let spleen=`SPLEEN: 10.0 cm, Normal size and texture, No focal lesion.`;
  let panc=`PANCREAS: Normal size and texture, No focal lesion, No collection.`;

  if(n.includes("Complex Cyst")){
    let side = n.includes("Left")? "Left":"Right";
    let other = side=="Right"? lk : rk;
    return `ULTRASOUND KUB:\n\n${complexShort(side)}\n\n${other}\n\n${blad}\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
  }
  if(n.startsWith("WHOLE ABDOMEN")){
    return `ULTRASOUND WHOLE ABDOMEN:\n\n${liverShort(n)}\n\n${gb}\n\n${spleen}\n\n${panc}\n\n${rk}\n\n${lk}\n\n${blad}\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
  }
  if(n.startsWith("KUB + PROSTATE")) return `ULTRASOUND KUB + PROSTATE:\n\n${rk}\n\n${lk}\n\n${blad}\n\nPROSTATE: Size __ x __ x __ cm, Vol __ gm, Normal texture.\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
  if(n.startsWith("KUB")) return `ULTRASOUND KUB:\n\n${rk}\n\n${lk}\n\n${blad}\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
  if(n.startsWith("FWB")) return `ULTRASOUND FWB:\n\nSingle live fetus, Cephalic, Cardiac activity present.\nBPD: __ mm, HC: __ mm, AC: __ mm, FL: __ mm\nGA: __, EFW: __\nAF adequate, Placenta anterior upper.\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
  return `ULTRASOUND ${n.split(' - ')[0]}:\n\n${liverShort("Normal")}\n\n${gb}\n\n${rk}\n\n${lk}\n\n${blad}\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;
}

let T={}; allNames.forEach(k=>{T[k]=gen(k);});
let allTemplates=Object.keys(T);
function filterTemplates(){let q=(document.getElementById('tSearch')?.value||'').toLowerCase();let filtered=allTemplates.filter(k=>k.toLowerCase().includes(q));let s=document.getElementById('uType');let cur=s.value;s.innerHTML='';filtered.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});if(filtered.includes(cur))s.value=cur; checkCalculator();}
function useSelectedTemplate(){let v=document.getElementById('uType')?.value;if(!v){alert('Select');return;}document.getElementById('rText').value=T[v]||''; checkCalculator();}
function formatReportToHTML(text){
  let lines=text.split('\n'); let html='';
  lines.forEach(line=>{
    let l=line.trim(); if(!l){html+='<div style="height:4px"></div>';return;}
    if(l.toUpperCase().startsWith('ULTRASOUND')){html+=`<div style="text-align:center;margin:10px 0;font-weight:900;text-decoration:underline;font-size:12pt!important">`+l+`</div>`;return;}
    if(l.toUpperCase().startsWith('CONCLUSION:')){html+=`<div style="margin-top:10px"><b style="text-decoration:underline">CONCLUSION:</b> <b>`+l.replace(/CONCLUSION:/i,'').trim()+`</b></div>`;return;}
    if(l.toUpperCase().startsWith('ADVICE:')){html+=`<div style="margin-top:8px"><b style="text-decoration:underline">ADVICE:</b> `+l.replace(/ADVICE:/i,'').trim()+`</div>`;return;}
    html+=`<div style="margin:2px 0 2px 10px;font-size:12pt!important">• `+l+`</div>`;
  }); return html;
}
function make(){
  let pn=document.getElementById('pName'); if(!pn?.value){alert('Enter Name');return;}
  let pid=document.getElementById('pIDMobile')?.value||'__';
  let complaintText=(document.getElementById('pComplaint')?.value||'').trim();
  let patientBorder=`<div style="border:1.2px solid #000;padding:6px 8px;margin-bottom:6px;font-size:10pt!important;line-height:1.5"><div><b>Name:</b> ${document.getElementById('pName').value} | <b>Age:</b> ${document.getElementById('pAge').value} | <b>Sex:</b> ${document.getElementById('pGen').value} | <b>Date:</b> ${document.getElementById('pDate').value} | <b>ID:</b> ${pid}</div><div><b>Ref By:</b> ${document.getElementById('ref').value} | <b>Sonologist:</b> ${document.getElementById('sono').value}</div></div>`;
  let bodyHTML=formatReportToHTML(document.getElementById('rText').value);
  if(complaintText){bodyHTML=`<div style="margin-bottom:4px;font-size:10pt!important"><b><i>C/O: ${complaintText}</i></b></div>`+bodyHTML;}
  let footer=`<div style="margin-top:12px;text-align:center"><div style="font-size:8pt!important"><i>This is computer generated report no signature required.</i></div><div style="font-size:9pt!important;margin-top:4px;font-weight:700">Thanks for availing our services</div></div>`;
  document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;
  document.getElementById('outCard').style.display='block';
}
function saveR(){ let content=document.getElementById('reportContent').innerHTML; if(!content){alert('Generate karen');return;} let name=document.getElementById('pName').value||'Report'; let rec={id: Date.now(),name:name,mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'',date:document.getElementById('pDate')?.value||'',html:content,text:document.getElementById('rText')?.value||''}; let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];} all.unshift(rec); localStorage.setItem('azam_reports',JSON.stringify(all)); render(); uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all)); alert('✅ Saved'); }
function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:15px;font-size:10pt">No reports</p>';return;}listEl.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:6px;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;font-size:10pt"><div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('reportContent').innerHTML=r.html;document.getElementById('outCard').style.display='block';}
function delR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:document.getElementById('rText').value;doc.setFontSize(10);doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allNames.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();document.getElementById('templateCount').innerText=allTemplates.length+' Templates';render();}
init();
</script></body></html>
