<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Azam Medical Centre - Ultrasound Reporting</title>
<style>
body{font-family:Arial;background:#eef2ff;margin:0;padding:20px}
.container{max-width:900px;margin:auto;background:#fff;border:2px solid #a78bfa;border-radius:15px;padding:20px}
select{width:100%;padding:10px;border:1px solid #a78bfa;border-radius:8px;font-size:14px;height:200px}
button{background:#8b5cf6;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;cursor:pointer;font-weight:bold;margin-top:10px}
.preview{border:1px solid #ddd;padding:20px;border-radius:10px;background:#fff;margin-top:15px;white-space:pre-line;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="container">
<h2 style="text-align:center;color:#4c1d95">Azam Medical Centre - Ultrasound Reporting</h2>
<select id="templateSelect" size="12">
<option>SCROTUM - Normal</option>
<option>SCROTUM - Hydrocele Right</option>
<option>SCROTUM - Hydrocele Left</option>
<option>SCROTUM - Hydrocele Bilateral</option>
<option>SCROTUM - Varicocele Left</option>
<option>SCROTUM - Varicocele Right</option>
<option>SCROTUM - Varicocele Bilateral</option>
<option>SCROTUM - Epididymitis Right</option>
<option>SCROTUM - Epididymitis Left</option>
<option>SCROTUM - Epididymo-orchitis Right</option>
<option>SCROTUM - Epididymo-orchitis Left</option>
<option>SCROTUM - Orchitis</option>
<option>SCROTUM - Inguinal Hernia Right</option>
<option>SCROTUM - Testicular Torsion</option>
</select>
<button onclick="loadTemplate()">Load Template</button>
<div class="preview" id="preview">Select Template and Press Load Template</div>
</div>
<script>
const templates = {
"SCROTUM - Normal": `ULTRASOUND SCROTUM:

Technique: High frequency linear probe. Grey scale and Colour Doppler evaluation done.

Right Testis: Measures 4.2 x 2.5 x 2.8 cm, volume ~15 ml. Normal size, shape and echotexture. No focal lesion.
Left Testis: Measures 4.1 x 2.4 x 2.7 cm, volume ~14 ml. Normal size, shape and echotexture. No focal lesion.
Epididymis: Both epididymis normal in size and echotexture. No cyst or mass.
Spermatic Cord: Normal. No varicocele seen on Valsalva.
Tunica Vaginalis: No hydrocele / pyocele seen.
Scrotal Wall: Normal thickness.
Colour Doppler: Normal vascularity in both testes. No torsion.

CONCLUSION:
Normal scrotal ultrasound.
Rest of study unremarkable unless mentioned.

ADVICE:
No active intervention required.`,

"SCROTUM - Hydrocele Right": `ULTRASOUND SCROTUM - Hydrocele Right:

Right Testis: Measures 4.0 x 2.4 x 2.6 cm. Normal echotexture. Displaced by anechoic fluid collection.
Right Tunica Vaginalis: Anechoic fluid collection measuring approx 6.5 x 4.2 cm, volume ~55 ml suggestive of hydrocele. No septations, no debris.
Left Testis: Measures 4.1 x 2.5 x 2.7 cm. Normal size and echotexture. No hydrocele.
Epididymis: Bilateral normal.
Spermatic Cord: Normal.
Colour Doppler: Normal vascularity. No varicocele.

CONCLUSION:
Hydrocele Right.
Rest of study unremarkable unless mentioned.

ADVICE:
KFT, Urine DR, Relevant labs and specialist consultation advised.`,

"SCROTUM - Hydrocele Left": `ULTRASOUND SCROTUM - Hydrocele Left:

Left Testis: Measures 3.9 x 2.3 x 2.6 cm. Normal echotexture.
Left Tunica Vaginalis: Anechoic fluid collection 5.8 x 3.9 cm, volume ~48 ml suggestive of hydrocele.
Right Testis: Measures 4.2 x 2.5 x 2.8 cm. Normal. No hydrocele.
Epididymis: Normal bilaterally.
Doppler: Normal flow.

CONCLUSION:
Hydrocele Left.
Rest of study unremarkable unless mentioned.

ADVICE:
KFT, Urine DR, Relevant labs and specialist consultation advised.`,

"SCROTUM - Hydrocele Bilateral": `ULTRASOUND SCROTUM - Hydrocele Bilateral:

Right Side: Anechoic fluid 5.5 x 3.8 cm, volume ~42 ml.
Left Side: Anechoic fluid 6.0 x 4.0 cm, volume ~50 ml.
Both Testes: Normal size and echotexture, compressed by fluid. No mass.
Epididymis: Normal. Doppler normal.

CONCLUSION:
Bilateral Hydrocele.
Rest of study unremarkable unless mentioned.

ADVICE:
KFT, Urine DR, Specialist consultation advised.`,

"SCROTUM - Varicocele Left": `ULTRASOUND SCROTUM - Varicocele Left:

Left Pampiniform Plexus: Multiple dilated tortuous veins, largest diameter 3.8 mm at rest, 4.5 mm on Valsalva with reversal of flow on Doppler - Grade III Varicocele.
Right Pampiniform Plexus: Normal, max 1.8 mm.
Both Testes: Left testis slightly smaller 3.8 x 2.2 x 2.4 cm. Right normal 4.2 cm. Echotexture normal.
No hydrocele.

CONCLUSION:
Left Varicocele - Grade III.
Rest of study unremarkable unless mentioned.

ADVICE:
Semen analysis, Urologist consultation advised.`,

"SCROTUM - Varicocele Right": `ULTRASOUND SCROTUM - Varicocele Right:

Right Pampiniform Plexus: Dilated veins 3.5 mm, 4.2 mm on Valsalva with reflux.
Left: Normal.
Both Testes: Normal size and echotexture.

CONCLUSION:
Right Varicocele.
Rest of study unremarkable unless mentioned.

ADVICE:
Semen analysis, Urologist consultation advised.`,

"SCROTUM - Varicocele Bilateral": `ULTRASOUND SCROTUM - Varicocele Bilateral:

Right: 3.2 mm, 4.0 mm on Valsalva with reflux.
Left: 3.9 mm, 4.8 mm on Valsalva with reflux.
Both Testes: Normal echotexture, left slightly smaller.

CONCLUSION:
Bilateral Varicocele.
Rest of study unremarkable unless mentioned.

ADVICE:
Semen analysis, Urologist consultation advised.`,

"SCROTUM - Epididymitis Right": `ULTRASOUND SCROTUM - Epididymitis Right:

Right Epididymis: Enlarged, head 12 mm, body 9 mm. Hypoechoic and heterogeneous. Increased vascularity on Doppler.
Right Testis: Normal size 4.1 cm, normal echotexture, no abscess.
Left: Normal.
No hydrocele. Mild scrotal wall thickening on right.

CONCLUSION:
Right Epididymitis.
Rest of study unremarkable unless mentioned.

ADVICE:
CBC, Urine DR/C/S, Antibiotic as per physician.`,"SCROTUM - Epididymitis Left": `ULTRASOUND SCROTUM - Epididymitis Left:

Left Epididymis: Enlarged 11 mm head, hypoechoic, hypervascular on Doppler.
Left Testis: Normal size, normal texture.
Right: Normal. No hydrocele.

CONCLUSION:
Left Epididymitis.
Rest of study unremarkable unless mentioned.

ADVICE:
CBC, Urine DR/C/S, Physician consultation.`,

"SCROTUM - Epididymo-orchitis Right": `ULTRASOUND SCROTUM - Epididymo-orchitis Right:

Right Epididymis + Testis: Both enlarged. Testis 4.8 x 3.0 cm, heterogeneous echotexture, markedly increased vascularity on Doppler. Epididymis head 14 mm.
Left: Normal.
Small reactive hydrocele on right. Scrotal wall thickened.

CONCLUSION:
Right Epididymo-orchitis.
Rest of study unremarkable unless mentioned.

ADVICE:
Urgent CBC, Urine DR/C/S, Urologist consultation.`,

"SCROTUM - Epididymo-orchitis Left": `ULTRASOUND SCROTUM - Epididymo-orchitis Left:

Left Epididymis + Testis: Enlarged, testis 4.7 x 2.9 cm, heterogeneous, hypervascular.
Right: Normal.
Small reactive hydrocele left.

CONCLUSION:
Left Epididymo-orchitis.
Rest of study unremarkable unless mentioned.

ADVICE:
Urgent CBC, Urine DR/C/S, Urologist consultation.`,

"SCROTUM - Orchitis": `ULTRASOUND SCROTUM - Orchitis:

Right Testis: Enlarged 4.6 cm, hypoechoic, hypervascular.
Left Testis: Normal.
Epididymis: Mildly bulky bilaterally.

CONCLUSION:
Orchitis - Right side predominant.
Rest of study unremarkable unless mentioned.

ADVICE:
CBC, Urine DR, Physician consultation.`,

"SCROTUM - Inguinal Hernia Right": `ULTRASOUND SCROTUM - Inguinal Hernia Right:

Right Inguinal Canal: Herniated bowel loops extending into scrotum, peristalsis present, reducible on pressure.
Right Testis: Normal, displaced.
Left: Normal.

CONCLUSION:
Right Inguinoscrotal Hernia.
Rest of study unremarkable unless mentioned.

ADVICE:
Surgical consultation advised.`,

"SCROTUM - Testicular Torsion": `ULTRASOUND SCROTUM - Testicular Torsion:

Right Testis: Enlarged, heterogeneous, NO vascularity on Colour Doppler. Spermatic cord twisted.
Left Testis: Normal vascularity.

CONCLUSION:
Right Testicular Torsion - Surgical Emergency.
Rest of study unremarkable unless mentioned.

ADVICE:
Immediate Urologist / Surgical consultation - URGENT.`
};
function loadTemplate(){
const v=document.getElementById('templateSelect').value;
document.getElementById('preview').innerText = templates[v] || 'Template not found';
}
</script>
</body>
</html>
