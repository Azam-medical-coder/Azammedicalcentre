function getAdvice(n){
  if(n.includes("Normal")) return "No active pathology noted. Routine follow-up as needed. Maintain healthy diet and hydration.";
  if(n.includes("Fatty Liver Grade 1")) return "Advice: LFTs, Lipid Profile, Fasting Blood Sugar, Avoid oily/fatty foods, Regular exercise 30min daily, Weight reduction, Repeat USG after 3 months. Physician consultation.";
  if(n.includes("Fatty Liver Grade 2")) return "Advice: LFTs, Lipid Profile, HbA1c, TFTs, Strict diet control, Avoid alcohol, Daily walk 45min, Weight loss, Gastroenterologist consultation, USG follow-up 2 months.";
  if(n.includes("Fatty Liver Grade 3")) return "Advice: LFTs, Lipid Profile, HbA1c, Viral markers HBsAg/HCV, FibroScan if available, Urgent Gastroenterologist consultation, Strict low fat diet, No alcohol, Regular follow-up.";
  if(n.includes("Cholelithiasis")) return "Advice: LFTs, CBC, Lipid Profile, Avoid fatty foods, Plenty of fluids, Surgical consultation for cholecystectomy if symptomatic, Follow-up USG.";
  if(n.includes("Sludge")) return "Advice: LFTs, Lipid Profile, Plenty of water 3-4L/day, Avoid fatty foods, Ursodeoxycholic acid as per physician, Repeat USG after 4 weeks.";
  if(n.includes("Cholecystitis")) return "Advice: CBC, CRP, LFTs, RFTs, NPO, IV antibiotics as per surgeon, Urgent Surgical consultation, Hospital admission may be required, USG follow-up.";
  if(n.includes("Appendicitis")) return "Advice: CBC, CRP, Urine R/E, Urgent Surgical consultation, NPO, X-ray abdomen if needed, Hospital admission advised.";
  if(n.includes("Hernia")) return "Advice: Avoid heavy weight lifting, Avoid chronic cough/constipation, Surgical consultation for hernioplasty, Follow-up.";
  if(n.includes("Ascites")) return "Advice: LFTs, RFTs, Serum Albumin, SAAG, Ascitic fluid D/R, CBC, PT/INR, Physician/Gastroenterologist urgent consultation, Low salt diet.";
  if(n.includes("Pancreatitis")) return "Advice: Serum Amylase, Lipase, LFTs, RFTs, CBC, CRP, Blood Sugar, Strict NPO, IV fluids, Urgent Surgical/Physician consultation, CT Abdomen if needed.";
  if(n.includes("Renal Calculus")||n.includes("Staghorn")||n.includes("Microliths")||n.includes("Bladder Stone")) return "Advice: RFTs, Urine R/E & C/S, Serum Calcium, Uric Acid, X-Ray KUB, CT KUB if needed, Increase water intake 3-4L/day, Avoid high oxalate foods, Urologist consultation.";
  if(n.includes("Hydronephrosis")||n.includes("Hydrouretero")||n.includes("PUJ Obstruction")||n.includes("Ureteric Calculus")) return "Advice: RFTs, Urine R/E & C/S, CT KUB / IVP, DTPA scan if PUJ obstruction, Plenty of fluids, Urgent Urologist consultation, Pain management.";
  if(n.includes("Parenchymal Changes")) return "Advice: RFTs, Urine R/E, 24hr Urine Protein, Blood Pressure monitoring, HbA1c, Avoid nephrotoxic drugs, Nephrologist consultation, Follow-up USG 3 months.";
  if(n.includes("Cortical Cyst")||n.includes("Polycystic")) return "Advice: RFTs, Urine R/E, Blood Pressure check, Urologist consultation, Follow-up USG after 6 months, No active intervention if simple cyst.";
  if(n.includes("Cystitis")||n.includes("Trabeculation")||n.includes("Diverticulum")) return "Advice: Urine R/E & Culture Sensitivity, CBC, RFTs, Plenty of fluids, Avoid holding urine, Urologist consultation, Antibiotics as per culture.";
  if(n.includes("BPH")||n.includes("PROSTATE")) return "Advice: PSA, Urine R/E, RFTs, Uroflowmetry, Residual urine assessment, Urologist consultation, Avoid cold exposure & constipation, Follow-up.";
  if(n.includes("PCOS")) return "Advice: LH, FSH, Prolactin, Testosterone, TSH, HbA1c, Lipid Profile, Weight reduction, Lifestyle modification, Exercise 45min daily, Gynae/Endocrine consultation.";
  if(n.includes("Fibroid")) return "Advice: CBC, CA-125, Pap Smear, Gynae consultation, Follow-up USG after 3 months, Iron rich diet if menorrhagia.";
  if(n.includes("Ovarian Cyst")||n.includes("Endometrioma")||n.includes("Dermoid")) return "Advice: CA-125, CA 19-9, LH, FSH, Gynae consultation, Follow-up USG after 2 months, Laparoscopy if needed.";
  if(n.includes("PID")||n.includes("Free Fluid")) return "Advice: CBC, CRP, Urine R/E & C/S, High Vaginal Swab C/S, Gynae consultation, Antibiotics as prescribed, Maintain hygiene, Avoid unhygienic conditions.";
  if(n.includes("FWB")||n.includes("Pregnancy")||n.includes("Anomaly")) return "Advice: CBC, Blood Group, GTT/OGTT, Urine R/E, Anomaly scan at 18-20 weeks, Doppler at 28-32 weeks, Regular antenatal check-up, Iron/Folic acid, Daily fetal movement count, Gynae consultation.";
  if(n.includes("Oligohydramnios")) return "Advice: Plenty of oral fluids 3-4L/day, Bed rest, Left lateral position, NST, Doppler S/D ratio, Daily fetal movement count, Urgent Gynae consultation, Consider hospitalization.";
  if(n.includes("Polyhydramnios")) return "Advice: GTT/OGTT, HbA1c, TORCH screen, Detailed anomaly scan, Fetal Echo if needed, Gynae consultation, Rest.";
  if(n.includes("Breech")||n.includes("Previa")||n.includes("Abruption")) return "Advice: High risk pregnancy, Strict bed rest, No travel, Hospital delivery planning, Gynae emergency consultation, Blood arrangement, Regular follow-up.";
  if(n.includes("IUGR")||n.includes("IUD")) return "Advice: Urgent Gynae referral, Doppler study, NST, Hospital admission, Steroids as per doctor if preterm, Daily fetal movement count.";
  if(n.includes("BREAST")) return "Advice: Mammography BI-RADS, FNAC/Trucut biopsy if needed, CA 15-3, Oncologist/Surgeon consultation, Self breast examination monthly, Follow-up.";
  if(n.includes("THYROID")) return "Advice: TFTs T3/T4/TSH, Anti-TPO, FNAC from nodule if >1cm, ENT/Endocrine consultation, Follow-up USG 6 months.";
  if(n.includes("SCROTUM")||n.includes("TESTIS")||n.includes("Varicocele")||n.includes("Hydrocele")) return "Advice: CBC, Urine R/E, Scrotal Doppler, Semen analysis if varicocele, Urologist consultation, Scrotal support, Avoid tight clothing.";
  if(n.includes("NECK")||n.includes("AXILLA")||n.includes("Lymphadenopathy")) return "Advice: CBC, ESR, CRP, FNAC from node, Chest X-Ray, Physician/ENT consultation, Follow-up.";
  return "Advice: As per findings, relevant labs and specialist consultation advised. Maintain healthy lifestyle and follow-up.";
}

}

  } else if(n.startsWith("FWB")){
    base=`ULTRASOUND FWB:\n\nFETUS:\nSingle alive [Normal: Single], Presentation cephalic [Normal: cephalic], Lie longitudinal [Normal: longitudinal], Cardiac activity present [Normal: present], FHR __ bpm [Normal: 120-160 bpm], Movement present [Normal: present], Tone normal [Normal: normal].\n\nBIOMETRY:\nBPD __ mm [Normal: GA], HC __ mm [Normal: GA], AC __ mm [Normal: GA], FL __ mm [Normal: GA], EFW __ gm [Normal: GA], GA __ weeks __ days [Normal: dates], Growth __% [Normal: 10-90%], Interval growth adequate [Normal: adequate].\n\nANATOMY:\nHead normal [Normal: normal], Brain normal [Normal: normal], Face normal [Normal: normal], Heart 4-chamber normal [Normal: normal], Abdomen stomach/kidneys/bladder present [Normal: present], Spine intact [Normal: intact], Limbs normal [Normal: normal].\n\nFLUID & PLACENTA:\nAFI __ cm [Normal: 8-18 cm], SDP __ cm [Normal: 2-8 cm], Adequate [Normal: adequate], Clear [Normal: clear], Placenta upper segment [Normal: upper], Grade __ [Normal: 0-II], Thickness __ mm [Normal: 20-40 mm], No clot [Normal: No clot], Distance from os __ mm [Normal: >20 mm].\n\nCORD & CERVIX:\nCord 3 vessels [Normal: 3 vessels], Insertion central [Normal: central], No knot [Normal: No knot], Doppler normal [Normal: normal], Cervix length __ mm [Normal: >25 mm], Internal os closed [Normal: closed], No funneling [Normal: No funneling].\n\nCONCLUSION:\n${n} __ weeks.\n\nADVICE:\n${getAdvice(n)}`;
  } else {
    base=`ULTRASOUND ${n.split(' - ')[0]}:\n\nEXAMINATION:\nSize __ x __ x __ mm [Normal: normal], Volume __ cc [Normal: normal], Shape normal [Normal: normal], Echotexture homogenous [Normal: homogenous], Echogenicity normal [Normal: normal], Vascularity normal [Normal: normal], No focal lesion [Normal: No lesion], No cyst [Normal: No cyst], No calcification [Normal: No calcification], No mass [Normal: No mass], Capsule intact [Normal: intact], No lymphadenopathy [Normal: No lymphadenopathy], Wall thickness __ mm [Normal: <5 mm], Skin normal [Normal: normal].\n\nCONCLUSION:\n${n}.\n\nADVICE:\n${getAdvice(n)}`;

let T={}; allNames.forEach(k=>{T[k]=gen(k);});
let allTemplates=Object.keys(T);
function filterTemplates(){let q=(document.getElementById('tSearch')?.value||'').toLowerCase();let filtered=allTemplates.filter(k=>k.toLowerCase().includes(q));let s=document.getElementById('uType');if(!s)return;let cur=s.value;s.innerHTML='';filtered.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});if(filtered.includes(cur))s.value=cur;}
function useSelectedTemplate(){let v=document.getElementById('uType')?.value;if(!v){alert('Select template');return;}document.getElementById('rText').value=T[v]||'';}
function formatReportToHTML(text){
  let lines=text.split('\n');
  let html='';
  let diagramAdded=false;
  lines.forEach(line=>{
    let l=line.trim();
    if(!l){html+='<div style="height:3px"></div>';return;}
    // Skip advice normal filtering - advice has no [Normal:]
    let clean=l.replace(/\[Normal:[^\]]*\]/gi,'').trim();
    if(!clean)return;
    if(clean.toUpperCase().startsWith('ULTRASOUND')){
      html+=`<div style="text-align:center;margin:10px 0;font-weight:900;text-decoration:underline;font-size:13px">${clean}</div>`;
      return;
    }
    if(clean.toUpperCase().startsWith('CONCLUSION:')){
      html+=`<div style="margin-top:14px"><b><u>CONCLUSION:</u></b> <b>${clean.replace(/CONCLUSION:/i,'').trim()}</b></div>`;
      return;
    }
    if(clean.toUpperCase().startsWith('ADVICE:')){
      html+=`<div style="margin-top:12px"><b><u>ADVICE:</u></b> ${clean.replace(/ADVICE:/i,'').trim()}</div>`;
      // Add diagram after advice heading will be added later
      return;
    }
    if(clean.startsWith('ADVICE:')||clean.includes('LFTs')||clean.includes('RFTs')||clean.includes('CBC')||clean.includes('Urine')||clean.includes('Gynae')||clean.includes('Urologist')||clean.includes('Physician')||clean.includes('No active pathology')||clean.includes('Routine follow-up')||clean.includes('Maintain healthy')){
      // Advice content line - no bullet, just text
      if(!clean.toUpperCase().startsWith('ADVICE:')){
        html+=`<div style="margin:3px 0 3px 16px;font-size:11.5px"><i>${clean}</i></div>`;
      }
      return;
    }
    if(clean.endsWith(':')){
      html+=`<div style="margin:7px 0 2px 0;font-weight:800;font-size:12px"><i>➢ ${clean}</i></div>`;
    }else{
      html+=`<div style="margin:1px 0 1px 24px;font-size:11.5px"><i>• ${clean.replace(/^[-•➢]\s*/,'').trim()}</i></div>`;
    }
  });
  // Add diagram at end of body - will be injected separately
  return html;
}
function make(){
  let pn=document.getElementById('pName');
  if(!pn?.value){alert('Enter Patient Name');return;}
  let pid=document.getElementById('pIDMobile')?.value||'__';
  let complaintText=(document.getElementById('pComplaint')?.value||'').trim();
  let templateName=document.getElementById('uType').value||'';
  let patientBorder=`<div style="border:1.5px solid #000;padding:6px 8px;margin-bottom:8px;font-size:11px"><div><b>Name:</b> ${document.getElementById('pName').value} | <b>Age:</b> ${document.getElementById('pAge').value} | <b>Sex:</b> ${document.getElementById('pGen').value} | <b>Date:</b> ${document.getElementById('pDate').value} | <b>ID/Mobile:</b> ${pid}</div><div><b>Ref By:</b> ${document.getElementById('ref').value} | <b>Sonologist:</b> ${document.getElementById('sono').value}</div></div>`;
  let bodyHTML=formatReportToHTML(document.getElementById('rText').value);
  let diagramHTML=getDiagram(templateName);
  let adviceText=getAdvice(templateName);
  let adviceHTML=`<div style="margin-top:10px;border-top:1px dashed #000;padding-top:6px"><b><u>ADVICE:</u></b> <span style="font-size:11px">${adviceText}</span></div>`;
  // If advice already in body, don't duplicate - check
  if(!bodyHTML.includes('ADVICE:')){bodyHTML+=adviceHTML;}
  if(complaintText){bodyHTML=`<div style="margin-bottom:6px;font-size:11px"><b><i>C/O: ${complaintText}</i></b></div>`+bodyHTML;}
  bodyHTML+=diagramHTML;
  let footer=`<div style="margin-top:16px;text-align:center"><div style="font-size:9px"><i>This is computer generated report no signature required.</i></div><div style="font-size:11px;margin-top:6px;font-weight:700">Thanks for availing our services</div></div>`;
  document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;
  document.getElementById('outCard').style.display='block';
}
function saveR(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let rec={id:Date.now(),name:document.getElementById('pName')?.value||'',age:document.getElementById('pAge')?.value||'',gen:document.getElementById('pGen')?.value||'',mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'',date:document.getElementById('pDate')?.value||'',ref:document.getElementById('ref')?.value||'',sono:document.getElementById('sono')?.value||'',text:document.getElementById('rText')?.value||'',complaint:document.getElementById('pComplaint')?.value||'',html:document.getElementById('reportContent')?.innerHTML||''};all.unshift(rec);localStorage.setItem('azam_reports',JSON.stringify(all));render();alert('Saved locally');}
function saveToDrive(){let content=document.getElementById('reportContent').innerHTML;let name=document.getElementById('pName').value||'Report';let blob=new Blob([content],{type:'text/html'});let url=URL.createObjectURL(blob);let a=document.createElement('a'); a.href=url; a.download=name+'.html'; a.click();try{let driveData=JSON.parse(localStorage.getItem('azam_drive_backup')||'[]');driveData.unshift({id:Date.now(),name:name,date:new Date().toISOString(),html:content});localStorage.setItem('azam_drive_backup',JSON.stringify(driveData));document.getElementById('driveStatus').innerText='● Saved to Drive - '+name+' | '+new Date().toLocaleString();document.getElementById('driveStatus').style.color='#10b981';alert('☁️ Report Google Drive backup me save ho gayi!');window.open('https://drive.google.com/drive/','_blank');}catch(e){alert('Drive save error - local download ho gayi');}}
function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');if(!listEl)return;let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:20px">No reports</p>';return;}listEl.innerHTML=f.map(r=>`<div style="border:1px solid #cbd5e1;padding:8px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div><div><button class="small" style="background:#0a4eb5" onclick="viewR(${r.id})">View</button><button class="small" style="background:#10b981" onclick="saveToDrive()">Drive</button><button class="small" style="background:#ff3b30" onclick="delR(${r.id})">Del</button></div></div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('pName').value=r.name;document.getElementById('pAge').value=r.age;document.getElementById('pGen').value=r.gen;document.getElementById('pIDMobile').value=r.mobile;document.getElementById('uType').value=r.type;document.getElementById('pDate').value=r.date;document.getElementById('ref').value=r.ref;document.getElementById('sono').value=r.sono;document.getElementById('rText').value=r.text;document.getElementById('pComplaint').value=r.complaint;make();}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:document.getElementById('rText').value;doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allTemplates.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();let tc=document.getElementById('templateCount');if(tc)tc.innerText=allTemplates.length+' Templates';render();}
init();
