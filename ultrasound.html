<script>
const CLIENT_ID='153046624604-p07rnrrj0kdhi23n8384kbd47i2rtace.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.file';
let tokenClient,driveFolderId=null,editingId=null;
function gapiLoaded(){gapi.load('client', async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});}catch(e){}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:''});}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){alert('Loading...');rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken())); document.getElementById('driveStatus').innerText='Drive Connected'; res(r);}};tokenClient.requestAccessToken({prompt:''});});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports', mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}
async function findFileInFolder(folderId,fileName){try{let q=`'${folderId}' in parents and name='${fileName}' and trashed=false`;let res=await gapi.client.drive.files.list({q:q,fields:"files(id,name)"});if(res.result.files&&res.result.files.length>0) return res.result.files[0]; return null;}catch(e){return null;}}
async function uploadToDriveFile(name,content){ try{ let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); if(!folderId) return; let token=gapi.client.getToken(); let existing=await findFileInFolder(folderId,name); if(existing){ await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:content}); return; } const file=new Blob([content],{type:'application/json'});const meta={name:name,mimeType:'application/json',parents:[folderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',file); await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:new Headers({'Authorization':'Bearer '+token.access_token}),body:form}); }catch(e){} }
async function loadFromDrive(){ try{ document.getElementById('driveStatus').innerText='Loading...'; let savedToken=localStorage.getItem('gdrive_token'); if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}} await ensureDriveAuth(); let folderId=await getOrCreateFolder(); if(!folderId){alert('Folder not found');return;} let file=await findFileInFolder(folderId,'Azam_Medical_Backup_ALL.json'); if(!file){alert('No backup found');return;} let token=gapi.client.getToken(); let res=await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}}); if(!res.ok){alert('Load failed');return;} let text=await res.text(); let data=JSON.parse(text); if(!Array.isArray(data)){alert('Invalid backup');return;} localStorage.setItem('azam_reports',JSON.stringify(data)); render(); document.getElementById('driveStatus').innerText='Loaded '+data.length; alert('Loaded '+data.length); }catch(e){alert('Load error: '+e.message);} }
window.addEventListener('load',()=>{setTimeout(()=>{try{gapiLoaded();gisLoaded();}catch(e){}},1500);});
function checkCalculator(){ let v=document.getElementById('uType').value||''; document.getElementById('obsCalc').style.display = (v.includes('FWB'))? 'block' : 'none'; document.getElementById('prosCalc').style.display = (v.includes('PROSTATE'))? 'block' : 'none'; }
function toMM(val){ if(!val || val==0) return 0; if(val < 30) return val*10; return val; }
function calcFWBFixed(){ let raw_bpd = parseFloat(document.getElementById('bpd').value)||0; let raw_hc = parseFloat(document.getElementById('hc').value)||0; let raw_ac = parseFloat(document.getElementById('ac').value)||0; let raw_fl = parseFloat(document.getElementById('fl').value)||0; let bpd_mm = toMM(raw_bpd); let hc_mm = toMM(raw_hc); let ac_mm = toMM(raw_ac); let fl_mm = toMM(raw_fl); if(ac_mm===0 && hc_mm>0){ ac_mm = hc_mm*0.80; } if(bpd_mm===0 && hc_mm===0 && fl_mm===0 && ac_mm===0){ return; } let bpd_cm = bpd_mm/10, hc_cm = hc_mm/10, ac_cm = ac_mm/10, fl_cm = fl_mm/10; let ga_bpd=0, ga_hc=0, ga_fl=0, ga_ac=0; if(bpd_mm>0) ga_bpd = (bpd_mm - 20)*0.3 + 12; if(hc_mm>0) ga_hc = (hc_mm - 80)*0.11 + 12; if(fl_mm>0) ga_fl = (fl_mm - 10)*0.38 + 12; if(ac_mm>0) ga_ac = (ac_mm - 60)*0.13 + 12; let sum=0, cnt=0; if(bpd_mm>0){sum+=ga_bpd;cnt++} if(hc_mm>0){sum+=ga_hc;cnt++} if(fl_mm>0){sum+=ga_fl;cnt++} if(ac_mm>0){sum+=ga_ac;cnt++} let avgGA = cnt>0? sum/cnt : 0; if(avgGA>0){ document.getElementById('gaResult').value = avgGA.toFixed(1)+' wks'; let today = new Date(); let edd = new Date(); edd.setDate(today.getDate() + (40-avgGA)*7); document.getElementById('eddResult').value = edd.toLocaleDateString('en-GB'); } if(ac_cm>0 && fl_cm>0 && hc_cm>0){ let log10EFW_standard = 1.3596 - (0.00386*ac_cm*fl_cm) + (0.0064*hc_cm) + (0.00061*bpd_cm*ac_cm) + (0.0424*ac_cm) + (0.174*fl_cm); let log10EFW_machine = log10EFW_standard + 0.2385; let efw = Math.pow(10, log10EFW_machine); if(efw>100 && efw<5500){ document.getElementById('efwResult').value = Math.round(efw) + ' gms'; } } }
function calcEDD(){ let lmp=document.getElementById('lmp').value; if(!lmp){ calcFWBFixed(); return; } let d=new Date(lmp); d.setDate(d.getDate()+280); document.getElementById('eddResult').value = d.toLocaleDateString('en-GB'); let today=new Date(lmp); let now=new Date(); let diffDays=Math.floor((now-today)/(1000*60*60*24)); let gaWeeks=diffDays/7; if(gaWeeks>0) document.getElementById('gaResult').value=gaWeeks.toFixed(1)+' wks (LMP)'; }
function insertFWBAnomaly(){ let raw_bpd = parseFloat(document.getElementById('bpd').value)||7.1; let raw_hc = parseFloat(document.getElementById('hc').value)||25.0; let raw_ac = parseFloat(document.getElementById('ac').value)||20.1; let raw_fl = parseFloat(document.getElementById('fl').value)||5.4; let bpd_mm = toMM(raw_bpd), hc_mm = toMM(raw_hc), ac_mm = toMM(raw_ac), fl_mm = toMM(raw_fl); let bpd_cm = (bpd_mm/10).toFixed(1), hc_cm = (hc_mm/10).toFixed(1), ac_cm = (ac_mm/10).toFixed(1), fl_cm = (fl_mm/10).toFixed(1); let ga = document.getElementById('gaResult').value||'28 weeks+1 week'; let efw = document.getElementById('efwResult').value||'1656 gms'; let report = `FWB & OBSTETRIC ULTRASOUND REPORT:\n\nNumber of Fetus: SINGLE [N: Single]\nLocation: INTRAUTERINE [N: Intrauterine]\nPresentation: CEPHALIC [N: Cephalic]\nLie: LONGITUDINAL LIE [N: Longitudinal]\nFetal Cardiac Activity: PRESENT (152 BPM) [N: Present]\nGross Fetal Movement: PRESENT [N: Present]\nPlacenta: ANTERIOR, NOT LOW-LYING [N: Not low-lying]\nPlacental Maturity: GRADE II [N: Grade 0-III]\nAmount of Liquor: ADEQUATE RESPECTIVE TO GEST-AGE [N: Adequate]\n\nB.P.D.: (Bi Parietal Diameter) ${bpd_cm} cm [N: As per ${ga}]\nF.L.: (Femur Length) ${fl_cm} cm [N: As per ${ga}]\nHC: (Head Circumference) ${hc_cm} cm [N: As per ${ga}]\nAC: (Abdominal Circumference) ${ac_cm} cm [N: As per ${ga}]\nEstimated Fetal Weight: ${efw} Approx [N: As per GA]\n\nCONCLUSION:\nScan of the pelvis shows single alive intrauterine pregnancy corresponding to the gestational age of ${ga}. Cephalic presentation & placenta localized anteriorly no previa with grade II maturity. Internal os is closed. Amount of liquor is adequate.\nRest of study unremarkable.\n\nAFI: 4.8 cm - 2.5 cm / 3.0 cm - 4.3 cm\nThe amniotic fluid index is 14.8 cm (Normal 08 to 20cm) [N: 8-20 cm]\n\nADVICE:\nRoutine antenatal follow up.`; document.getElementById('rText').value = report; }
function calcProstate(){ let l=parseFloat(document.getElementById('prosL').value)||0; let w=parseFloat(document.getElementById('prosW').value)||0; let h=parseFloat(document.getElementById('prosH').value)||0; if(l&&w&&h){ let vol = l*w*h*0.52; document.getElementById('prosVol').value = vol.toFixed(1)+' gm'; } }
function insertProstate(){ let l=document.getElementById('prosL').value||'__', w=document.getElementById('prosW').value||'__', h=document.getElementById('prosH').value||'__', vol=document.getElementById('prosVol').value||''; document.getElementById('rText').value += `\nProstate: ${l} x ${w} x ${h} cm [N: <4.0 x 3.0 x 3.0 cm], Vol: ${vol} [N: 15-25 gm]\n`; }

function getAdvice(n){
if(n.includes("DEATH CERTIFICATE")) return "Burial purpose only. Obtain NADRA Death Certificate from Union Council.";
if(n.includes("Hilum Lymph Node")) return "CBC, ESR, CRP, CT Abdomen with contrast, Physician consultation.";
if(n.includes("Dilated Proximal Ureter")) return "KFT, Urine DR, CT KUB / IVP, Urologist consultation, Drink plenty of water 3L/day.";
if(n.includes("Fullness")) return "Hydration, KFT, Urine DR, Repeat USG after hydration, Urologist opinion.";
if(n.includes("Hydronephrosis")||n.includes("Hydroureteronephrosis")) return "KFT, Urine DR/C/S, CT KUB, Urologist consultation urgently, Drink 3-4L water.";
if(n.includes("PUJ Obstruction")) return "DTPA scan, CT KUB, KFT, Urologist consultation.";
if(n.includes("Renal Swelling")) return "KFT, Urine DR, CBC, Physician / Nephrologist consultation, No NSAID.";
if(n.includes("Calculus")||n.includes("Staghorn")||n.includes("Microliths")) return "Drink plenty water 3-4L/day, KFT, Urine DR, Urologist consultation, Avoid spinach/tomato.";
if(n.includes("Parenchymal Changes")) return "KFT, Urine DR, BP monitoring, Nephrologist consultation, Avoid nephrotoxic drugs.";
if(n.includes("Cyst")) return "Usually benign, Repeat USG after 6 months, Physician consultation, KFT.";
if(n.includes("Bladder Stone")) return "KFT, Urine DR/C/S, Urologist consultation, Drink plenty water, Cystoscopy if needed.";
if(n.includes("Blood Clots")) return "Urine DR, KFT, CBC, Urologist consultation urgently, No blood thinner without advice.";
if(n.includes("Distal Ureter Calculus")) return "Drink plenty water, KFT, Urine DR, Urologist consultation, Medical expulsion therapy if advised.";
if(n.includes("Cystitis")) return "Urine DR/C/S, Drink 3-4L water, Antibiotic as per doctor, Urologist consultation, Avoid spicy food.";
if(n.includes("Diverticulum")||n.includes("Trabeculation")) return "Urodynamic study, KFT, Urine DR, Urologist consultation, Avoid constipation.";
if(n.includes("Bladder Mass")) return "CT KUB with contrast, Urine cytology, Cystoscopy, Urologist consultation urgently.";
if(n.includes("BPH")) return "KFT, PSA, Urine DR, Uroflowmetry, Urologist consultation, Avoid cold & constipation.";
if(n.includes("Normal")) return "No active pathology seen at present. Routine follow up if needed.";
return "Relevant labs and specialist consultation advised.";
}
function getDiagnosis(n){
if(n.startsWith("DEATH CERTIFICATE")) return "Natural Death - Medical confirmation for burial purpose";
if(n==="WHOLE ABDOMEN - Hilum Lymph Node") return "Lymph node at left renal / splenic hilum 22x14 mm - Hypoechoic, no compressive hydronephrosis";
if(n==="KUB - Dilated Proximal Ureter Bilateral") return "Bilateral proximal ureters dilated 6.5-6.8 mm [N: <4 mm] - Dilated proximal ureters, no hydronephrosis";
if(n==="KUB - Dilated Proximal Ureter Right") return "Right proximal ureter dilated 7 mm [N: <4 mm] - Dilated proximal ureter Right, no hydronephrosis";
if(n==="KUB - Dilated Proximal Ureter Left") return "Left proximal ureter dilated 7 mm [N: <4 mm] - Dilated proximal ureter Left";
if(n==="KUB - Fullness Right") return "Right pelvicalyceal system fullness / prominence [N: No fullness] - PCS fullness Right";
if(n==="KUB - Fullness Left") return "Left PCS fullness - Left pelvicalyceal fullness";
if(n==="KUB - Fullness Bilateral") return "Bilateral PCS fullness - Prominent PCS both sides";
if(n==="KUB - Renal Swelling Right") return "Right renal swelling / Renomegaly 13.5 x 6.0 cm - Swollen right kidney";
if(n==="KUB - Renal Swelling Bilateral") return "Bilateral renal swelling - Both kidneys enlarged & edematous";
if(n.includes(" - ")){ let p=n.split(' - '); return p.slice(1).join(' - ').trim(); }
return n;
}

function formatReportToHTML(text){
  let printText=cleanForPrint(text);
  let lines=printText.split('\n');
  let html=''; let inConclusion=false;
  lines.forEach(line=>{
    let l=line.trim();
    if(!l){html+='<div style="height:6px"></div>';return;}
    if(l.toUpperCase()==='DEATH CERTIFICATE' || l.toUpperCase().startsWith('ULTRASOUND')){inConclusion=false; if(l.toUpperCase()==='DEATH CERTIFICATE') return; html+=`<div style="text-align:center;margin:6px 0;font-weight:900;text-decoration:underline;font-size:11pt!important">${l}</div>`;return;}
    if(l.toUpperCase().startsWith('CONCLUSION:')){
      inConclusion=true;
      let rest=l.replace(/CONCLUSION:/i,'').trim();
      html+=`<div style="margin-top:10px"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">CONCLUSION:</b></div>`;
      if(rest){ html+=`<div style="margin-left:2px;font-weight:900;font-size:11pt!important;margin-top:2px"><b>• ${rest}</b></div>`; }
      return;
    }
    if(l.toUpperCase().startsWith('NOTE:')||l.toUpperCase().startsWith('ADVICE:')){
      inConclusion=false;
      let head = l.split(':')[0];
      let rest=l.substring(l.indexOf(':')+1).trim();
      html+=`<div style="margin-top:8px"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">${head}:</b></div><div style="margin-left:2px;font-size:11pt!important">${rest}</div>`;return;
    }
    if(inConclusion){
      html+=`<div style="margin:2px 0 2px 2px;font-size:11pt!important;font-weight:900"><b>• ${l.replace(/^•\s*/,'')}</b></div>`;
      return;
    }
    if(l.includes(':')){
      let idx=l.indexOf(':');
      let heading=l.substring(0,idx).trim();
      let value=l.substring(idx+1).trim();
      html+=`<div style="margin:3px 0 3px 2px;font-size:11pt!important">• <b style="text-decoration:underline;font-weight:900">${heading}:</b> ${value}</div>`;
      return;
    }
    html+=`<div style="margin:2px 0 2px 2px;font-size:11pt!important">• ${l.replace(/^•\s*/,'')}</div>`;
  });
  return html;
}

    patientBorder=`<div style="text-align:center;font-size:18pt!important;font-weight:900;text-decoration:underline;margin-bottom:14px">DEATH CERTIFICATE</div>`;

    patientBorder=`

  document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;
  document.getElementById('outCard').style.display='block';
  window.scrollTo(0, document.getElementById('outCard').offsetTop);
}
function saveR(){ let content=document.getElementById('reportContent').innerHTML; if(!content||content.trim()===''){alert('Generate Report first');return;} let rec={ id: editingId || Date.now(), name:document.getElementById('pName').value||'Report', pName:document.getElementById('pName').value, pAge:document.getElementById('pAge').value, pGen:document.getElementById('pGen').value, pDate:document.getElementById('pDate').value, pIDMobile:document.getElementById('pIDMobile').value, ref:getRefValue(), sono:getSonoValue(), pComplaint:document.getElementById('pComplaint').value, mobile:document.getElementById('pIDMobile')?.value||'', type:document.getElementById('uType')?.value||'', date:document.getElementById('pDate')?.value||'', html:content, text:document.getElementById('rText')?.value||'' }; let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];} if(editingId){ let idx=all.findIndex(x=>x.id===editingId); if(idx>=0) all[idx]=rec; else all.unshift(rec); editingId=null; document.getElementById('editMode').style.display='none'; } else { all.unshift(rec); } localStorage.setItem('azam_reports',JSON.stringify(all)); render(); uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all)); alert('Saved'); }
