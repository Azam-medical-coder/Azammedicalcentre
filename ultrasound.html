<script>
if('serviceWorker' in navigator){let swCode=`const CACHE='azam-v7-heading';const URLS=['./'];self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS)).then(()=>self.skipWaiting()));});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.map(k=>{if(k!==CACHE)return caches.delete(k);}))).then(()=>self.clients.claim()));});self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{let rc=r.clone();caches.open(CACHE).then(c=>c.put(e.request,rc));return r;}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./'))));});`;let blob=new Blob([swCode],{type:'text/javascript'});let swUrl=URL.createObjectURL(blob);navigator.serviceWorker.register(swUrl).catch(()=>{});}
function updateNetStatus(){let netEl=document.getElementById('netStatus');let driveEl=document.getElementById('driveStatus');let pendEl=document.getElementById('pendingCount');if(navigator.onLine){netEl.textContent='Online';netEl.style.background='#dcfce7';netEl.style.color='#065f46';if(localStorage.getItem('azam_pending_sync')==='1'){driveEl.textContent='Syncing...';syncNow();}}else{netEl.textContent='Offline Mode';netEl.style.background='#fee2e2';netEl.style.color='#991b1b';driveEl.textContent='Offline - Local Save';}let pending=0;try{let a=JSON.parse(localStorage.getItem('azam_reports')||'[]');let lastSync=localStorage.getItem('azam_last_sync_count')||0;pending=a.length-lastSync;if(pending<0)pending=0;}catch(e){pending=0;}if(pending>0){pendEl.style.display='inline-block';pendEl.textContent=pending+' Pending Sync';}else{pendEl.style.display='none';if(navigator.onLine)driveEl.textContent='Drive Synced';}}
window.addEventListener('online',()=>{updateNetStatus();syncNow();});window.addEventListener('offline',updateNetStatus);setInterval(updateNetStatus,3000);
async function syncNow(){if(!navigator.onLine){updateNetStatus();return;}try{let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}if(all.length===0){localStorage.setItem('azam_pending_sync','0');updateNetStatus();return;}document.getElementById('driveStatus').textContent='Syncing '+all.length+' reports...';await uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));localStorage.setItem('azam_last_sync_count',all.length.toString());localStorage.setItem('azam_pending_sync','0');document.getElementById('driveStatus').textContent='Drive Synced '+all.length;updateNetStatus();}catch(e){localStorage.setItem('azam_pending_sync','1');document.getElementById('driveStatus').textContent='Sync Failed - Will retry';}}
const CLIENT_ID='153046624604-p07rnrrj0kdhi23n8384kbd47i2rtace.apps.googleusercontent.com';const SCOPES='https://www.googleapis.com/auth/drive.file';let tokenClient,driveFolderId=null,editingId=null;
function gapiLoaded(){gapi.load('client',async()=>{try{await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});}catch(e){}});}
function gisLoaded(){try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:''});}catch(e){}}
function ensureDriveAuth(){return new Promise((res,rej)=>{if(!tokenClient){if(!navigator.onLine){rej('Offline');return;}alert('Loading Google...');rej('No tokenClient');return;}tokenClient.callback=(r)=>{if(r.error)rej(r);else{localStorage.setItem('gdrive_token',JSON.stringify(gapi.client.getToken()));document.getElementById('driveStatus').innerText='Drive Connected';res(r);}};tokenClient.requestAccessToken({prompt:''});});}
async function getOrCreateFolder(){if(driveFolderId)return driveFolderId;try{let r=await gapi.client.drive.files.list({q:"name='Azam_Medical_Reports' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:"files(id,name)"});if(r.result.files&&r.result.files.length>0){driveFolderId=r.result.files[0].id;return driveFolderId;}let c=await gapi.client.drive.files.create({resource:{name:'Azam_Medical_Reports',mimeType:'application/vnd.google-apps.folder'},fields:'id'});driveFolderId=c.result.id;return driveFolderId;}catch(e){return null;}}
async function findFileInFolder(folderId,fileName){try{let q=`'${folderId}' in parents and name='${fileName}' and trashed=false`;let res=await gapi.client.drive.files.list({q:q,fields:"files(id,name)"});if(res.result.files&&res.result.files.length>0)return res.result.files[0];return null;}catch(e){return null;}}
async function uploadToDriveFile(name,content){if(!navigator.onLine){localStorage.setItem('azam_pending_sync','1');updateNetStatus();return;}try{let savedToken=localStorage.getItem('gdrive_token');if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}}await ensureDriveAuth();let folderId=await getOrCreateFolder();if(!folderId)return;let token=gapi.client.getToken();let existing=await findFileInFolder(folderId,name);if(existing){await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`,{method:'PATCH',headers:{'Authorization':'Bearer '+token.access_token,'Content-Type':'application/json'},body:content});localStorage.setItem('azam_last_sync_count',JSON.parse(localStorage.getItem('azam_reports')||'[]').length.toString());localStorage.setItem('azam_pending_sync','0');updateNetStatus();return;}const file=new Blob([content],{type:'application/json'});const meta={name:name,mimeType:'application/json',parents:[folderId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',file);await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:new Headers({'Authorization':'Bearer '+token.access_token}),body:form});localStorage.setItem('azam_last_sync_count',JSON.parse(localStorage.getItem('azam_reports')||'[]').length.toString());localStorage.setItem('azam_pending_sync','0');updateNetStatus();}catch(e){localStorage.setItem('azam_pending_sync','1');updateNetStatus();}}
async function loadFromDrive(){try{if(!navigator.onLine){alert('Internet off hai');return;}document.getElementById('driveStatus').innerText='Loading...';let savedToken=localStorage.getItem('gdrive_token');if(savedToken){try{gapi.client.setToken(JSON.parse(savedToken));}catch(e){}}await ensureDriveAuth();let folderId=await getOrCreateFolder();if(!folderId){alert('Folder not found');return;}let file=await findFileInFolder(folderId,'Azam_Medical_Backup_ALL.json');if(!file){alert('No backup found');return;}let token=gapi.client.getToken();let res=await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{'Authorization':'Bearer '+token.access_token}});if(!res.ok){alert('Load failed');return;}let text=await res.text();let data=JSON.parse(text);if(!Array.isArray(data)){alert('Invalid backup');return;}localStorage.setItem('azam_reports',JSON.stringify(data));localStorage.setItem('azam_last_sync_count',data.length.toString());render();document.getElementById('driveStatus').innerText='Loaded '+data.length;alert('Loaded '+data.length);updateNetStatus();}catch(e){alert('Load error: '+e.message);}}
window.addEventListener('load',()=>{setTimeout(()=>{try{gapiLoaded();gisLoaded();}catch(e){}updateNetStatus();if(navigator.onLine){setTimeout(()=>{syncNow();},2000);}},1500);});
function checkCalculator(){let v=document.getElementById('uType').value||'';document.getElementById('obsCalc').style.display=(v.includes('FWB'))?'block':'none';document.getElementById('prosCalc').style.display=(v.includes('PROSTATE'))?'block':'none';}
function toMM(val){if(!val||val==0)return 0;if(val<30)return val*10;return val;}
function calcFWBFixed(){let raw_bpd=parseFloat(document.getElementById('bpd').value)||0;let raw_hc=parseFloat(document.getElementById('hc').value)||0;let raw_ac=parseFloat(document.getElementById('ac').value)||0;let raw_fl=parseFloat(document.getElementById('fl').value)||0;let bpd_mm=toMM(raw_bpd);let hc_mm=toMM(raw_hc);let ac_mm=toMM(raw_ac);let fl_mm=toMM(raw_fl);if(ac_mm===0&&hc_mm>0){ac_mm=hc_mm*0.80;}if(bpd_mm===0&&hc_mm===0&&fl_mm===0&&ac_mm===0){return;}let bpd_cm=bpd_mm/10,hc_cm=hc_mm/10,ac_cm=ac_mm/10,fl_cm=fl_mm/10;let ga_bpd=0,ga_hc=0,ga_fl=0,ga_ac=0;if(bpd_mm>0)ga_bpd=(bpd_mm-20)*0.3+12;if(hc_mm>0)ga_hc=(hc_mm-80)*0.11+12;if(fl_mm>0)ga_fl=(fl_mm-10)*0.38+12;if(ac_mm>0)ga_ac=(ac_mm-60)*0.13+12;let sum=0,cnt=0;if(bpd_mm>0){sum+=ga_bpd;cnt++}if(hc_mm>0){sum+=ga_hc;cnt++}if(fl_mm>0){sum+=ga_fl;cnt++}if(ac_mm>0){sum+=ga_ac;cnt++}let avgGA=cnt>0?sum/cnt:0;if(avgGA>0){document.getElementById('gaResult').value=avgGA.toFixed(1)+' wks';let today=new Date();let edd=new Date();edd.setDate(today.getDate()+(40-avgGA)*7);document.getElementById('eddResult').value=edd.toLocaleDateString('en-GB');}if(ac_cm>0&&fl_cm>0&&hc_cm>0){let log10EFW_standard=1.3596-(0.00386*ac_cm*fl_cm)+(0.0064*hc_cm)+(0.00061*bpd_cm*ac_cm)+(0.0424*ac_cm)+(0.174*fl_cm);let log10EFW_machine=log10EFW_standard+0.2385;let efw=Math.pow(10,log10EFW_machine);if(efw>100&&efw<5500){document.getElementById('efwResult').value=Math.round(efw)+' gms';}}}
function calcEDD(){let lmp=document.getElementById('lmp').value;if(!lmp){calcFWBFixed();return;}let d=new Date(lmp);d.setDate(d.getDate()+280);document.getElementById('eddResult').value=d.toLocaleDateString('en-GB');let today=new Date(lmp);let now=new Date();let diffDays=Math.floor((now-today)/(1000*60*60*24));let gaWeeks=diffDays/7;if(gaWeeks>0)document.getElementById('gaResult').value=gaWeeks.toFixed(1)+' wks (LMP)';}
function insertFWBAnomaly(){let raw_bpd=parseFloat(document.getElementById('bpd').value)||7.1;let raw_hc=parseFloat(document.getElementById('hc').value)||25.0;let raw_ac=parseFloat(document.getElementById('ac').value)||20.1;let raw_fl=parseFloat(document.getElementById('fl').value)||5.4;let bpd_mm=toMM(raw_bpd),hc_mm=toMM(raw_hc),ac_mm=toMM(raw_ac),fl_mm=toMM(raw_fl);let bpd_cm=(bpd_mm/10).toFixed(1),hc_cm=(hc_mm/10).toFixed(1),ac_cm=(ac_mm/10).toFixed(1),fl_cm=(fl_mm/10).toFixed(1);let efw=document.getElementById('efwResult').value||'1656 gms';let report=`FWB & OBSTETRIC ULTRASOUND REPORT:\n\nNumber of Fetus: SINGLE\nLocation: INTRAUTERINE\nPresentation: CEPHALIC\nLie: LONGITUDINAL LIE\nFetal Cardiac Activity: PRESENT (152 BPM)\nGross Fetal Movement: PRESENT\nPlacenta: ANTERIOR, NOT LOW-LYING\nPlacental Maturity: GRADE II\nAmount of Liquor: ADEQUATE\n\nB.P.D.: ${bpd_cm} cm\nF.L.: ${fl_cm} cm\nHC: ${hc_cm} cm\nAC: ${ac_cm} cm\nEstimated Fetal Weight: ${efw} Approx`;document.getElementById('rText').value=report;}
function calcProstate(){let l=parseFloat(document.getElementById('prosL').value)||0;let w=parseFloat(document.getElementById('prosW').value)||0;let h=parseFloat(document.getElementById('prosH').value)||0;if(l&&w&&h){let vol=l*w*h*0.52;document.getElementById('prosVol').value=vol.toFixed(1)+' gm';}}
function insertProstate(){let l=document.getElementById('prosL').value||'__',w=document.getElementById('prosW').value||'__',h=document.getElementById('prosH').value||'__',vol=document.getElementById('prosVol').value||'';document.getElementById('rText').value+=`\nProstate: ${l} x ${w} x ${h} cm, Vol: ${vol}\n`;}

function getAdvice(n){
if(n.includes("SCROTUM - Hydrocele")) return "KFT, Urine DR, Relevant labs and specialist consultation advised.";
if(n.includes("Varicocele")) return "Semen analysis, Urologist consultation advised.";
if(n.includes("Epididym")) return "CBC, Urine DR/C/S, Physician consultation. Antibiotic as per physician.";
if(n.includes("Orchitis")) return "CBC, Urine DR, Physician consultation.";
if(n.includes("Torsion")) return "Immediate Urologist / Surgical consultation - URGENT.";
if(n.includes("DEATH CERTIFICATE")) return "Burial purpose only. Obtain NADRA Death Certificate from Union Council.";
if(n.includes("Parenchymal Changes Grade 2")) return "Grade II parenchymal changes small kidneys 9.5 x 4.0 cm and 6.5 x 3.0 cm with loss of CMD and left simple cortical cyst 24 x 28 mm. KFT, RFT, Urine DR, Nephrologist consultation, Hydration, No NSAID, Repeat USG after 3 months, Cyst follow up.";
if(n.includes("Normal")) return "No active pathology seen at present. Routine follow up, Plenty water, Healthy diet.";
return "KFT, Urine DR, Relevant labs and specialist consultation advised.";
}
function getDiagnosis(n){

if(n.includes("SCROTUM - Hydrocele Bilateral")) return "Bilateral Hydrocele";
if(n.includes("SCROTUM - Varicocele Left")) return "Left Varicocele Grade III";
if(n.includes("SCROTUM - Varicocele Right")) return "Right Varicocele";
if(n.includes("SCROTUM - Varicocele Bilateral")) return "Bilateral Varicocele";

if(n.includes("SCROTUM - Epididymitis Left")) return "Left Epididymitis";

function formatReportToHTML(text){
let printText=cleanForPrint(text);let lines=printText.split('\n');let html='';let inConclusion=false;
const headingStarts=["RIGHT KIDNEY","LEFT KIDNEY","URINARY BLADDER","PROSTATE","LIVER","GALL BLADDER","SPLEEN","PANCREAS","UTERUS","RIGHT OVARY","LEFT OVARY","POD","RIGHT TESTIS","LEFT TESTIS","EPIDIDYMIS","TUNICA","SPERMATIC CORD","COLOUR DOPPLER","RIGHT SIDE","LEFT SIDE","BOTH TESTES","RIGHT PAMPINIFORM","LEFT PAMPINIFORM","RIGHT EPIDIDYMIS","LEFT EPIDIDYMIS","RIGHT EPIDIDYMIS + TESTIS","LEFT EPIDIDYMIS + TESTIS","RIGHT TESTIS","LEFT TESTIS"];
lines.forEach(line=>{let l=line.trim();if(!l){html+='<div style="height:6px"></div>';return;}
if(l.toUpperCase().startsWith('ULTRASOUND')||l.toUpperCase().startsWith('FWB')||l.toUpperCase().startsWith('ANAL')){inConclusion=false;html+=`<div style="text-align:center;margin:8px 0 6px 0;font-weight:900;text-decoration:underline;font-size:12pt!important">${l}</div>`;return;}
if(l.toUpperCase().startsWith('CONCLUSION:')){inConclusion=true;let rest=l.replace(/CONCLUSION:/i,'').trim();html+=`<div style="margin-top:14px;margin-bottom:4px"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">CONCLUSION:</b></div>`;if(rest){html+=`<div style="margin-left:2px;font-weight:900;font-size:11pt!important;margin-top:2px"><b>• ${rest}</b></div>`;}return;}
if(l.toUpperCase().startsWith('NOTE:')||l.toUpperCase().startsWith('ADVICE:')){inConclusion=false;let head=l.split(':')[0];let rest=l.substring(l.indexOf(':')+1).trim();html+=`<div style="margin-top:10px;margin-bottom:3px"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">${head}:</b></div><div style="margin-left:2px;font-size:11pt!important">${rest}</div>`;return;}
if(inConclusion){html+=`<div style="margin:3px 0 3px 2px;font-size:11pt!important;font-weight:900"><b>• ${l.replace(/^•\s*/,'')}</b></div>`;return;}
let cleanLine=l.replace(/^- /,'').trim();let upper=cleanLine.toUpperCase();let isHeading=false;for(let h of headingStarts){if(upper.startsWith(h+":")||upper===h+":"){isHeading=true;break;}}
if(isHeading){let idx=cleanLine.indexOf(':');if(idx>0){let head=cleanLine.substring(0,idx+1);let rest=cleanLine.substring(idx+1).trim();html+=`<div style="margin-top:8px;margin-bottom:2px;font-size:11pt!important"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">${head}</b> ${rest}</div>`;}else{html+=`<div style="margin-top:8px;margin-bottom:2px;font-size:11pt!important"><b style="text-decoration:underline;font-weight:900;font-size:11pt!important">${cleanLine}</b></div>`;}return;}
html+=`<div style="margin:2px 0 2px 18px;font-size:11pt!important">• ${cleanLine}</div>`;});
return html;
}
function make(){let pn=document.getElementById('pName');if(!pn?.value){alert('Enter Name');return;}let isDeath=(document.getElementById('uType')?.value||'').includes('DEATH CERTIFICATE')||(document.getElementById('rText').value||'').includes('Place of Death');let pid=document.getElementById('pIDMobile')?.value||'';let patientBorder;if(isDeath){patientBorder=`<div style="text-align:center;font-size:18pt!important;font-weight:900;text-decoration:underline;margin-bottom:14px">DEATH CERTIFICATE</div>`;}else{patientBorder=`<div style="border:1.2px solid #000;padding:4px 7px;margin-bottom:6px;line-height:1.3"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:7.5pt!important;font-weight:900"><span><b>Name: ${document.getElementById('pName').value}</b></span><span><b>Age: ${document.getElementById('pAge').value}</b></span><span><b>Sex: ${document.getElementById('pGen').value}</b></span><span><b>Date: ${document.getElementById('pDate').value}</b></span><span><b>ID: ${pid}</b></span></div><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:2px;font-size:7.5pt!important;font-weight:900"><span><b>Ref By: ${getRefValue()}</b></span><span><b>Sonologist: ${getSonoValue()}</b></span><span style="opacity:0">.</span></div></div>`;}let complaintText=(document.getElementById('pComplaint')?.value||'').trim();let bodyHTML=formatReportToHTML(document.getElementById('rText').value);if(complaintText&&!isDeath){bodyHTML=`<div style="margin-bottom:5px;font-size:11pt!important;font-style:italic"><b>C/O: ${complaintText}</b></div>`+bodyHTML;}let footer=`<div style="margin-top:16px;text-align:center"><div style="font-size:7.5pt!important"><i>This is computer generated report no signature required.</i></div><div style="font-size:8.5pt!important;margin-top:3px;font-weight:700">Thanks for availing our services</div></div>`;document.getElementById('reportContent').innerHTML=patientBorder+bodyHTML+footer;document.getElementById('outCard').style.display='block';window.scrollTo(0,document.getElementById('outCard').offsetTop);}
function saveR(){let content=document.getElementById('reportContent').innerHTML;if(!content||content.trim()===''){alert('Generate Report first');return;}let rec={id:editingId||Date.now(),name:document.getElementById('pName').value||'Report',pName:document.getElementById('pName').value,pAge:document.getElementById('pAge').value,pGen:document.getElementById('pGen').value,pDate:document.getElementById('pDate').value,pIDMobile:document.getElementById('pIDMobile').value,ref:getRefValue(),sono:getSonoValue(),pComplaint:document.getElementById('pComplaint').value,mobile:document.getElementById('pIDMobile')?.value||'',type:document.getElementById('uType')?.value||'',date:document.getElementById('pDate')?.value||'',html:content,text:document.getElementById('rText')?.value||''};let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}if(editingId){let idx=all.findIndex(x=>x.id===editingId);if(idx>=0)all[idx]=rec;else all.unshift(rec);editingId=null;document.getElementById('editMode').style.display='none';}else{all.unshift(rec);}localStorage.setItem('azam_reports',JSON.stringify(all));if(!navigator.onLine){localStorage.setItem('azam_pending_sync','1');alert('Offline Save - Local me save ho gaya');}else{alert('Saved - Drive sync ho raha hai');}render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));}
function render(){let all=[];try{all=JSON.parse(localStorage.getItem('azam_reports')||'[]');}catch(e){all=[];}let q=(document.getElementById('sBox')?.value||'').toLowerCase();let listEl=document.getElementById('list');let f=all.filter(r=>((r.name||'')+' '+(r.mobile||'')).toLowerCase().includes(q));if(f.length===0){listEl.innerHTML='<p style="text-align:center;color:#888;padding:15px;font-size:10pt">No reports</p>';return;}listEl.innerHTML=f.map(r=>` <div style="border:1px solid #cbd5e1;padding:8px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;font-size:10pt"> <div><b>${r.name}</b> - ${r.type}<br><small>${r.mobile} | ${r.date}</small></div> <div style="display:flex;gap:4px"> <button class="small" style="background:#0a4eb5;padding:8px 12px" onclick="viewR(${r.id})">View</button> <button class="small" style="background:#ff9800;padding:8px 12px" onclick="editR(${r.id})">Edit</button> <button class="small" style="background:#ff3b30;padding:8px 12px" onclick="delR(${r.id})">Del</button> </div> </div>`).join('');}
function viewR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('reportContent').innerHTML=r.html;document.getElementById('outCard').style.display='block';window.scrollTo(0,document.getElementById('outCard').offsetTop);}
function editR(id){let all=JSON.parse(localStorage.getItem('azam_reports')||'[]');let r=all.find(x=>x.id===id);if(!r)return;document.getElementById('pName').value=r.pName||r.name||'';document.getElementById('pAge').value=r.pAge||'';document.getElementById('pGen').value=r.pGen||'Male';document.getElementById('pDate').value=r.pDate||r.date||'';document.getElementById('pIDMobile').value=r.pIDMobile||r.mobile||'';if(refDoctors.includes(r.ref)){document.getElementById('ref').value=r.ref;document.getElementById('refOther').style.display='none';}else{document.getElementById('ref').value='Other';document.getElementById('refOther').style.display='block';document.getElementById('refOther').value=r.ref||'';}if(sonoDoctors.includes(r.sono)){document.getElementById('sono').value=r.sono;document.getElementById('sonoOther').style.display='none';}else{document.getElementById('sono').value='Other';document.getElementById('sonoOther').style.display='block';document.getElementById('sonoOther').value=r.sono||'';}document.getElementById('pComplaint').value=r.pComplaint||'';document.getElementById('rText').value=r.text||'';editingId=r.id;document.getElementById('editMode').style.display='inline-block';document.getElementById('reportContent').innerHTML=r.html;document.getElementById('outCard').style.display='block';window.scrollTo(0,document.getElementById('formCard').offsetTop);}
function delR(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('azam_reports')||'[]').filter(x=>x.id!==id);localStorage.setItem('azam_reports',JSON.stringify(all));render();uploadToDriveFile('Azam_Medical_Backup_ALL.json',JSON.stringify(all));if(!navigator.onLine)localStorage.setItem('azam_pending_sync','1');}
function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF('p','mm',[180,210]);let rc=document.getElementById('reportContent');let txt=rc?rc.innerText:cleanForPrint(document.getElementById('rText').value);doc.setFontSize(11);doc.text(doc.splitTextToSize(txt,160),10,10);doc.save((document.getElementById('pName').value||'Report')+'.pdf');}
function init(){let s=document.getElementById('uType');if(s){s.innerHTML='';allNames.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);});}let pd=document.getElementById('pDate');if(pd)pd.valueAsDate=new Date();document.getElementById('templateCount').innerText=allTemplates.length+' Templates';render();updateNetStatus();}
init();
</script></body></html>
