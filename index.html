<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azam Medical - Login</title>
<style>body{font-family:system-ui;background:#eef2ff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 20px #0001;width:300px;text-align:center}input{width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#1d4ed8;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}</style>
</head><body>
<div class="box">
<h2 style="color:#1e40af;margin:0">Azam Medical Centre</h2><p>Admin Login</p>
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg" style="color:red;font-size:13px"></p>
</div>
<script>
function login(){
 if(pass.value==='Azam@123'){localStorage.setItem('azam_login','1');location.href='azam-admin.html';}
 else{msg.textContent='Wrong Password!';}
}
</script></body></html>
