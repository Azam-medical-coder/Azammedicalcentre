<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azam - Patient Check</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{background:#eef4ff;font-family:system-ui}.card{background:#fff;border-radius:16px;padding:14px;margin:10px auto;max-width:900px;box-shadow:0 4px 12px #0001}input{width:100%;padding:14px;border-radius:12px;border:2px solid #cbd5e1}.btn{background:#0a4eb5;color:#fff;border:none;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.small-btn{padding:6px 10px;border-radius:8px;border:none;margin:3px;font-weight:700;cursor:pointer}.hidden{display:none!important}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999}.modalBox{background:#fff;padding:16px;border-radius:14px;width:700px;max-width:95%;max-height:90%;overflow:auto}</style></head><body>
<div class="card" style="background:linear-gradient(135deg,#1e90ff,#0a2463);color:#fff;text-align:center"><h2>Azam Medical Centre</h2>Plot 27, Allama Iqbal Road, Manzoor Colony</div>
<div class="card"><h2 style="text-align:center;color:#0a4eb5">🔍 Patient Record Check</h2><div style="display:flex;gap:8px;margin-top:12px"><input id="cell" type="tel" placeholder="0300-XXXXXXX" onkeydown="if(event.key==='Enter')search()"><button class="btn" onclick="search()">Search</button></div><div id="result" style="margin-top:14px"></div></div>
<div id="viewModal" class="modal hidden"><div class="modalBox" id="modalContent"></div></div>
<script>
function search(){let c=cell.value.trim();let all=JSON.parse(localStorage.getItem('azam_opd')||'[]');let d=all.filter(r=>r.cell.includes(c));if(!d.length){result.innerHTML='<p style="text-align:center;color:red">No record</p>';return} result.innerHTML=d.map(r=>{let i=all.indexOf(r);return `<div style="border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0"><b>${r.name} (${r.age} ${r.gender})</b> - ${r.date}<br><small>${r.diag}</small><br><div style="margin-top:8px"><button class="small-btn" style="background:#0a4eb5;color:#fff" onclick="viewRec(${i})">View</button><button class="small-btn" style="background:#f59e0b;color:#fff" onclick="openPDF(${i})">Download PDF</button><button class="small-btn" style="background:#10b981;color:#fff" onclick="downloadPres(${i})">Prescription Download</button></div></div>`}).join('')}
function viewRec(i){let r=JSON.parse(localStorage.getItem('azam_opd')||'[]')[i];modalContent.innerHTML=`<h3>${r.name} - ${r.cell}</h3><p>Date: ${r.date} | Follow: ${r.follow||'-'}<br>Diag: ${r.diag}<br>Pres: ${r.pres}</p><div style="display:flex;flex-wrap:wrap">${(r.presImages||[]).map(im=>`<img src="${im}" style="width:80px;height:80px;margin:4px;border-radius:8px">`).join('')}${(r.testImages||[]).map(im=>`<img src="${im}" style="width:80px;height:80px;margin:4px;border-radius:8px;border:2px solid green">`).join('')}</div><br><button class="small-btn" style="background:#0a4eb5;color:#fff" onclick="viewModal.classList.add('hidden')">Close</button>`;viewModal.classList.remove('hidden')}
function downloadPres(i){let r=JSON.parse(localStorage.getItem('azam_opd')||'[]')[i];if(!r.presImages?.length){alert('No image');return} r.presImages.forEach((im,idx)=>{let a=document.createElement('a');a.href=im;a.download=`Azam-${r.name}-${idx+1}.jpg`;document.body.appendChild(a);a.click();a.remove()})}
function openPDF(i){let r=JSON.parse(localStorage.getItem('azam_opd')||'[]')[i];const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.text(`Azam Medical Centre - ${r.name}`,10,15);doc.text(`Cell: ${r.cell} Date: ${r.date}`,10,25);doc.text(`Diagnosis: ${r.diag}`,10,35);let l=doc.splitTextToSize(`Prescription: ${r.pres}`,180);doc.text(l,10,45);if(r.presImages?.[0])try{doc.addImage(r.presImages[0],'JPEG',10,60+l.length*5,90,70)}catch(e){} doc.save(`Azam-${r.name}.pdf`)}
viewModal.addEventListener('click',e=>{if(e.target===viewModal)viewModal.classList.add('hidden')});
</script></body></html>
